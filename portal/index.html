<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐策雲 DineOS｜餐飲經營管理系統</title>
<link rel="stylesheet" href="../consult/kit/kit.css" data-kit>
<style>
:root{
  --bg:#f2f4f3; --panel:#ffffff; --line:#e0e5e2; --fg:#16201c; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f6f8f7; --side:#0e2a24; --side-fg:#d6e6e1; --side-mute:#8fb0a7;
  --c1:#0f6b5c; --c2:#2557c7; --c3:#a35a06; --c4:#6d3fc4; --c5:#b0452b;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --panel:#18201d; --line:#2a3632; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; --side:#0b1311; --side-fg:#d6e6e1; --side-mute:#7f9a92;
  --c1:#4fc3ad; --c2:#7ea6ff; --c3:#f0a94a; --c4:#b49bff; --c5:#ff9a7a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.3}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:16px;margin:0}
a{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 12px}.note{color:var(--mute);font-size:13px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:inherit}
button,a.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:9px;padding:8px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button:disabled{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.msg{padding:10px 12px;border-radius:10px;background:var(--accent-soft);margin:10px 0}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;white-space:nowrap;line-height:1.75}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--field);color:var(--mute);border:1px solid var(--line)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mute);font-weight:600}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--field)}

/* 登入頁：左品牌、右登入 */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);min-height:100vh}
.brand{background:radial-gradient(1200px 600px at -10% -20%,#1d6b5c 0,transparent 60%),linear-gradient(160deg,#0e2a24,#0a1e1a);color:#e6f1ed;padding:56px 56px 40px;display:flex;flex-direction:column;gap:26px}
.brand .lm{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#e2552b,#f2a93b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 20px rgba(226,85,43,.35)}
.brand h1{font-size:34px;color:#fff;letter-spacing:.01em}
.brand p{color:#a9c6bd;margin:8px 0 0;max-width:30em}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.feat div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;animation:kit-in .5s cubic-bezier(.2,.8,.2,1) both}
.feat div:nth-child(2){animation-delay:.06s}.feat div:nth-child(3){animation-delay:.12s}.feat div:nth-child(4){animation-delay:.18s}
.feat b{display:block;color:#fff;font-size:15px}.feat span{font-size:13px;color:#a9c6bd}
.feat i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);margin-bottom:8px;font-weight:700}
.brand .foot{margin-top:auto;font-size:12px;color:#7fa197}
.auth{display:grid;place-items:center;padding:40px 24px}
.auth .card{width:100%;max-width:400px;padding:28px;box-shadow:0 10px 40px rgba(16,24,22,.08)}
.auth h2{font-size:22px}
.auth button.pri{width:100%;padding:11px}

/* 登入後：左側選單＋主畫面 */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo .lm{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e2552b,#f2a93b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.logo b{display:block;font-size:15px;color:#fff}.logo span{font-size:12px;color:var(--side-mute)}
.nav-h{font-size:11px;letter-spacing:.08em;color:var(--side-mute);padding:14px 10px 4px}
.side .nv{width:100%;justify-content:flex-start;background:transparent;border:0;color:var(--side-fg);padding:8px 10px;border-radius:9px;font-size:14px;gap:10px;text-decoration:none;display:flex;align-items:center}
.side .nv:hover{background:rgba(255,255,255,.07)}
.side .nv.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side .nv i{font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.1)}
.side .nv.lock{opacity:.5}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--side-mute);word-break:break-all}
.side .foot button{width:100%;margin-top:8px;font-size:12px;padding:6px;background:rgba(255,255,255,.08);border:0;color:var(--side-fg)}
.main{padding:30px 36px 64px;max-width:1240px;width:100%}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hero p{margin:4px 0 0;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}.sec h2{margin:0}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:0 0 24px}
.app{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:206px;position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.app::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--cc);opacity:.07;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.app:hover{transform:translateY(-3px);box-shadow:var(--kit-shadow-up);border-color:color-mix(in srgb,var(--cc) 40%,var(--line))}
.app:hover::after{transform:scale(1.25)}
.app.on{border-color:color-mix(in srgb,var(--cc) 35%,var(--line))}
.app.off{background:color-mix(in srgb,var(--panel) 70%,var(--bg))}
.app.off .ic{filter:grayscale(1);opacity:.6}
.app .hd{display:flex;justify-content:space-between;align-items:center}
.app .ic{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc);display:grid;place-items:center;font-weight:800;font-size:16px}
.app p{margin:0;color:var(--mute);font-size:14px}
.app .go{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.subbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 24px}
.subbar .ic{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--c4) 14%,transparent);color:var(--c4);display:grid;place-items:center;font-weight:800}
.subbar b{font-size:16px}
.consult{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#0e2a24,#145247);color:#e6f1ed;border-radius:16px;padding:20px 22px;margin:0 0 20px}
.consult h2{color:#fff;margin:0 0 4px}.consult p{margin:0;color:#a9c6bd;font-size:14px}
.consult a.btn{background:#fff;color:#0e2a24;border-color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 14px}
.kpi{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mute)}
.search{max-width:280px;padding:7px 12px;border-radius:999px}
@media (max-width:1000px){.split{grid-template-columns:1fr}.brand{padding:32px 20px}.brand h1{font-size:26px}.auth{padding:24px 16px 40px}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:6px}
  .side .nv{width:auto;padding:6px 10px}
  .logo{padding:0 8px 0 0}.nav-h,.side .foot,.side .navs{display:none}
  .main{padding:20px 16px 56px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subbar{grid-template-columns:auto minmax(0,1fr)}.subbar .go{grid-column:1/-1}
}
.link{border:0!important;background:none!important;color:var(--accent)!important}
button.sm{font-size:12px;padding:4px 10px}
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mod{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.mod.ok{background:var(--good-bg);color:var(--good)}.mod.wait{background:var(--warn-bg);color:var(--warn)}.mod.no{background:var(--field);color:var(--mute);border-color:var(--line);font-weight:400}
.mods-h{font-size:12px;color:var(--mute);margin:14px 0 6px;letter-spacing:.04em}
.subcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 24px}
.sc-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.sc-h .ic{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--c4) 14%,transparent);color:var(--c4);display:grid;place-items:center;font-weight:800}
.sc-h b{font-size:16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 0}
.facts div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.facts dt{font-size:12px;color:var(--mute)}.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.ro{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
table.owners td{vertical-align:top}table.matrix td,table.matrix th{text-align:center}table.matrix th:first-child{text-align:left}
@media (max-width:900px){.sc-h{grid-template-columns:auto minmax(0,1fr)}.sc-h>.btn{grid-column:1/-1}.facts{grid-template-columns:1fr}.acct{grid-template-columns:1fr;gap:6px}}
@media (max-width:560px){.feat{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<div id="root"><p class="sub" style="padding:24px">讀取中…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL='https://thxqncpkkzmpktwuvzvz.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeHFuY3Bra3ptcGt0d3V2enZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTMyODcsImV4cCI6MjEwNjk4OTI4N30.cDjeuOxx2UZLrOWYcNhqy4dO2cdznscJ7CWr0DZGZ2g';
const BOM='https://marvintien90-jpg.github.io/bom-center/', PL='https://marvintien90-jpg.github.io/pl-center/', MEMBER=BOM+'member/', PORTAL=BOM+'portal/';
const NAME='餐策雲', NAME_EN='DineOS';
const sbc=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const addDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const SUB={trial:['試用中','good'],active:['訂閱中','good'],past_due:['扣款失敗，寬限中','warn'],canceled:['已取消續訂','warn'],expired:['已到期','bad'],comp:['免費招待','good']};
const PLAN={basic:'基本版',pro:'進階版',member:'顧問會員'};
/* 系統模組（業主可用的系統）。新系統上線前要先跟 Marvin 確認：哪些方案包含它、要不要訂閱才能用。
   gate：'bom'／'pl'＝看該系統自己的帳號開通；'module'＝看訂閱方案的模組（sub_plans.modules）或顧問加開（sub_module_grants）；'admin'＝只限顧問。 */
const SYSTEMS=[
  {key:'bom',ic:'B',name:'BOM 運算中心',short:'BOM',desc:'食材成本、配方 BOM、叫貨與庫存。',url:BOM,gate:'bom',c:'--c1'},
  {key:'pl',ic:'損',name:'損益分析中心',short:'損益',desc:'每月損益、成本結構與門市比較。',url:PL,gate:'pl',c:'--c2'},
  {key:'hr',ic:'人',name:'人資與勞基法中心',short:'人資',desc:'人資範本、勞基法查詢、員工名單與勞健保試算。',url:BOM+'hr/',gate:'module',c:'--c3'},
  {key:'site',ic:'址',name:'餐飲立地評估（顧問專用）',short:'立地',desc:'顧問評估店面：商圈客群、人流、競爭、租金與損益。',url:BOM+'site/',gate:'admin',c:'--c5'}];
const OWNER_MODS=SYSTEMS.filter(x=>x.gate!=='admin');
const GRANTABLE=SYSTEMS.filter(x=>x.gate==='module');
const DEFAULT_MODS={basic:['bom','pl'],pro:['bom','pl','hr'],member:['bom','pl','hr']};

let me=null, bom=null, pl=null, sub=null, plans=[], cfg={}, myGrants=[], myMods=null, isAdmin=false, all=null, allGrants=[];
let mode='login', msg='', bad=false, recovering=false, ownerQ='';

/* 帳號開通狀態：ok 可進入；pending 等待開通；off 已到期或停用；none 沒有 */
function access(p, needConfirm){
  if(!p) return {k:'none'};
  if(p.role==='admin'&&p.status==='active') return {k:'ok',admin:true};
  if(p.status==='pending') return {k:'pending'};
  if(p.status!=='active') return {k:'off',why:'已停用'};
  if(p.expires_on&&p.expires_on<today()) return {k:'off',why:'已於 '+p.expires_on+' 到期'};
  if(needConfirm&&me&&!me.email_confirmed_at) return {k:'pending',why:'請先到信箱點驗證信'};
  return {k:'ok',until:p.expires_on||null};
}
/* 訂閱可用到哪天（與資料庫 sub_private.access_until 相同）：null＝不限期，''＝已不能用 */
function subUntil(s){
  if(!s) return '';
  if(s.status==='comp') return null;
  if(s.status==='expired') return '';
  if(s.status==='trial') return s.trial_ends_on||'';
  if(s.status==='canceled') return s.period_end||s.trial_ends_on||'';
  const d=s.period_end||s.trial_ends_on; return d?addDays(d,+(cfg.grace_days||0)):'';
}
const subValid=s=>!!s&&(s.status==='comp'||(subUntil(s)||'')>=today());
const planMods=code=>{const p=plans.find(x=>x.code===code); return (p&&Array.isArray(p.modules))?p.modules:(DEFAULT_MODS[code]||['bom','pl'])};
function modsFor(s,grants,adm){
  const m={};
  if(adm){ OWNER_MODS.forEach(x=>m[x.key]={src:'admin',until:null}); return m }
  if(subValid(s)) planMods(s.plan).forEach(k=>m[k]={src:'sub',until:subUntil(s)});
  (grants||[]).forEach(g=>{ if((!g.until||g.until>=today())&&!m[g.module]) m[g.module]={src:'grant',until:g.until||null} });
  return m;
}
/* 某個系統對某個人的狀態 */
function sysAccess(x,r){
  if(x.gate==='admin') return r.admin?{k:'ok',admin:true}:{k:'none'};
  if(x.gate==='bom') return access(r.bom,false);
  if(x.gate==='pl') return access(r.pl,r.self);
  const m=r.mods[x.key];
  if(m) return {k:'ok',admin:m.src==='admin',until:m.until||null,src:m.src};
  return {k:'none',why:'需要訂閱'};
}
const SRC={sub:'訂閱方案',grant:'顧問加開',admin:'管理員'};
const pillOf=a=>a.k==='ok'?`<span class="pill good">${a.admin?'管理員':'可使用'+(a.until?'・到 '+esc(a.until):'')}</span>`:a.k==='pending'?`<span class="pill warn">${esc(a.why||'等待開通')}</span>`:a.k==='off'?`<span class="pill bad">${esc(a.why)}</span>`:`<span class="pill mute">${esc(a.why||'未開通')}</span>`;

const safe=async p=>{try{const r=await p; return r.error?{data:null,error:r.error}:r}catch(e){return {data:null,error:e}}};
async function load(){
  const {data:{session}}=await sbc.auth.getSession(); me=session&&session.user||null; bom=pl=sub=all=myMods=null; myGrants=[]; isAdmin=false;
  if(me){
    const [b,p,s,pp,st,g,mm]=await Promise.all([
      safe(sbc.from('bom_profiles').select('*').eq('user_id',me.id).maybeSingle()),
      safe(sbc.from('pl_profiles').select('*').eq('user_id',me.id).maybeSingle()),
      safe(sbc.from('sub_subscriptions').select('*').eq('user_id',me.id).maybeSingle()),
      safe(sbc.from('sub_plans').select('*').order('sort')),
      safe(sbc.from('sub_settings').select('grace_days').eq('id',1).maybeSingle()),
      safe(sbc.from('sub_module_grants').select('*').eq('user_id',me.id)),
      safe(sbc.rpc('sub_my_modules'))]);
    bom=b.data||null; pl=p.data||null; sub=s.data||null; plans=pp.data||[]; cfg=st.data||{}; myGrants=g.data||[];
    isAdmin=!!(bom&&bom.role==='admin'&&bom.status==='active');
    if(Array.isArray(mm.data)){ myMods={}; mm.data.forEach(r=>{ if(!myMods[r.module]) myMods[r.module]={src:r.source,until:r.until} }) }
    else myMods=modsFor(sub,myGrants,isAdmin);
    if(isAdmin) await loadAll();
  }
  render();
}
async function loadAll(){
  const [b,p,s,g]=await Promise.all([safe(sbc.from('bom_profiles').select('*')),safe(sbc.from('pl_profiles').select('*')),safe(sbc.from('sub_subscriptions').select('*')),safe(sbc.from('sub_module_grants').select('*'))]);
  const rows={}; const add=(r,k)=>{ if(!r||!r.user_id) return; (rows[r.user_id]=rows[r.user_id]||{id:r.user_id})[k]=r };
  (b.data||[]).forEach(r=>add(r,'bom')); (p.data||[]).forEach(r=>add(r,'pl')); (s.data||[]).forEach(r=>add(r,'sub'));
  allGrants=g.data||[]; allGrants.forEach(x=>{ if(rows[x.user_id]) (rows[x.user_id].grants=rows[x.user_id].grants||[]).push(x) });
  all=Object.values(rows).filter(r=>!((r.bom&&r.bom.role==='admin')||(r.pl&&r.pl.role==='admin')));
  all.forEach(r=>{ r.mods=modsFor(r.sub,r.grants,false) });
}
const meRow=()=>({bom,pl,sub,admin:isAdmin,self:true,mods:myMods||{}});

const FEAT=[['B','BOM 運算中心','食材成本、配方 BOM、叫貨與庫存'],['損','損益分析中心','每月損益、成本結構與門市比較'],['人','人資與勞基法','人資範本、勞基法查詢、勞健保試算'],['訂','訂閱中心','方案、授權模組、發票與每月健檢簡報']];
const logo=(sz)=>`<div class="lm"${sz?` style="width:${sz}px;height:${sz}px"`:''}>策</div>`;
function viewLogin(){
  const fg=mode==='forgot';
  return `<div class="split"><section class="brand"><div style="display:flex;gap:12px;align-items:center">${logo()}<div><b style="color:#fff;font-size:17px">${NAME} ${NAME_EN}</b><div style="font-size:12px;color:#8fb0a7">餐飲經營管理系統｜品牌加辣餐飲顧問工作室</div></div></div>
  <div><h1>一組帳號，<br>管好你的每一家店</h1><p>${NAME} ${NAME_EN} 把成本、損益、人資和訂閱整合在一起。登入一次，各系統之間不用再重新登入。</p></div>
  <div class="feat">${FEAT.map(f=>`<div><i>${f[0]}</i><b>${f[1]}</b><span>${f[2]}</span></div>`).join('')}</div>
  <div class="foot">資料存在雲端，手機、平板、電腦都能用。</div></section>
  <section class="auth"><div class="card"><h2>${fg?'重設密碼':'登入 '+NAME_EN}</h2><p class="sub">${fg?'輸入註冊的 Email，我們會寄重設連結給你。':'歡迎回來，請用你的 Email 登入。'}</p><div id="flash">${flash()}</div>
  <form id="auth"><label for="em">Email</label><input id="em" type="email" required autocomplete="email" placeholder="name@example.com">
  ${fg?'':'<label for="pw">密碼</label><input id="pw" type="password" required minlength="6" autocomplete="current-password">'}
  <div class="row" style="margin-top:18px"><button class="pri" type="submit">${fg?'寄重設信':'登入'}</button></div>
  <div class="row" style="justify-content:center;margin-top:8px">${fg?'<button type="button" class="kit-calm link" data-mode="login">回到登入</button>':'<button type="button" class="kit-calm link" data-mode="forgot">忘記密碼</button>'}</div></form>
  <p class="note" style="text-align:center">還沒有帳號？<a href="${MEMBER}?mode=up">到訂閱中心註冊</a>，可以免費試用 14 天。<br>顧問開通的業主，請用顧問給你的 Email 登入。</p></div></section></div>`;
}
function viewRecover(){
  return `<div class="auth" style="min-height:100vh"><div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${logo(36)}<b>${NAME} ${NAME_EN}</b></div><h2>設定新密碼</h2><p class="sub">${esc(me&&me.email||'')}<br>請輸入新的密碼（至少 8 碼），儲存後所有系統都用這組新密碼登入。</p><div id="flash">${flash()}</div>
  <form id="pwf"><label for="np">新密碼</label><input id="np" type="password" required minlength="8" autocomplete="new-password"><label for="np2">再輸入一次</label><input id="np2" type="password" required minlength="8" autocomplete="new-password">
  <div class="row" style="margin-top:18px"><button class="pri" type="submit">儲存新密碼</button></div></form></div></div>`;
}
function appCard(x,a){
  const cls=a.k==='ok'?'on':(a.k==='none'||a.k==='off')?'off':'';
  let go;
  if(a.k==='ok') go=`<a class="btn pri" href="${esc(x.url)}">進入 ${esc(x.name.replace(/（.*）/,''))}</a>`;
  else if(a.k==='pending') go=`<a class="btn" href="${esc(x.url)}">查看開通進度</a>`;
  else go=`<a class="btn" href="${MEMBER}">${x.gate==='module'?'看包含這個系統的方案':sub?'到訂閱中心續訂':'到訂閱中心訂閱'}</a>`;
  const src=a.k==='ok'&&a.src&&a.src!=='admin'?`<span class="note" style="margin:0">授權來源：${SRC[a.src]}</span>`:'';
  return `<article class="app ${cls}" style="--cc:var(${x.c})"><div class="hd"><div class="ic" aria-hidden="true">${esc(x.ic)}</div>${pillOf(a)}</div><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p>${src}<div class="go">${go}</div></article>`;
}
function sideNav(list){
  const nav=list.map(({x,a})=>`<a class="nv ${a.k==='ok'?'':'lock'}" href="${a.k==='ok'?esc(x.url):MEMBER}"><i>${esc(x.ic)}</i>${esc(x.short)}</a>`).join('');
  return `<aside class="side"><div class="logo">${logo()}<div><b>${NAME} ${NAME_EN}</b><span>餐飲經營管理系統</span></div></div>
   <div class="nav-h">首頁</div><button type="button" class="nv on" data-jump="top"><i>⌂</i>我的系統</button><button type="button" class="nv" data-jump="mysub"><i>訂</i>訂閱與授權</button><button type="button" class="nv" data-jump="account"><i>帳</i>帳號設定</button>
   ${isAdmin?`<div class="nav-h">顧問</div><a class="nv" href="${BOM}consult/"><i>顧</i>顧問工作台</a><button type="button" class="nv" data-jump="owners"><i>總</i>業主總覽</button><a class="nv" href="${MEMBER}"><i>管</i>訂閱管理</a>`:''}
   <div class="navs"><div class="nav-h">系統</div>${nav}</div>
   <div class="foot">${esc(me.email)}<button type="button" data-act="out">登出</button></div></aside>`;
}
const chip=(x,a,extra)=>`<span class="mod ${a.k==='ok'?'ok':a.k==='pending'?'wait':'no'}" title="${esc(x.name)}：${a.k==='ok'?'可使用'+(a.src?'（'+SRC[a.src]+'）':''):a.k==='pending'?'等待開通':esc(a.why||'未開通')}">${a.k==='ok'?'✓':a.k==='pending'?'…':'✕'} ${esc(x.short)}${extra||''}</span>`;
function mySubCard(){
  const r=meRow();
  if(isAdmin) return `<section class="subcard" id="mysub"><div class="sc-h"><div class="ic" aria-hidden="true">訂</div><div><b>訂閱與授權</b><div class="note" style="margin:0">你是管理員，所有系統都能使用。業主的訂閱與模組請看下方「業主總覽」。</div></div><a class="btn pri" href="${MEMBER}">進入訂閱管理</a></div></section>`;
  const sa=sub?SUB[sub.status]||[sub.status,'mute']:null, u=sub?subUntil(sub):'';
  const until=!sub?'–':sub.status==='comp'?'不限期':sub.status==='trial'?'試用到 '+esc(sub.trial_ends_on||''):u?'可用到 '+esc(u):'已停止';
  return `<section class="subcard" id="mysub"><div class="sc-h"><div class="ic" aria-hidden="true">訂</div><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>我的訂閱</b>${sa?`<span class="pill ${sa[1]}">${sa[0]}</span>`:'<span class="pill mute">還沒訂閱</span>'}</div><div class="note" style="margin:2px 0 0">${sub?'訂閱中心可以換方案、綁卡、下載發票與健檢簡報。':'訂閱後才能使用人資與勞基法中心等模組，可以先免費試用 14 天。'}</div></div><a class="btn pri" href="${MEMBER}">${sub?'進入訂閱中心':'看方案、免費試用'}</a></div>
  <dl class="facts"><div><dt>方案</dt><dd>${sub?esc(PLAN[sub.plan]||sub.plan)+'・'+(sub.stores||1)+' 店':'–'}</dd></div><div><dt>期限</dt><dd>${until}</dd></div><div><dt>公司</dt><dd>${esc(sub&&sub.company||'–')}</dd></div></dl>
  <div class="mods-h">授權使用的系統模組</div><div class="mods">${OWNER_MODS.map(x=>chip(x,sysAccess(x,r))).join('')}</div>
  <p class="note">BOM 與損益分析中心由顧問開通帳號或訂閱後自動開通；人資與勞基法中心要訂閱進階版、顧問會員，或由顧問另外加開。</p></section>`;
}
function accountCard(){
  return `<section class="card" id="account"><div class="sec" style="margin-top:0"><h2>帳號設定</h2></div><p class="sub">這組帳號密碼同時用在 ${NAME} 的所有系統（BOM、損益、人資、訂閱中心），只要在這裡改一次。</p>
  <div class="acct"><div><label>登入 Email</label><div class="ro">${esc(me.email)}</div><p class="note">要換登入 Email，請聯絡顧問。</p></div>
  <form id="pwf"><label for="np">新密碼（至少 8 碼）</label><input id="np" type="password" required minlength="8" autocomplete="new-password"><label for="np2">再輸入一次</label><input id="np2" type="password" required minlength="8" autocomplete="new-password">
  <div class="row"><button class="pri" type="submit">更改密碼</button></div></form></div></section>`;
}
function viewHome(){
  const r=meRow(), list=SYSTEMS.filter(x=>x.gate!=='admin'||isAdmin).map(x=>({x,a:sysAccess(x,r)}));
  const h=new Date(Date.now()+8*3600e3).getUTCHours(), g=h<11?'早安':h<18?'午安':'晚安';
  const who=sub&&sub.company||'', okN=list.filter(o=>o.a.k==='ok').length;
  return `<div class="shell">${sideNav(list)}<main class="main" id="app">
  <header class="hero" id="top"><div><h1>${g}${who?'，'+esc(who):''}</h1><p>你目前可以使用 <b data-count="${okN}">${okN}</b> 個系統。點卡片直接進入，不用再登入。</p></div></header>
  <div id="flash">${flash()}</div>
  ${isAdmin?`<section class="consult"><div><h2>顧問工作台</h2><p>健檢名單、輔導客戶、組織診斷、加盟、SOP 等顧問專用系統，一頁切換。業主看不到。</p></div><a class="btn" href="${BOM}consult/">進入顧問工作台 →</a></section>`:''}
  <div class="sec"><h2>我的系統</h2><span class="note" style="margin:0">綠色標籤＝可以使用</span></div>
  <div class="apps">${list.map(o=>appCard(o.x,o.a)).join('')}</div>
  ${!isAdmin&&!list.some(o=>o.a.k==='ok')&&!sub?`<div class="card"><h2>這個帳號還沒開通任何系統</h2><p class="sub" style="margin:0">如果你已經跟顧問簽約，請等開通通知信；也可以先到訂閱中心開始 14 天免費試用。</p></div>`:''}
  <div class="sec"><h2>訂閱與授權</h2></div>${mySubCard()}
  ${isAdmin?viewAdmin():''}
  ${accountCard()}</main></div>`;
}
function filtered(){ const q=ownerQ.trim().toLowerCase(); return (all||[]).slice().sort((a,b)=>mail(a).localeCompare(mail(b))).filter(r=>!q||(mail(r)+' '+(r.sub&&r.sub.company||'')).toLowerCase().includes(q)) }
function viewAdmin(){
  const rows=all||[], soonD=new Date(Date.now()+8*3600e3+30*864e5).toISOString().slice(0,10);
  const soon=d=>d&&d>=today()&&d<=soonD;
  const k={n:rows.length,subs:rows.filter(r=>subValid(r.sub)).length,
    pend:rows.filter(r=>access(r.bom,false).k==='pending'||access(r.pl,false).k==='pending').length,
    soon:rows.filter(r=>soon(r.bom&&r.bom.expires_on)||soon(r.pl&&r.pl.expires_on)||soon(r.sub&&subUntil(r.sub))).length};
  const mat=plans.filter(p=>p.active!==false).map(p=>`<tr><th>${esc(p.name)}</th>${OWNER_MODS.map(x=>`<td>${planMods(p.code).includes(x.key)?'<span class="mod ok">✓ 包含</span>':'<span class="mod no">✕</span>'}</td>`).join('')}</tr>`).join('');
  return `<section class="card" id="owners"><div class="sec" style="margin-top:0"><h2>業主總覽</h2><input class="search" id="ownerq" type="search" placeholder="搜尋業主或 Email" value="${esc(ownerQ)}" aria-label="搜尋業主"></div>
  <p class="sub">每位業主的訂閱狀態，以及授權使用哪些系統模組。✓＝可使用、…＝等待開通、✕＝沒有。</p>
  <div class="kpis"><div class="kpi"><b data-count="${k.n}">${k.n}</b><span>業主</span></div><div class="kpi"><b data-count="${k.subs}">${k.subs}</b><span>訂閱有效</span></div><div class="kpi"><b data-count="${k.pend}">${k.pend}</b><span>等待開通</span></div><div class="kpi"><b data-count="${k.soon}">${k.soon}</b><span>30 天內到期</span></div></div>
  <div class="scroll"><table class="owners"><thead><tr><th>業主</th><th>訂閱狀態</th><th>授權模組</th><th>顧問加開</th></tr></thead><tbody id="ownerrows">${ownerRows(filtered())}</tbody></table></div>
  <h3 style="margin:22px 0 8px">各方案包含的模組</h3><div class="scroll"><table class="matrix"><thead><tr><th>方案</th>${OWNER_MODS.map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr></thead><tbody>${mat||'<tr><td colspan="4">讀不到方案。</td></tr>'}</tbody></table></div>
  <p class="note">方案包含哪些模組，在「訂閱管理 → 設定與價格」調整。BOM、損益的帳號開通、延長或停用，到各系統的授權管理。</p>
  <div class="row"><a class="btn" href="${MEMBER}">訂閱管理</a><a class="btn" href="${BOM}#admin">BOM 授權管理</a><a class="btn" href="${PL}">損益中心帳號管理</a></div></section>`;
}
function ownerRows(rows){
  return rows.map(r=>{
    const s=r.sub, sa=s?SUB[s.status]||[s.status,'mute']:null, u=s?subUntil(s):'';
    const subTd=sa?`<span class="pill ${sa[1]}">${sa[0]}</span> ${esc(PLAN[s.plan]||s.plan)}<br><span class="note">${s.status==='comp'?'不限期':u?'到 '+esc(u):'已停止'}</span>`:'<span class="pill mute">沒有訂閱</span>';
    const mods=OWNER_MODS.map(x=>chip(x,sysAccess(x,{...r,admin:false}))).join('');
    const gr=GRANTABLE.map(x=>{const on=(r.grants||[]).some(g=>g.module===x.key); return `<button type="button" class="${on?'':'pri'} sm" data-grant="${esc(r.id)}" data-mod="${x.key}" data-on="${on?0:1}">${on?'取消加開'+esc(x.short):'加開'+esc(x.short)}</button>`}).join(' ');
    return `<tr><td>${esc(s&&s.company||'')}${s&&s.company?'<br>':''}<span class="note">${esc(mail(r))}</span></td><td>${subTd}</td><td><div class="mods">${mods}</div></td><td>${gr}</td></tr>`}).join('')||`<tr><td colspan="4">${(all||[]).length?'找不到符合的業主。':'還沒有業主。'}</td></tr>`;
}
const mail=r=>(r.sub&&r.sub.email)||(r.bom&&r.bom.email)||(r.pl&&r.pl.email)||'';
const flash=()=>msg?`<div class="msg ${bad?'bad':''}" role="status">${esc(msg)}</div>`:'';

function render(){
  $('#root').innerHTML=recovering&&me?viewRecover():me?viewHome():viewLogin();
  if(window.Kit) Kit.countUp($('#root'));
  if(me&&!recovering&&location.hash==='#account'){ const t=document.getElementById('account'); if(t) t.scrollIntoView({block:'start'}) }
}
const say=(t,b)=>{msg=t;bad=!!b;render()};
const errMsg=e=>{const m=(e&&(e.message||e))+''; if(/Invalid login/i.test(m)) return 'Email 或密碼不正確。'; if(/Email not confirmed/i.test(m)) return '這個 Email 還沒驗證，請先到信箱點驗證信。'; if(/different from the old/i.test(m)) return '新密碼不能和原本的密碼一樣，請換一組。'; if(/Password should|at least/i.test(m)) return '密碼至少 8 碼。'; if(/reauth|recent/i.test(m)) return '為了安全，請先登出再用「忘記密碼」重設。'; return '操作失敗，請稍後再試。（'+m.slice(0,80)+'）'};

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.mode){ mode=d.mode; msg=''; return render() }
  if(d.act==='out'){ await sbc.auth.signOut(); msg=''; mode='login'; recovering=false; return load() }
  if(d.jump){ const t=document.getElementById(d.jump); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return }
  if(d.grant){ b.disabled=true; try{
      const on=d.on==='1', q=on?sbc.from('sub_module_grants').upsert({user_id:d.grant,module:d.mod,until:null,note:'顧問加開'}):sbc.from('sub_module_grants').delete().eq('user_id',d.grant).eq('module',d.mod);
      const {error}=await q; if(error) throw error; await loadAll(); const n=(SYSTEMS.find(x=>x.key===d.mod)||{}).name||d.mod; say(on?'已加開'+n+'。':'已取消加開'+n+'（若方案本身包含，仍可使用）。');
    }catch(e){ say(/sub_module_grants|relation|schema cache/i.test((e&&e.message)||'')?'資料庫還沒更新模組授權，請先執行資料庫更新。':errMsg(e),true) } }
});
document.addEventListener('input',ev=>{ if(ev.target.id==='ownerq'){ ownerQ=ev.target.value; $('#ownerrows').innerHTML=ownerRows(filtered()) } });
document.addEventListener('submit',async ev=>{
  const f=ev.target; if(f.id!=='auth'&&f.id!=='pwf') return; ev.preventDefault();
  const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    if(f.id==='pwf'){
      const a=$('#np').value, c=$('#np2').value;
      if(a.length<8) return say('密碼至少 8 碼。',true); if(a!==c) return say('兩次輸入的密碼不一樣，請再確認。',true);
      const {error}=await sbc.auth.updateUser({password:a}); if(error) throw error;
      const was=recovering; recovering=false; try{history.replaceState(null,'',location.pathname)}catch(_){}
      return say(was?'新密碼已設定，現在已經登入。所有系統都用這組新密碼。':'密碼已更新，下次登入任何系統都用新密碼。');
    }
    const em=$('#em').value.trim();
    if(mode==='forgot'){ const {error}=await sbc.auth.resetPasswordForEmail(em,{redirectTo:PORTAL}); if(error) throw error; mode='login'; return say('如果這個 Email 有註冊過，重設信已經寄出。請在一小時內點信裡的連結。') }
    const {error}=await sbc.auth.signInWithPassword({email:em,password:$('#pw').value}); if(error) throw error; msg=''; await load();
  }catch(e){ say(errMsg(e),true) }finally{ if(document.body.contains(btn)) btn.disabled=false }
});
sbc.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'){ recovering=true; msg=''; return load() } if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
if(/type=recovery/.test(location.hash)) recovering=true;
load();
</script>
<script src="../consult/kit/kit.js"></script>
<script>window.Kit&&Kit.init({tool:'portal',bar:false})</script>
</body>
</html>
