<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員中心｜BOM 運算中心＋損益分析中心</title>
<style>
:root{
  --bg:#f3f5f4; --panel:#ffffff; --line:#d9dfdc; --fg:#18211e; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f7f9f8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans)}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 12px}.note{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.plan.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.price{font-size:22px;font-weight:700}.price small{font-size:13px;font-weight:400;color:var(--mute)}
.plan ul{margin:4px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
label{display:block;font-size:14px;margin:10px 0 4px}
input,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;color:inherit}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.del{color:var(--bad)}button:disabled{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.msg{padding:10px 12px;border-radius:8px;background:var(--accent-soft);margin:10px 0}
.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--accent-soft);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>會員中心</h1>
  <p class="sub">BOM 運算中心＋損益分析中心｜品牌加辣餐飲顧問工作室</p>
  <div id="app"><p class="sub">讀取中…</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL='https://thxqncpkkzmpktwuvzvz.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeHFuY3Bra3ptcGt0d3V2enZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTMyODcsImV4cCI6MjEwNjk4OTI4N30.cDjeuOxx2UZLrOWYcNhqy4dO2cdznscJ7CWr0DZGZ2g';
const BOM='https://marvintien90-jpg.github.io/bom-center/', PL='https://marvintien90-jpg.github.io/pl-center/';
const sbc=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'請洽詢':'NT$'+Number(n).toLocaleString('zh-TW');
const ERR={SUB_SIGNUP_CLOSED:'目前還沒開放自助試用。想先試用，請用 LINE 或 Email 聯絡我們加入試點名單。',SUB_EXISTS:'這個帳號已經有試用或訂閱了。',SUB_HAS_ACCESS:'這個帳號已經由顧問開通使用，方案與續約請直接聯絡顧問。',SUB_BAD_INPUT:'請填寫公司名稱與品牌名稱，店數 1 到 50。',SUB_BAD_PLAN:'這個方案目前無法選擇。',SUB_BUSY:'今天的試用名額已滿，請明天再試，或聯絡我們。',SUB_EMAIL_UNCONFIRMED:'請先到信箱點驗證信，再回來開始試用。',SUB_ADMIN:'管理員帳號不需要試用。',SUB_PAID_CHANGE_NEEDS_CHECKOUT:'付費中要換方案，請按「換方案並重新綁卡」。',BILLING_OFF:'線上付款還沒開放，請先用 LINE 聯絡我們辦理。',BILLING_TEST_ONLY:'線上付款目前在測試階段，只開放測試帳號。',PLAN_NO_PRICE:'這個方案還沒定價，請聯絡我們。',ALREADY_ACTIVE:'這個方案已經在自動扣款中。',TOO_MANY:'操作太頻繁，請 10 分鐘後再試。',NOT_RENEWING:'目前沒有自動扣款。',PROVIDER:'金流公司回覆失敗，請稍後再試或聯絡我們。'};
const errMsg=e=>{const m=(e&&(e.message||e.error||e))+'';for(const k in ERR) if(m.includes(k)) return ERR[k]; if(/Invalid login/i.test(m)) return 'Email 或密碼不正確。'; if(/already registered/i.test(m)) return '這個 Email 已經註冊過，請直接登入。'; if(/Password should/i.test(m)) return '密碼至少 8 碼。'; return '發生錯誤，請稍後再試。（'+m.slice(0,80)+'）'};
const STATUS={trial:['試用中','good'],active:['自動扣款中','good'],past_due:['扣款失敗，寬限中','warn'],canceled:['已取消自動扣款','warn'],expired:['已到期','bad']};

let me=null, sub=null, plans=[], cfg={}, pays=[], reps=[], isAdmin=false, msg='', bad=false, mode='login', pick={plan:'pro',stores:1}, adm=null, admTab='subs';

async function load(){
  const [p,c]=await Promise.all([sbc.from('sub_plans').select('*').eq('active',true).order('sort'),sbc.from('sub_settings').select('*').eq('id',1).maybeSingle()]);
  plans=p.data||[]; cfg=c.data||{};
  const {data:{session}}=await sbc.auth.getSession(); me=session&&session.user||null; sub=null; pays=[]; isAdmin=false;
  if(me){
    const pr=await sbc.from('bom_profiles').select('role,status').eq('user_id',me.id).maybeSingle(); isAdmin=!!(pr.data&&pr.data.role==='admin'&&pr.data.status==='active');
    const s=await sbc.from('sub_subscriptions').select('*').eq('user_id',me.id).maybeSingle(); sub=s.data||null;
    if(sub){ pick={plan:sub.plan,stores:sub.stores}; const q=await sbc.from('sub_payments').select('*').eq('user_id',me.id).neq('kind','checkout').order('created_at',{ascending:false}).limit(24); pays=q.data||[]; const rr=await sbc.from('sub_reports').select('*').eq('user_id',me.id).order('month',{ascending:false}).limit(24); reps=rr.data||[] }
    if(isAdmin) await loadAdmin();
  }
  render();
}
async function loadAdmin(){
  const [s,pl,lg]=await Promise.all([sbc.from('sub_subscriptions').select('*').order('created_at',{ascending:false}),sbc.from('sub_pilots').select('*').order('created_at',{ascending:false}),sbc.from('sub_log').select('*').order('at',{ascending:false}).limit(40)]);
  adm={subs:s.data||[],pilots:pl.data||[],log:lg.data||[]};
}
const planCards=(sel,click)=>`<div class="plans">${plans.map(p=>`<div class="plan ${sel===p.code?'sel':''}"><h3>${esc(p.name)}</h3><div class="price">${money(p.price_per_store)}<small> ／每店每月</small></div><ul>${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${click?`<div class="row" style="margin-top:auto"><button data-plan="${p.code}" ${sel===p.code?'class="pri"':''}>${sel===p.code?'已選擇':'選這個'}</button></div>`:''}</div>`).join('')}</div>`;
const flash=()=>msg?`<div class="msg ${bad?'bad':''}" role="status">${esc(msg)}</div>`:'';
const total=()=>{const p=plans.find(x=>x.code===pick.plan);return p&&p.price_per_store!=null?p.price_per_store*pick.stores:null};

function viewAuth(){
  const up=mode==='up', fg=mode==='forgot';
  return `<div class="card"><h2>方案與價格</h2><p class="sub">註冊後可免費試用 ${cfg.trial_days||14} 天，試用期間不收費；試用結束前再決定要不要綁卡。</p>${planCards(null,false)}</div>
<div class="card" style="max-width:460px"><h2>${fg?'重設密碼':up?'註冊帳號':'登入'}</h2>${flash()}
<form id="auth">${up?'<label for="nm">你的稱呼</label><input id="nm" maxlength="60" autocomplete="name">':''}
<label for="em">Email</label><input id="em" type="email" required autocomplete="email">
${fg?'':`<label for="pw">密碼${up?'（至少 8 碼）':''}</label><input id="pw" type="password" required minlength="8" autocomplete="${up?'new-password':'current-password'}">`}
<div class="row"><button class="pri" type="submit">${fg?'寄重設信':up?'註冊並寄驗證信':'登入'}</button>
${up||fg?'<button type="button" data-mode="login">我已經有帳號</button>':'<button type="button" data-mode="up">註冊新帳號</button><button type="button" data-mode="forgot">忘記密碼</button>'}</div></form>
<p class="note">同一組帳號可以登入 <a href="${BOM}">BOM 運算中心</a>與<a href="${PL}">損益分析中心</a>。</p></div>`;
}
function viewTrial(){
  const t=total();
  return `<div class="card"><h2>開始 ${cfg.trial_days||14} 天免費試用</h2><p class="sub">選一個方案試用，試用期間全部功能照方案開放，不用綁卡。系統會替你建立一個專屬品牌，只有你看得到。</p>${flash()}
${planCards(pick.plan,true)}
<form id="trial"><div class="grid2"><div><label for="co">公司名稱</label><input id="co" maxlength="60" required placeholder="例如：好吃餐飲有限公司"></div>
<div><label for="br">品牌名稱</label><input id="br" maxlength="60" required placeholder="例如：好吃小火鍋"></div>
<div><label for="st">第一家門市名稱</label><input id="st" maxlength="60" placeholder="例如：中正店（可不填）"></div>
<div><label for="ns">門市數</label><input id="ns" type="number" min="1" max="50" value="${pick.stores}"></div>
<div><label for="ph">聯絡電話（可不填）</label><input id="ph" maxlength="30" autocomplete="tel"></div></div>
<p class="note">試用結束後若選擇這個方案，每月 ${money(t)}（${pick.stores} 店）。</p>
<div class="row"><button class="pri" type="submit">開始免費試用</button><button type="button" data-act="out">登出</button></div></form></div>`;
}
function viewSub(){
  const s=sub, st=STATUS[s.status]||[s.status,''], p=plans.find(x=>x.code===s.plan)||{}, t=total();
  const until=s.status==='trial'?s.trial_ends_on:s.period_end;
  const canPay=cfg.billing_mode&&cfg.billing_mode!=='off'&&(cfg.billing_mode==='live'||s.sandbox);
  const changing=pick.plan!==s.plan||pick.stores!==s.stores;
  return `<div class="card"><h2>${esc(s.company)}</h2><p class="sub">${esc(s.brand_name)}・${esc(s.store_name)}　<span class="pill ${st[1]}">${st[0]}</span>${s.sandbox?' <span class="pill warn">測試帳號</span>':''}</p>${flash()}
<div class="scroll"><table><tbody>
<tr><th>方案</th><td>${esc(p.name||s.plan)}・${s.stores} 店・${money(p.price_per_store!=null?p.price_per_store*s.stores:null)}／月</td></tr>
<tr><th>${s.status==='trial'?'試用到':s.status==='expired'?'到期日':'目前已付到'}</th><td>${esc(until||'–')}</td></tr>
${s.card_last4?`<tr><th>扣款卡片</th><td>末四碼 ${esc(s.card_last4)}</td></tr>`:''}
</tbody></table></div>
<div class="row"><a href="${BOM}"><button>開啟 BOM 運算中心</button></a><a href="${PL}"><button>開啟損益分析中心</button></a></div></div>
<div class="card"><h2>${s.status==='trial'?'選方案並綁卡（試用結束才開始扣款）':s.status==='active'?'換方案或店數':'選方案並綁卡續用'}</h2>
<p class="sub">① 在下面三個方案中按「選這個」　② 填門市數　③ 按最下面的綁卡按鈕。目前選的是：<b>${esc((plans.find(x=>x.code===pick.plan)||{}).name||pick.plan)}</b>。</p>
${planCards(pick.plan,true)}
<div class="grid2"><div><label for="ns2">門市數</label><input id="ns2" type="number" min="1" max="50" value="${pick.stores}"></div></div>
<p class="note">每月 ${money(t)}，信用卡每月自動扣款，可以隨時取消，取消後用到已付期間結束。${s.status==='trial'?'現在綁卡會先刷第一期，期限從試用結束日接著算，試用天數不會浪費。':''}${s.status==='active'&&changing?'換方案會用新的金額重新綁卡，舊的自動扣款會自動停止。':''}</p>
<div class="row">${s.status==='trial'&&changing?'<button data-act="setplan">只改試用方案</button>':''}
${canPay?`<button class="pri" data-act="pay" ${s.status==='active'&&s.auto_renew&&!changing?'disabled':''}>${s.status==='active'&&changing?'換方案並重新綁卡':'綁定信用卡自動扣款'}：${esc((plans.find(x=>x.code===pick.plan)||{}).name||'')} ${money(t)}／月</button>`:`<span class="note">線上付款即將開放，現在要續用請用 LINE 聯絡我們。</span>`}
${s.auto_renew?'<button class="del" data-act="cancel">取消自動扣款</button>':''}</div></div>
${reps.length||p.monthly_deck?`<div class="card"><h2>每月經營健檢簡報</h2>${reps.length?`<div class="scroll"><table><tbody>${reps.map(r=>`<tr><td>${esc(r.month)}</td><td style="white-space:normal">${esc(((r.summary||{}).advice||[])[0]||'')}</td><td><button data-rep="${esc(r.path)}">下載簡報</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">每月 5 日會依上個月的損益月報自動產生，產生後會寄信通知。請先在損益分析中心上傳月報。</p>'}</div>`:''}
${pays.length?`<div class="card"><h2>扣款紀錄</h2><div class="scroll"><table><thead><tr><th>時間</th><th>項目</th><th>金額</th><th>結果</th></tr></thead><tbody>${pays.map(x=>`<tr><td>${esc((x.paid_at||x.created_at||'').slice(0,16).replace('T',' '))}</td><td>${{first:'首期',period:'每月扣款',cancel:'取消自動扣款'}[x.kind]||x.kind}</td><td>${x.amount?money(x.amount):'–'}</td><td>${x.status==='paid'?'<span class="pill good">成功</span>':x.status==='canceled'?'<span class="pill warn">已停用</span>':'<span class="pill bad">失敗</span> '+esc(x.rtn_msg||'')}</td></tr>`).join('')}</tbody></table></div></div>`:''}
<div class="row"><button data-act="out">登出</button></div>`;
}
function viewAdmin(){
  if(!adm) return '';
  const tabs=[['subs','訂閱'],['pilots','試點名單'],['attach','既有客戶轉訂閱'],['set','設定與價格'],['log','紀錄']];
  let body='';
  if(admTab==='subs') body=`<div class="scroll"><table><thead><tr><th>公司</th><th>Email</th><th>方案</th><th>狀態</th><th>試用到／付到</th><th>測試帳號</th><th>來源</th></tr></thead><tbody>${adm.subs.map(s=>`<tr><td>${esc(s.company)}<br><span class="note">${esc(s.client_name)}</span></td><td>${esc(s.email)}</td><td>${esc(s.plan)}×${s.stores}</td><td><span class="pill ${(STATUS[s.status]||['',''])[1]}">${(STATUS[s.status]||[s.status])[0]}</span></td><td>${esc(s.status==='trial'?s.trial_ends_on:s.period_end||'')}</td><td><input type="checkbox" data-sandbox="${s.id}" ${s.sandbox?'checked':''} aria-label="測試帳號" style="width:auto"></td><td>${s.source==='self'?'自助':'顧問'}</td></tr>`).join('')||'<tr><td colspan="7">還沒有訂閱。</td></tr>'}</tbody></table></div><p class="note">「測試帳號」打勾的訂閱，才能在測試模式用綠界測試卡付款。</p>`;
  if(admTab==='pilots') body=`<p class="sub">自助試用還沒開放前，只有名單上的 Email 能開始試用。</p><form id="pilot" class="row"><input id="pe" type="email" placeholder="email@example.com" style="max-width:280px" required><input id="pn" placeholder="備註" style="max-width:200px"><button class="pri" type="submit">加入</button></form><div class="scroll"><table><tbody>${adm.pilots.map(p=>`<tr><td>${esc(p.email)}</td><td>${esc(p.note)}</td><td><button class="del" data-unpilot="${esc(p.email)}">移除</button></td></tr>`).join('')||'<tr><td>名單是空的。</td></tr>'}</tbody></table></div>`;
  if(admTab==='attach') body=`<p class="sub">把已經由你開通的客戶轉成訂閱，沿用原本的品牌與損益資料（例如一級棒讚試點）。對方要先有帳號。</p><form id="attach"><div class="grid2"><div><label>業主 Email</label><input id="aem" type="email" required></div><div><label>公司名稱（顯示用）</label><input id="aco"></div><div><label>損益中心客戶名稱（要和現有資料完全一樣）</label><input id="acl" required></div><div><label>損益中心品牌名稱</label><input id="abr" required></div><div><label>門市名稱</label><input id="ast"></div><div><label>BOM 品牌 id（可不填）</label><input id="abid"></div><div><label>方案</label><select id="apl">${plans.map(p=>`<option value="${p.code}">${esc(p.name)}</option>`).join('')}</select></div><div><label>店數</label><input id="ans" type="number" min="1" max="50" value="1"></div><div><label>試用到（可不填，預設 ${cfg.trial_days||14} 天）</label><input id="ate" type="date"></div></div><div class="row"><button class="pri" type="submit">轉成訂閱</button></div></form>`;
  if(admTab==='set') body=`<form id="setf"><div class="grid2"><div><label>自助試用</label><select id="so"><option value="false" ${!cfg.signup_open?'selected':''}>關閉（只開放試點名單）</option><option value="true" ${cfg.signup_open?'selected':''}>開放</option></select></div><div><label>線上付款</label><select id="bm">${[['off','關閉'],['test','測試模式（綠界測試環境，不收真錢）'],['live','正式收款']].map(o=>`<option value="${o[0]}" ${cfg.billing_mode===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div><label>試用天數</label><input id="td" type="number" min="1" max="60" value="${cfg.trial_days}"></div><div><label>扣款失敗寬限天數</label><input id="gd" type="number" min="0" max="14" value="${cfg.grace_days}"></div></div>
<h3 style="margin-top:16px">每店每月價格</h3><div class="grid2">${plans.map(p=>`<div><label>${esc(p.name)}</label><input type="number" min="0" data-price="${p.code}" value="${p.price_per_store??''}" placeholder="留空＝請洽詢"></div>`).join('')}</div>
<div class="row"><button class="pri" type="submit">儲存設定</button></div><p class="note">改成「正式收款」前，要先在 Supabase 設好綠界正式金鑰（ECPAY_MERCHANT_ID、ECPAY_HASH_KEY、ECPAY_HASH_IV）。</p></form>`;
  if(admTab==='log') body=`<div class="scroll"><table><tbody>${adm.log.map(l=>`<tr><td>${esc(l.at.slice(0,16).replace('T',' '))}</td><td>${esc(l.action)}</td><td style="white-space:normal">${esc(JSON.stringify(l.detail).slice(0,160))}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="card"><h2>管理：訂閱</h2>${flash()}<div class="tabs">${tabs.map(t=>`<button data-atab="${t[0]}" class="${admTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${body}</div><div class="row"><button data-act="out">登出</button></div>`;
}
function render(){
  const q=new URLSearchParams(location.search);
  if(q.get('paid')&&!msg){ msg='付款完成後約 1 分鐘內會更新狀態，若沒更新請重新整理。'; history.replaceState(null,'',location.pathname) }
  $('#app').innerHTML=!me?viewAuth():isAdmin?viewAdmin():sub?viewSub():(me.email_confirmed_at?viewTrial():`<div class="card"><h2>請先驗證 Email</h2><p class="sub">我們寄了一封驗證信到 ${esc(me.email)}，點信裡的連結後回到這裡重新整理。</p><div class="row"><button data-act="out">登出</button></div></div>`);
}
const say=(m,b)=>{msg=m;bad=!!b;render()};
async function busy(btn,fn){ if(btn) btn.disabled=true; try{ await fn() }catch(e){ say(errMsg(e),true) } finally{ if(btn&&document.body.contains(btn)) btn.disabled=false } }
async function callBilling(body){
  const {data:{session}}=await sbc.auth.getSession();
  const r=await fetch(SUPA_URL+'/functions/v1/billing',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPA_KEY},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;
}
function postForm(action,fields){ const f=document.createElement('form'); f.method='POST'; f.action=action; for(const k in fields){ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=fields[k]; f.appendChild(i) } document.body.appendChild(f); f.submit() }

document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.mode){ mode=d.mode; msg=''; return render() }
  if(d.plan){ pick.plan=d.plan; return render() }
  if(d.atab){ admTab=d.atab; msg=''; return render() }
  if(d.unpilot){ return busy(b,async()=>{ const {error}=await sbc.from('sub_pilots').delete().eq('email',d.unpilot); if(error) throw error; await loadAdmin(); say('已移除') }) }
  if(d.rep){ return busy(b,async()=>{ const {data,error}=await sbc.storage.from('sub-reports').createSignedUrl(d.rep,300,{download:true}); if(error) throw error; location.href=data.signedUrl }) }
  if(d.act==='out'){ await sbc.auth.signOut(); msg=''; return load() }
  if(d.act==='setplan') return busy(b,async()=>{ const {error}=await sbc.rpc('sub_set_plan',{new_plan:pick.plan,new_stores:pick.stores}); if(error) throw error; await load(); say('試用方案已更新，兩套系統的功能已同步。') });
  if(d.act==='pay') return busy(b,async()=>{ const j=await callBilling({action:'checkout',plan:pick.plan,stores:pick.stores}); say('正在前往綠界付款頁…'); postForm(j.action,j.fields) });
  if(d.act==='cancel'){ if(!confirm('確定取消自動扣款？已付的期間仍可使用到期滿。')) return; return busy(b,async()=>{ const j=await callBilling({action:'cancel'}); await load(); say('已取消自動扣款，可以用到 '+(j.until||'期滿')+'。') }) }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='ns'||t.id==='ns2'){ pick.stores=Math.max(1,Math.min(50,parseInt(t.value||'1',10)||1)); return render() }
  if(t.dataset.sandbox){ const {error}=await sbc.from('sub_subscriptions').update({sandbox:t.checked}).eq('id',t.dataset.sandbox); if(error) return say(errMsg(error),true); await loadAdmin(); say('已更新測試帳號設定') }
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, btn=f.querySelector('button[type=submit]');
  if(f.id==='auth') return busy(btn,async()=>{
    const em=$('#em').value.trim(), pw=$('#pw')&&$('#pw').value;
    if(mode==='forgot'){ const {error}=await sbc.auth.resetPasswordForEmail(em,{redirectTo:BOM}); if(error) throw error; return say('如果這個 Email 有註冊過，重設信已經寄出。') }
    if(mode==='up'){ const {data,error}=await sbc.auth.signUp({email:em,password:pw,options:{data:{display_name:($('#nm').value||'').trim(),app:'sub'},emailRedirectTo:location.origin+location.pathname}}); if(error) throw error; mode='login'; return say(data.session?'註冊完成。':'註冊完成，請到信箱點驗證信，再回來登入開始試用。') }
    const {error}=await sbc.auth.signInWithPassword({email:em,password:pw}); if(error) throw error; msg=''; await load() });
  if(f.id==='trial') return busy(btn,async()=>{
    const {data,error}=await sbc.rpc('sub_start_trial',{p:{company:$('#co').value,brand:$('#br').value,store:$('#st').value,phone:$('#ph').value,plan:pick.plan,stores:pick.stores}}); if(error) throw error;
    await load(); say('試用已開始，到 '+data.trial_ends_on+' 為止。現在就可以開啟 BOM 運算中心建立食材與配方。') });
  if(f.id==='pilot') return busy(btn,async()=>{ const {error}=await sbc.from('sub_pilots').insert({email:$('#pe').value.trim().toLowerCase(),note:$('#pn').value.trim()}); if(error) throw error; await loadAdmin(); say('已加入試點名單') });
  if(f.id==='attach') return busy(btn,async()=>{ const v=id=>($(id).value||'').trim(); const {error}=await sbc.rpc('sub_admin_attach',{p:{email:v('#aem'),company:v('#aco'),client_name:v('#acl'),brand_name:v('#abr'),store_name:v('#ast'),bom_brand_id:v('#abid'),plan:v('#apl'),stores:parseInt(v('#ans')||'1',10),trial_ends_on:v('#ate')}}); if(error) throw error; await loadAdmin(); admTab='subs'; say('已轉成訂閱') });
  if(f.id==='setf') return busy(btn,async()=>{
    const bm=$('#bm').value; if(bm==='live'&&cfg.billing_mode!=='live'&&!confirm('確定改成正式收款？之後業主綁卡會真的扣款。')) return;
    const {error}=await sbc.from('sub_settings').update({signup_open:$('#so').value==='true',billing_mode:bm,trial_days:parseInt($('#td').value,10),grace_days:parseInt($('#gd').value,10),updated_at:new Date().toISOString()}).eq('id',1); if(error) throw error;
    for(const i of document.querySelectorAll('[data-price]')){ const v=i.value===''?null:parseInt(i.value,10); const {error:pe}=await sbc.from('sub_plans').update({price_per_store:v,updated_at:new Date().toISOString()}).eq('code',i.dataset.price); if(pe) throw pe }
    await load(); say('設定已儲存') });
});
sbc.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
load();
</script>
</body>
</html>
