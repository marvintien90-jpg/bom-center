<title>BOM 運算中心</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：上方品牌列＋兩組分頁（門市 BOM／總部試算），下方單一工作區，表格為主、摘要在前 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --line:#d9dfdc; --fg:#18211e; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f7f9f8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:0;max-width:65ch}
.brandbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=number]{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--mono);text-align:right;width:92px}
td input[type=text]{width:100%;min-width:110px}
:is(select,input,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
button.del{color:var(--bad);padding:3px 8px;font-size:12px}
button.del.armed{background:var(--bad-bg);border-color:var(--bad)}
.status{font-size:12px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:6px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>span{font-size:12px;color:var(--mute);letter-spacing:.08em;width:72px}
.tab{border-radius:999px;padding:4px 14px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.head>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:12px;background:var(--field);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--field)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}
.puz{background:var(--accent-soft);color:var(--accent)}
svg text{font-family:var(--sans)}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--mono);font-size:20px;font-weight:500}
.tile span{font-size:12px;color:var(--mute)}
.params{display:flex;flex-wrap:wrap;gap:10px 18px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.params label{display:flex;gap:6px;align-items:center;font-size:13px}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;display:flex;justify-content:space-between;gap:8px}
.list button[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.note{font-size:12px;color:var(--mute);margin:0}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px}
.empty{text-align:center;padding:36px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sample{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13px}
@media (max-width:720px){.split{grid-template-columns:1fr}.grp>span{width:100%}}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
input[type=email],input[type=password],input[type=date]{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;color:inherit;min-width:0}
:disabled{opacity:.75;cursor:not-allowed}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.shell.bare{grid-template-columns:minmax(0,1fr)}.shell.bare #side,.shell.bare header.top{display:none}
.shell .wrap{margin:0 auto;width:100%}
#side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidebrand{display:flex;flex-direction:column;gap:6px}.sidebrand>label{font-size:12px;color:var(--mute)}.sidebrand select{width:100%}
#nav{gap:2px;flex:1}
.navi{display:flex;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:6px 10px;gap:6px;justify-content:space-between;align-items:center}
.navi:hover{background:var(--field);border-color:transparent}
.navi[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navg{font-size:12px;color:var(--mute);letter-spacing:.06em;margin-top:10px}
.navsub{display:flex;flex-direction:column;gap:1px;padding-left:8px}
#userbar{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;overflow-wrap:anywhere}
#userbar:empty{display:none}
.only-m{display:none}#scrim{display:none}
.tip{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.step.done{border-color:var(--good);background:var(--good-bg)}.step.done b{color:var(--good)}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px}summary{cursor:pointer;font-weight:500}details p{margin-top:6px}
.btnlink{display:inline-block;background:#047d3a;color:#fff;border-radius:6px;padding:6px 14px;text-decoration:none;font-weight:500}.btnlink:hover{filter:brightness(.95)}
.board{border:1px solid var(--accent);border-left-width:4px;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}.board b{color:var(--accent)}
textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;resize:vertical}
.ticker{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid var(--accent);border-left-width:4px;border-radius:8px;padding:6px 12px;background:var(--panel);overflow:hidden;min-width:0}
.ticker>b{color:var(--accent);flex:none}.ticker>.tag,.ticker>span[aria-hidden]{flex:none;font-size:12px}
.tk{flex:1;overflow:hidden;white-space:nowrap;min-width:0}.tkin{display:inline-block;padding-left:100%;animation:tk linear infinite}
.ticker:hover .tkin,.ticker:focus-visible .tkin{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tkin{animation:none;padding-left:0;display:block;overflow:hidden;text-overflow:ellipsis}}
#annDlg{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:18px;width:min(560px,92vw);max-height:84vh}
#annDlg::backdrop{background:rgba(0,0,0,.45)}
.ann summary{display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}.ann summary::-webkit-details-marker{display:none}
.ann[open] summary{margin-bottom:6px}.annbody{white-space:pre-line;font-size:13px;overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
input[type=datetime-local]{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;color:inherit}
.pwrow{display:flex;gap:6px}.pwrow input{flex:1}
main tbody th{width:140px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}
 #side{position:fixed;left:0;top:0;z-index:20;width:268px;max-width:86vw;transform:translateX(-100%);transition:transform .2s}
 .shell.open #side{transform:none}.shell.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
 .only-m{display:inline-block}}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>

<div class="shell bare" id="shell">
  <aside id="side" aria-label="主選單">
    <div class="sidehead"><h1>BOM 運算中心</h1><button id="btnClose" class="only-m" aria-label="關閉選單">✕</button></div>
    <div class="sidebrand" id="brandbar">
      <label for="brandSel">目前品牌</label>
      <select id="brandSel"></select>
      <div class="brandbar"><button id="btnNew">新增品牌</button><button id="btnCopy">複製品牌</button></div>
    </div>
    <nav id="nav" aria-label="功能選單"></nav>
    <div id="userbar"></div>
  </aside>
  <div id="scrim"></div>
  <div class="wrap">
    <header class="top">
      <div class="brandbar"><button id="btnMenu" class="only-m" aria-label="開啟選單">☰ 選單</button><b id="crumb"></b></div>
      <div class="brandbar"><span class="status" id="status" role="status"></span><button id="btnExport" hidden>匯出 Excel</button></div>
    </header>
    <div id="banner"></div>
    <main id="main"><div class="empty"><p class="sub">讀取中…</p></div></main>
    <footer class="note" style="text-align:center">BOM 運算中心 · 品牌加辣餐飲顧問工作室 授權使用</footer>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const TABS=[['store','門市 BOM',[['ing','食材主檔'],['semi','半成品'],['recipe','品項配方'],['combo','套餐組合'],['order','叫貨推估'],['pricelog','價格紀錄']]],
            ['ana','經營分析',[['cost','成本毛利'],['matrix','產品四象限'],['price','定價漲價試算'],['channel','外送通路定價'],['pl','損益趨勢'],['be','損益兩平']]],
            ['hq','總部試算',[['markup','疊價設定'],['hqitem','單品獲利'],['supply','總供貨試算'],['frsim','加盟主損益']]],
            ['sys','系統',[['ver','版本與備份']]]];
const TABIDS=TABS.flatMap(g=>g[2].map(t=>t[0]));
let brands={}, cur=null, tab='cost', db=null, mode='loading', selItem=null, selSemi=null, sim={}, armed=null, mxCat='';
const dirty=new Set(); let timer=null, chain=Promise.resolve();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const nf=(n,d=1)=>isFinite(n)?n.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const $$=(n,d=1)=>isFinite(n)?'$'+nf(n,d):'–';
const pct=(n,d=1)=>isFinite(n)?nf(n*100,d)+'%':'–';
const B=()=>brands[cur];

/* ---------- 運算核心 ---------- */
function ctx(b,adj={}){
  const def=b.settings.defaultMarkup, I={}, S={};
  b.ingredients.forEach(i=>{
    const m=(i.markup??def)/100, buy=i.buyPrice*(1+(adj[i.id]||0)/100);
    const hq=buy/(i.packSize||1)/((i.yield||100)/100);
    I[i.id]={...i,m,hq,fr:i.supply==='hq'?hq*(1+m):hq,isHq:i.supply==='hq'};
  });
  b.semis.forEach(s=>{
    let hq=0,fr=0; const y=s.batchYield||1, m=(s.markup??def)/100;
    s.lines.forEach(l=>{const g=I[l.ref.slice(2)]; if(g){hq+=g.hq*l.qty; fr+=g.fr*l.qty}});
    hq/=y; fr/=y;
    S[s.id]={...s,m,hq,fr:s.supply==='hq'?hq*(1+m):fr,isHq:s.supply==='hq',yield:100};
  });
  return {I,S,get:k=>k[0]==='i'?I[k.slice(2)]:S[k.slice(2)]};
}
/* 把一份餐點拆成「門市實際會進貨的東西」：食材，或總部供應的半成品 */
function explode(item,c){
  const out={}; const add=(k,q)=>out[k]=(out[k]||0)+q;
  item.lines.forEach(l=>{
    if(l.ref[0]==='i'){ if(c.get(l.ref)) add(l.ref,l.qty); return }
    const s=c.S[l.ref.slice(2)]; if(!s) return;
    if(s.isHq) add(l.ref,l.qty);
    else s.lines.forEach(x=>{ if(c.get(x.ref)) add(x.ref,x.qty*l.qty/(s.batchYield||1)) });
  });
  return out;
}
function itemCalc(item,c){
  let hq=0,fr=0,rev=0,cogs=0; const ex=explode(item,c);
  for(const k in ex){const p=c.get(k),q=ex[k]; hq+=p.hq*q; fr+=p.fr*q; if(p.isHq){rev+=p.fr*q; cogs+=p.hq*q}}
  return {hq,fr,rev,cogs,ex};
}
function demand(b,c){ const d={};
  b.items.forEach(it=>{const ex=explode(it,c); for(const k in ex) d[k]=(d[k]||0)+ex[k]*(it.monthlySales||0)});
  return d; }

/* ---------- 儲存 ---------- */
function setStatus(t){$('#status').textContent=t}
function touch(){ if(!cur) return; dirty.add(cur); sbQueue(cur); setStatus('儲存中…'); clearTimeout(timer); timer=setTimeout(flush,700) }
function flush(){
  const ids=[...dirty]; dirty.clear();
  if(!db){ try{localStorage.setItem('bom-brands',JSON.stringify(brands)); setStatus('已存在這個瀏覽器')}catch(e){setStatus('無法儲存')} return }
  ids.forEach(id=>{ const body=brands[id]&&JSON.parse(JSON.stringify(brands[id])); if(!body) return;
    chain=chain.then(()=>db.doc('brands/'+id).set(body)).then(()=>{ if(!dirty.size) setStatus('已儲存') })
      .catch(e=>setStatus(e&&e.code==='invalid_argument'?'你沒有修改權限，變更未儲存':'儲存失敗，請稍後再改一次')) });
}
async function boot(){
  const h=location.hash.slice(1); if(TABIDS.includes(h)) tab=h;
  try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null }catch(e){db=null}
  try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null }catch(e){dl=null}
  try{ mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null }catch(e){mcp=null}
  if(!db){ try{versions=JSON.parse(localStorage.getItem('bom-versions')||'[]')}catch(e){versions=[]} mode='local'; try{brands=JSON.parse(localStorage.getItem('bom-brands')||'{}')}catch(e){brands={}} Object.values(brands).forEach(norm);
    pick(); setStatus('僅存在這個瀏覽器'); render(); return }
  db.collection('brands').onSnapshot(snap=>{
    mode='cloud'; let changed=false; const seen=new Set();
    snap.docs.forEach(d=>{ seen.add(d.id); if(dirty.has(d.id)) return;
      const j=JSON.stringify(d.data()); if(raw[d.id]!==j){raw[d.id]=j; brands[d.id]=norm(JSON.parse(j)); changed=true} });
    Object.keys(brands).forEach(id=>{ if(!seen.has(id)&&!dirty.has(id)&&!snap.metadata.fromCache){delete brands[id]; changed=true} });
    if(pick()||changed||$('#main .empty')) render();
    if(!dirty.size) setStatus('已儲存');
  },()=>{ setStatus('連線中斷，重新整理頁面可恢復') });
  db.collection('versions').onSnapshot(snap=>{ versions=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})).sort((a,z)=>a.at<z.at?1:-1); reVer() },()=>{});
}
function pick(){ const ids=Object.keys(brands); if(cur&&brands[cur]) return false; cur=ids[0]||null; selItem=selSemi=null; return true }
function blank(name){return {name,sample:false,settings:{defaultMarkup:15,targetRate:35,franchiseStores:1,directStores:0,logisticsPct:3,cycleDays:3,safetyPct:10,daysPerMonth:30},ingredients:[],semis:[],items:[]}}

/* ---------- 共用元件 ---------- */
const num=(p,v,o={})=>`<input type="number" id="f-${p}" data-p="${p}" data-t="n" ${o.nul?'data-nul="1"':''} value="${v??''}" step="${o.step||'any'}" placeholder="${o.ph||''}" aria-label="${o.label||p}">`;
const txt=(p,v,l)=>`<input type="text" id="f-${p}" data-p="${p}" value="${esc(v)}" aria-label="${l||p}">`;
const sel=(p,v,opts,l)=>`<select id="f-${p}" data-p="${p}" aria-label="${l||p}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
const del=p=>`<button class="del ${armed===p?'armed':''}" data-del="${p}">${armed===p?'確定刪除':'刪除'}</button>`;
const SUP=[['hq','總部供貨'],['self','門市自採']];
function rateCell(r,t){ const cls=r<=t?'good':r<=t+0.03?'warn':'bad', lab=r<=t?'達標':r<=t+0.03?'留意':'超標';
  return `<td class="n">${pct(r)}</td><td><span class="pill ${cls}">${lab}</span></td>` }
const refOpts=(b,withSemi)=>[...b.ingredients.map(i=>['i:'+i.id,i.name]),...(withSemi?b.semis.map(s=>['s:'+s.id,'〔半成品〕'+s.name]):[])];
function params(b,keys){ const L={defaultMarkup:'預設疊價 %',targetRate:'目標成本率 %',franchiseStores:'加盟店數',directStores:'直營店數',logisticsPct:'物流倉儲費占供貨額 %',cycleDays:'叫貨週期（天）',safetyPct:'安全庫存 %',daysPerMonth:'每月營業天數'};
  return `<div class="params">${keys.map(k=>`<label for="f-settings.${k}">${L[k]} ${num('settings.'+k,b.settings[k],{label:L[k]})}</label>`).join('')}</div>` }

/* ---------- 各分頁 ---------- */
const V={};
V.ing=(b,c)=>`<div class="head"><div><h2>食材主檔</h2><p class="sub">每樣食材填進貨價與包裝量，系統換算成「每 1 個用量單位多少錢」。可用率是去皮去骨後剩下的比例。</p></div><button class="pri" data-add="ing">新增食材</button></div>
<div class="scroll"><table><thead><tr><th>食材</th><th>分類</th><th>進貨單位</th><th class="n">進貨價</th><th class="n">每單位含量</th><th>用量單位</th><th class="n">可用率 %</th><th>供貨方式</th><th class="n">單位成本</th><th></th></tr></thead><tbody>
${b.ingredients.map((i,x)=>{const p='ingredients.'+x;return `<tr><td>${txt(p+'.name',i.name,'食材名稱')}</td><td>${txt(p+'.cat',i.cat,'分類')}</td><td>${txt(p+'.packUnit',i.packUnit,'進貨單位')}</td><td class="n">${num(p+'.buyPrice',i.buyPrice,{label:'進貨價'})}</td><td class="n">${num(p+'.packSize',i.packSize,{label:'每單位含量'})}</td><td>${txt(p+'.unit',i.unit,'用量單位')}</td><td class="n">${num(p+'.yield',i.yield,{label:'可用率'})}</td><td>${sel(p+'.supply',i.supply,SUP,'供貨方式')}</td><td class="n">${$$(c.I[i.id].hq,3)}/${esc(i.unit)}</td><td>${del(p)}</td></tr>`}).join('')||'<tr><td colspan="10">還沒有食材，按右上角「新增食材」開始。</td></tr>'}
</tbody></table></div>`;

V.semi=(b,c)=>{ if(!b.semis.find(s=>s.id===selSemi)) selSemi=b.semis[0]?.id||null; const x=b.semis.findIndex(s=>s.id===selSemi), s=b.semis[x];
return `<div class="head"><div><h2>半成品</h2><p class="sub">醬料、白飯、高湯這類先做好再用的東西。填一鍋的材料與做出來的總量，就能算出每 1 單位成本。</p></div><button class="pri" data-add="semi">新增半成品</button></div>
<div class="split"><div class="list">${b.semis.map(t=>`<button data-pick-semi="${t.id}" aria-current="${t.id===selSemi}"><span>${esc(t.name)}</span><span class="tag">${t.supply==='hq'?'總部':'自製'}</span></button>`).join('')||'<p class="note">尚無半成品</p>'}</div>
${s?`<div class="col"><div class="params"><label>名稱 ${txt(`semis.${x}.name`,s.name,'名稱')}</label><label>單位 ${txt(`semis.${x}.unit`,s.unit,'單位')}</label><label>一批做出總量 ${num(`semis.${x}.batchYield`,s.batchYield,{label:'產出量'})}</label><label>來源 ${sel(`semis.${x}.supply`,s.supply,[['hq','總部製作供貨'],['self','門市自製']],'來源')}</label>${s.supply==='hq'?`<label>供貨包裝量 ${num(`semis.${x}.packSize`,s.packSize,{label:'包裝量'})}</label><label>包裝單位 ${txt(`semis.${x}.packUnit`,s.packUnit,'包裝單位')}</label>`:''}${del('semis.'+x)}</div>
<div class="scroll"><table><thead><tr><th>材料</th><th class="n">一批用量</th><th>單位</th><th class="n">小計（總部成本）</th><th></th></tr></thead><tbody>
${s.lines.map((l,y)=>{const g=c.get(l.ref);return `<tr><td>${sel(`semis.${x}.lines.${y}.ref`,l.ref,refOpts(b,false),'材料')}</td><td class="n">${num(`semis.${x}.lines.${y}.qty`,l.qty,{label:'用量'})}</td><td>${esc(g?.unit||'')}</td><td class="n">${g?$$(g.hq*l.qty,2):'已刪除'}</td><td>${del(`semis.${x}.lines.${y}`)}</td></tr>`}).join('')}
</tbody><tfoot><tr><td colspan="3">每 1 ${esc(s.unit)} 成本</td><td class="n">${$$(c.S[s.id].hq,3)}</td><td></td></tr></tfoot></table></div>
<div><button data-add="semiline">加一項材料</button></div>
<p class="note">${s.supply==='hq'?`加盟主進貨價：每 1 ${esc(s.unit)} ${$$(c.S[s.id].fr,3)}（疊價 ${nf(c.S[s.id].m*100,0)}%，可在「疊價設定」調整）`:'門市自製時，成本直接用各材料的門市進貨價計算。'}</p></div>`:'<div class="empty"><p class="sub">新增一個半成品，例如招牌醬或白飯。</p></div>'}</div>` };

V.recipe=(b,c)=>{ if(!b.items.find(s=>s.id===selItem)) selItem=b.items[0]?.id||null; const x=b.items.findIndex(s=>s.id===selItem), it=b.items[x]; const k=it&&itemCalc(it,c);
return `<div class="head"><div><h2>品項配方</h2><p class="sub">每道餐點的「食譜卡」：用了哪些料、各多少量。右邊即時算出一份的成本。</p></div><button class="pri" data-add="item">新增品項</button></div>
<div class="split"><div class="list">${b.items.map(t=>`<button data-pick-item="${t.id}" aria-current="${t.id===selItem}"><span>${esc(t.name)}</span><span>${$$(t.price,0)}</span></button>`).join('')||'<p class="note">尚無品項</p>'}</div>
${it?`<div class="col"><div class="params"><label>品名 ${txt(`items.${x}.name`,it.name,'品名')}</label><label>分類 ${txt(`items.${x}.cat`,it.cat,'分類')}</label><label>售價 ${num(`items.${x}.price`,it.price,{label:'售價'})}</label><label>單店月銷量 ${num(`items.${x}.monthlySales`,it.monthlySales,{label:'月銷量'})}</label>${del('items.'+x)}</div>
<div class="tiles"><div class="tile"><span>加盟主一份成本</span><b>${$$(k.fr)}</b><span>成本率 ${pct(k.fr/it.price)}</span></div><div class="tile"><span>總部進貨一份成本</span><b>${$$(k.hq)}</b><span>成本率 ${pct(k.hq/it.price)}（直營店看這個）</span></div><div class="tile"><span>加盟主一份毛利</span><b>${$$(it.price-k.fr)}</b><span>售價減食材成本</span></div></div>
<div class="scroll"><table><thead><tr><th>用料</th><th class="n">一份用量</th><th>單位</th><th class="n">總部成本</th><th class="n">加盟主成本</th><th></th></tr></thead><tbody>
${it.lines.map((l,y)=>{const g=c.get(l.ref);return `<tr><td>${sel(`items.${x}.lines.${y}.ref`,l.ref,refOpts(b,true),'用料')}</td><td class="n">${num(`items.${x}.lines.${y}.qty`,l.qty,{label:'用量'})}</td><td>${esc(g?.unit||'')}</td><td class="n">${g?$$(g.hq*l.qty,2):'已刪除'}</td><td class="n">${g?$$(g.fr*l.qty,2):''}</td><td>${del(`items.${x}.lines.${y}`)}</td></tr>`}).join('')}
</tbody><tfoot><tr><td colspan="3">一份合計</td><td class="n">${$$(k.hq,2)}</td><td class="n">${$$(k.fr,2)}</td><td></td></tr></tfoot></table></div>
<div><button data-add="itemline">加一項用料</button></div></div>`:'<div class="empty"><p class="sub">新增第一個品項，開始建立配方。</p></div>'}</div>` };

V.cost=(b,c)=>{ const t=b.settings.targetRate/100; let sales=0,cost=0;
const rows=b.items.map(it=>{const k=itemCalc(it,c),q=it.monthlySales||0; sales+=it.price*q; cost+=k.fr*q;
 return `<tr><td>${esc(it.name)}</td><td>${esc(it.cat)}</td><td class="n">${$$(it.price,0)}</td><td class="n">${$$(k.hq)}</td><td class="n">${$$(k.fr)}</td>${rateCell(k.fr/it.price,t)}<td class="n">${$$(it.price-k.fr)}</td><td class="n">${nf(q,0)}</td><td class="n">${$$((it.price-k.fr)*q,0)}</td></tr>`}).join('');
return `<div class="head"><div><h2>成本毛利總表</h2><p class="sub">一眼看出哪道菜成本超標。燈號以「加盟主成本率」對照目標成本率判定，超過 3 個百分點內列為留意。</p></div></div>
${params(b,['targetRate'])}
<div class="tiles"><div class="tile"><span>單店月營收（依月銷量估）</span><b>${$$(sales,0)}</b></div><div class="tile"><span>單店月食材成本</span><b>${$$(cost,0)}</b></div><div class="tile"><span>整體食材成本率</span><b>${pct(cost/sales)}</b><span>目標 ${nf(b.settings.targetRate,0)}%</span></div><div class="tile"><span>單店月毛利</span><b>${$$(sales-cost,0)}</b></div></div>
<div class="scroll"><table><thead><tr><th>品項</th><th>分類</th><th class="n">售價</th><th class="n">總部成本</th><th class="n">加盟主成本</th><th class="n">成本率</th><th>狀態</th><th class="n">一份毛利</th><th class="n">月銷量</th><th class="n">月毛利</th></tr></thead><tbody>${rows||'<tr><td colspan="10">尚無品項</td></tr>'}</tbody></table></div>
<p class="note">售價以菜單標價計算，未另外扣除營業稅。</p>` };

V.price=(b,c)=>{ const t=b.settings.targetRate/100, c2=ctx(b,sim); const any=Object.values(sim).some(v=>v);
return `<div class="head"><div><h2>定價與漲價試算</h2><p class="sub">上半部：用目標成本率倒推建議售價。下半部：假設某些食材漲跌幾 %，看每道菜成本率變多少。試算數字不會存進主檔。</p></div></div>
${params(b,['targetRate'])}
<div class="scroll"><table><thead><tr><th>品項</th><th class="n">現行售價</th><th class="n">加盟主成本</th><th class="n">現行成本率</th><th class="n">建議售價</th><th class="n">取整到 5 元</th><th class="n">與現價差</th></tr></thead><tbody>
${b.items.map(it=>{const k=itemCalc(it,c),s=k.fr/t,r=Math.ceil(s/5)*5;return `<tr><td>${esc(it.name)}</td><td class="n">${$$(it.price,0)}</td><td class="n">${$$(k.fr)}</td><td class="n">${pct(k.fr/it.price)}</td><td class="n">${$$(s)}</td><td class="n">${$$(r,0)}</td><td class="n">${r-it.price>0?'+':''}${nf(r-it.price,0)}</td></tr>`}).join('')}</tbody></table></div>
<div class="head"><div><h2>食材漲跌模擬</h2><p class="sub">在想試算的食材填入漲跌幅，例如牛肉漲 10% 就填 10，跌價填負數。</p></div><button data-simclear="1">清除模擬</button></div>
<div class="split"><div class="scroll"><table><thead><tr><th>食材</th><th class="n">漲跌 %</th></tr></thead><tbody>${b.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td class="n"><input type="number" id="sim-${i.id}" data-sim="${i.id}" data-p="sim.${i.id}" value="${sim[i.id]||''}" placeholder="0" aria-label="${esc(i.name)}漲跌"></td></tr>`).join('')}</tbody></table></div>
<div class="scroll"><table><thead><tr><th>品項</th><th class="n">原成本</th><th class="n">模擬後成本</th><th class="n">原成本率</th><th class="n">模擬後</th><th>狀態</th><th class="n">單店月毛利變化</th></tr></thead><tbody>
${b.items.map(it=>{const a=itemCalc(it,c).fr,n=itemCalc(it,c2).fr;return `<tr><td>${esc(it.name)}</td><td class="n">${$$(a)}</td><td class="n">${$$(n)}</td><td class="n">${pct(a/it.price)}</td>${rateCell(n/it.price,t)}<td class="n">${any?$$((a-n)*(it.monthlySales||0),0):'–'}</td></tr>`}).join('')}</tbody></table></div></div>` };

V.order=(b,c)=>{ const s=b.settings, d=demand(b,c); let tot=0;
const rows=Object.keys(d).map(k=>{const p=c.get(k),net=d[k],gross=net/((p.yield||100)/100),ps=p.packSize||1;
 const cyc=gross/(s.daysPerMonth||30)*s.cycleDays*(1+s.safetyPct/100); tot+=net*p.fr;
 return {p,html:`<tr><td>${esc(p.name)}</td><td><span class="tag">${p.isHq?'向總部叫貨':'門市自採'}</span></td><td class="n">${nf(gross,0)} ${esc(p.unit)}</td><td class="n">${ps>1||p.packUnit?nf(gross/ps,1)+' '+esc(p.packUnit||''):'–'}</td><td class="n">${nf(cyc,0)} ${esc(p.unit)}</td><td class="n">${p.packUnit?Math.ceil(cyc/ps)+' '+esc(p.packUnit):'–'}</td><td class="n">${$$(net*p.fr,0)}</td></tr>`}}).sort((a,z)=>(z.p.isHq-a.p.isHq)).map(r=>r.html).join('');
return `<div class="head"><div><h2>叫貨與用量推估</h2><p class="sub">用各品項的單店月銷量，回推每樣食材一個月要用多少、每次該叫幾包。已把可用率的損耗算進去。月銷量在「品項配方」修改。</p></div></div>
${params(b,['cycleDays','safetyPct','daysPerMonth'])}
<div class="scroll"><table><thead><tr><th>進貨品項</th><th>來源</th><th class="n">月需求量</th><th class="n">月需求（進貨單位）</th><th class="n">每次叫貨量</th><th class="n">每次叫貨（整數）</th><th class="n">月進貨金額</th></tr></thead><tbody>${rows||'<tr><td colspan="7">尚無資料</td></tr>'}</tbody><tfoot><tr><td colspan="6">單店月進貨合計</td><td class="n">${$$(tot,0)}</td></tr></tfoot></table></div>
<p class="note">每次叫貨量 = 月需求 ÷ 每月營業天數 × 叫貨週期 ×（1 + 安全庫存）。門市自製的半成品已拆回原料計算。</p>` };

V.markup=(b,c)=>{ const row=(p,path,kind)=>{const ps=p.packSize||1;return `<tr><td>${esc(p.name)}</td><td>${kind}</td><td class="n">${$$(p.hq*ps*((p.yield||100)/100),1)}／${esc(p.packUnit||p.unit)}</td><td class="n">${num(path+'.markup',p.markup,{nul:1,ph:b.settings.defaultMarkup,label:'疊價'})}</td><td class="n">${$$(p.fr*ps*((p.yield||100)/100),1)}／${esc(p.packUnit||p.unit)}</td><td class="n">${$$((p.fr-p.hq)*ps*((p.yield||100)/100),1)}</td></tr>`};
return `<div class="head"><div><h2>總部對加盟主疊價</h2><p class="sub">疊價就是總部進貨價往上加的成數，等於批發商的價差。留空的品項套用預設疊價，個別填數字則以該數字為準。</p></div></div>
${params(b,['defaultMarkup'])}
<div class="scroll"><table><thead><tr><th>供貨品項</th><th>類型</th><th class="n">總部成本</th><th class="n">疊價 %</th><th class="n">加盟主進貨價</th><th class="n">每單位價差</th></tr></thead><tbody>
${b.ingredients.map((i,x)=>i.supply==='hq'?row(c.I[i.id],'ingredients.'+x,'食材'):'').join('')}${b.semis.map((s,x)=>s.supply==='hq'?row(c.S[s.id],'semis.'+x,'半成品'):'').join('')}</tbody></table></div>
<p class="note">門市自採的食材不經過總部，不在此表。要改成總部供貨，請到「食材主檔」調整供貨方式。</p>` };

V.hqitem=(b,c)=>{ const s=b.settings; let T=0;
const rows=b.items.map(it=>{const k=itemCalc(it,c),g=k.rev-k.cogs,lg=k.rev*s.logisticsPct/100,net=g-lg,m=net*(it.monthlySales||0)*s.franchiseStores; T+=m;
 return `<tr><td>${esc(it.name)}</td><td class="n">${$$(it.price,0)}</td><td class="n">${$$(k.rev,2)}</td><td class="n">${$$(k.cogs,2)}</td><td class="n">${$$(g,2)}</td><td class="n">${$$(lg,2)}</td><td class="n">${$$(net,2)}</td><td class="n">${pct(k.rev?net/k.rev:NaN)}</td><td class="n">${pct(k.fr?k.rev/k.fr:NaN,0)}</td><td class="n">${$$(m,0)}</td></tr>`}).join('');
return `<div class="head"><div><h2>總部單品獲利試算</h2><p class="sub">加盟店每賣出一份，總部從供貨賺到多少。只計算總部供貨的品項價差，不含權利金與加盟金。</p></div></div>
${params(b,['franchiseStores','logisticsPct'])}
<div class="scroll"><table><thead><tr><th>品項</th><th class="n">售價</th><th class="n">總部供貨收入／份</th><th class="n">總部成本／份</th><th class="n">供貨毛利／份</th><th class="n">物流費／份</th><th class="n">淨賺／份</th><th class="n">淨利率</th><th class="n">總部供貨占比</th><th class="n">全體加盟店月貢獻</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="9">總部每月供貨淨利合計（${nf(s.franchiseStores,0)} 家加盟店）</td><td class="n">${$$(T,0)}</td></tr></tfoot></table></div>
<p class="note">總部供貨占比 = 這道菜的食材成本裡，有多少比例是跟總部買的。占比低代表門市自採多，總部賺得少也較難控管品質。</p>` };

V.supply=(b,c)=>{ const s=b.settings, d=demand(b,c), all=s.franchiseStores+s.directStores; let R=0,C=0;
const rows=Object.keys(d).filter(k=>c.get(k).isHq).map(k=>{const p=c.get(k),net=d[k],gross=net/((p.yield||100)/100),ps=p.packSize||1,rev=net*p.fr*s.franchiseStores,cg=net*p.hq*s.franchiseStores; R+=rev;C+=cg;
 return [rev,`<tr><td>${esc(p.name)}</td><td class="n">${nf(gross*all/ps,1)} ${esc(p.packUnit||p.unit)}</td><td class="n">${$$(net*p.hq*all,0)}</td><td class="n">${$$(rev,0)}</td><td class="n">${$$(cg,0)}</td><td class="n">${$$(rev-cg,0)}</td><td class="n">${pct((rev-cg)/rev)}</td><td><span class="bar" style="width:WIDpx"></span></td></tr>`]}).sort((a,z)=>z[0]-a[0]);
const mx=rows[0]?.[0]||1, lg=R*s.logisticsPct/100;
return `<div class="head"><div><h2>總部總供貨試算</h2><p class="sub">把所有門市的用量加總，看總部每月要備多少貨、供貨給加盟店能賺多少。直營店以成本價調撥，只計入備貨量，不計入供貨收入。</p></div></div>
${params(b,['franchiseStores','directStores','logisticsPct'])}
<div class="tiles"><div class="tile"><span>月供貨營收（加盟店）</span><b>${$$(R,0)}</b></div><div class="tile"><span>月供貨毛利</span><b>${$$(R-C,0)}</b><span>毛利率 ${pct((R-C)/R)}</span></div><div class="tile"><span>扣物流倉儲後淨利</span><b>${$$(R-C-lg,0)}</b><span>物流費 ${$$(lg,0)}</span></div><div class="tile"><span>平均每家加盟店月貢獻</span><b>${$$((R-C-lg)/(s.franchiseStores||1),0)}</b></div></div>
<div class="scroll"><table><thead><tr><th>供貨品項</th><th class="n">月備貨量（全體門市）</th><th class="n">月採購金額</th><th class="n">加盟供貨收入</th><th class="n">加盟供貨成本</th><th class="n">供貨毛利</th><th class="n">毛利率</th><th>收入占比</th></tr></thead><tbody>${rows.map(r=>r[1].replace('WID',Math.max(2,Math.round(r[0]/mx*90)))).join('')||'<tr><td colspan="8">尚無總部供貨品項</td></tr>'}</tbody><tfoot><tr><td colspan="3">合計</td><td class="n">${$$(R,0)}</td><td class="n">${$$(C,0)}</td><td class="n">${$$(R-C,0)}</td><td class="n">${pct((R-C)/R)}</td><td></td></tr></tfoot></table></div>
<p class="note">假設每家門市的月銷量相同（取自「品項配方」的單店月銷量）。</p>` };

const ui={}, raw={}; let selCombo=null, dl=null;
const sumA=x=>x.reduce((t,r)=>t+(+r.amount||0),0);
const VAR=/服務費|促銷|廣告費|上架費|退款|免洗餐具|手續費/;
function norm(b){ if(!b.periods) b.periods=b.actual?[b.actual]:[]; delete b.actual;
  b.fixed=b.fixed||[]; b.be=Object.assign({varPct:0,ticket:0,target:0,foodMode:'auto',foodPct:35},b.be||{});
  b.channels=b.channels||[{name:'內用／外帶',comm:0,extra:0,pack:0,up:0}];
  b.combos=b.combos||[]; b.priceLog=b.priceLog||[];

its.forEach(r=>{r.s=r.q/Q; r.k=r.s>=popT?(r.cm>=avg?'star':'horse'):(r.cm>=avg?'puzzle':'dog')});
const W=640,H=340,L=56,R=16,T=16,Bm=40, xm=Math.max(popT,...its.map(r=>r.s))*1.15, y0=Math.min(0,...its.map(r=>r.cm)), y1=Math.max(avg,...its.map(r=>r.cm))*1.15||1;
const X=v=>L+v/xm*(W-L-R), Y=v=>H-Bm-(v-y0)/(y1-y0)*(H-T-Bm);

+'<line x1="'+X(popT)+'" y1="'+T+'" x2="'+X(popT)+'" y2="'+(H-Bm)+'" stroke="var(--mute)" stroke-dasharray="4 4"/><line x1="'+L+'" y1="'+Y(avg)+'" x2="'+(W-R)+'" y2="'+Y(avg)+'" stroke="var(--mute)" stroke-dasharray="4 4"/>'
+[['謎題',L+8,T+16,'start'],['明星',W-R-8,T+16,'end'],['瘦狗',L+8,H-Bm-8,'start'],['耕馬',W-R-8,H-Bm-8,'end']].map(q=>'<text x="'+q[1]+'" y="'+q[2]+'" text-anchor="'+q[3]+'" font-size="13" font-weight="700" fill="var(--mute)">'+q[0]+'</text>').join('')
+its.map(r=>{const x=X(r.s),y=Y(r.cm),e=x>W-150;return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+QD[r.k][2]+'" stroke="var(--panel)" stroke-width="1.5"/><text x="'+(e?x-10:x+10)+'" y="'+(y+4)+'" text-anchor="'+(e?'end':'start')+'" font-size="12" fill="var(--fg)">'+esc(r.it.name)+'</text>'}).join('')
+'<text x="'+(L+(W-L-R)/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--mute)">銷量占比（門檻 '+pct(popT)+'）→ 越右邊賣越好</text><text x="14" y="'+(T+(H-T-Bm)/2)+'" text-anchor="middle" font-size="12" fill="var(--mute)" transform="rotate(-90 14 '+(T+(H-T-Bm)/2)+')">一份毛利（平均 '+$$(avg)+'）</text>'

async function impRead(file){ const b=B(); if(!b||!file) return; let wb; try{ wb=XLSX.read(await file.arrayBuffer()) }catch(e){ imp={fatal:'這個檔案打不開。請確認是用我們的表單填寫、另存成 .xlsx 的 Excel 檔。'}; return render() }
  const P={file:file.name,ing:[],semi:[],semiL:[],item:[],line:[],errs:[]}, err=(k,n,m)=>P.errs.push({sheet:SH[k][0],row:n,msg:m});

  let seen=new Set(); rows('ing').forEach(({r,n})=>{ const [name,cat,packUnit,bp,ps,unit,y,sp]=r; if(!name) return err('ing',n,'沒有填食材名稱'); if(dup('ing',seen,name,n)) return;

async function loadAnns(){ const r=await sbc.from('bom_announcements').select('*').order('starts_at',{ascending:false}); anns=r.error||!Array.isArray(r.data)?[]:r.data;
  if(me){ const q=await sbc.from('bom_announcement_reads').select('announcement_id,user_id,read_at'); annReads=q.error||!Array.isArray(q.data)?[]:q.data; annRead=new Set(annReads.filter(x=>x.user_id===me.id).map(x=>x.announcement_id)) }
  if(me&&prof&&prof.role==='admin'){ const m=await sbc.from('bom_announcement_reminders').select('*'); annRems=m.error||!Array.isArray(m.data)?[]:m.data }
  const sig=anns.map(a=>a.id+a.updated_at+a.status).join(); const ch=sig!==annSig; annSig=sig; return ch }
const annState=a=>{ const n=Date.now(); return a.status==='draft'?'draft':a.status==='archived'?'archived':new Date(a.starts_at)>n?'sched':a.ends_at&&new Date(a.ends_at)<=n?'expired':'live' };
const vis=()=>anns.filter(a=>annState(a)==='live'&&(G==='app'||a.audience==='public')).sort((a,z)=>(z.pinned-a.pinned)||(a.starts_at<z.starts_at?1:-1));
const unread=()=>me&&G==='app'?vis().filter(a=>!annRead.has(a.id)).length:0;
function ticker(){ const it=vis(); if(!it.length) return ''; const txt=it.map(a=>(a.pinned?'【置頂】':'')+a.title).join('　｜　'), u=unread();
  return `<button class="ticker" data-annopen="1" aria-label="查看公告，共 ${it.length} 則"><b>公告</b><span class="tk"><span class="tkin" style="animation-duration:${Math.max(14,Math.round(txt.length*0.45))}s">${esc(txt)}</span></span><span class="tag">${u?u+' 則未讀':'共 '+it.length+' 則'}</span><span aria-hidden="true">查看 ›</span></button>` }
const annList=()=>vis().map(a=>`<details class="ann" data-ann="${a.id}"><summary><span>${me&&G==='app'&&!annRead.has(a.id)?'<span class="dot" title="未讀"></span>':''}${a.pinned?'<span class="tag">置頂</span> ':''}<b>${esc(a.title)}</b></span><span class="note">${tm(a.starts_at).split(' ')[0]}${isAdmin()?' · '+AUDS[a.audience]:''}</span></summary><div class="annbody">${esc(a.body)||'（沒有其他內容）'}</div></details>`).join('')||'<p class="note">目前沒有公告。</p>';
function markRead(id){ if(!me||G!=='app'||annRead.has(id)) return; annRead.add(id); annReads.push({announcement_id:id,user_id:me.id});
  sbc.from('bom_announcement_reads').upsert({announcement_id:id},{onConflict:'announcement_id,user_id',ignoreDuplicates:true}).then(()=>{});
  document.querySelectorAll('[data-ann="'+id+'"] .dot').forEach(x=>x.remove()); if($('#nav')&&G==='app') $('#nav').innerHTML=navHtml(); const t=document.querySelector('.ticker .tag'); if(t){ const u=unread(); t.textContent=u?u+' 則未讀':'共 '+vis().length+' 則' } }
function openAnn(){ let d=document.getElementById('annDlg'); if(!d){ d=document.createElement('dialog'); d.id='annDlg'; document.body.appendChild(d) }
  d.innerHTML=`<div class="col"><div class="head"><div><h2>公告</h2><p class="sub">點標題可以展開完整內容。</p></div><button data-annclose="1">關閉</button></div>${annList()}</div>`; d.showModal(); const one=d.querySelectorAll('details'); if(one.length===1) one[0].open=true }
V.news=()=>`<div class="head"><div><h2>公告欄</h2><p class="sub">系統維護、新功能和方案相關的通知都會放在這裡。點標題展開內容，展開後就算已讀。</p></div>${unread()?'<button data-annall="1">全部標為已讀</button>':''}</div>${annList()}`;
const locT=x=>{ if(!x) return ''; const d=new Date(x); return isNaN(d)?'':new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16) };
function grabAnn(){ const g=id=>document.getElementById(id); if(!g('anTitle')) return; annEdit=Object.assign(annEdit||{},{title:g('anTitle').value,body:g('anBody').value,audience:g('anAud').value,pinned:g('anPin').checked,remind:g('anRem').checked,_s:g('anStart').value,_e:g('anEnd').value}) }
async function saveAnn(status){ grabAnn(); const e=annEdit||{}, title=(e.title||'').trim(); if(!title){ annMsg='沒有儲存：請先填標題。'; return render() }
  const st=e._s?new Date(e._s):new Date(), en=e._e?new Date(e._e):null; if(en&&en<=st){ annMsg='沒有儲存：結束時間要晚於開始時間。'; return render() }
  const row={title:title.slice(0,80),body:(e.body||'').trim().slice(0,4000),audience:e.audience||'members',pinned:!!e.pinned,remind:e.remind!==false,status,starts_at:st.toISOString(),ends_at:en?en.toISOString():null};
  annMsg='儲存中…'; render(); const r=e.id?await sbc.from('bom_announcements').update(row).eq('id',e.id).select('id'):await sbc.from('bom_announcements').insert(row).select('id');
  if(r.error||!r.data||!r.data.length){ annMsg='沒有儲存成功（'+((r.error&&r.error.message)||'').slice(0,60)+'），請再試一次。'; return render() }
  annEdit=null; await loadAnns(); annMsg=status==='draft'?'已存成草稿，業主還看不到。':st>new Date()?'已排程，會在 '+tm(row.starts_at)+' 自動開始顯示。':'已發布，'+AUDS[row.audience]+'現在就看得到。'; render() }
async function setAnn(id,status){ const {error}=await sbc.from('bom_announcements').update({status}).eq('id',id); await loadAnns(); annMsg=error?'更新失敗，請再試一次。':status==='archived'?'已封存，不再顯示；紀錄仍保留在這裡。':'已重新發布。'; render() }
V.annc=()=>{ const e=annEdit||{}, f=ui.annF||'all', ST={live:['發布中','good'],sched:['排程中','puz'],expired:['已過期','warn'],draft:['草稿','warn'],archived:['已封存','bad']};
  const cl=adm.profiles.filter(p=>p.role!=='admin'&&p.status==='active'), elig=a=>cl.filter(p=>a.audience==='basic'||a.audience==='pro'?p.plan===a.audience:true), readers=a=>{ const S=new Set(annReads.filter(x=>x.announcement_id===a.id).map(x=>x.user_id)); return elig(a).filter(p=>S.has(p.user_id)) };
  const rows=anns.filter(a=>f==='all'||annState(a)===f), cnt=k=>anns.filter(a=>annState(a)===k).length;
  return `<div class="head"><div><h2>公告管理</h2><p class="sub">在這裡撰寫、排程和封存公告。發布後會以跑馬燈顯示在畫面上方，業主點了可以看完整內容。公告不會被刪除，封存後仍留在下方的歷史紀錄。</p></div></div>
<div class="tiles"><div class="tile"><span>發布中</span><b>${cnt('live')}</b></div><div class="tile"><span>排程中</span><b>${cnt('sched')}</b></div><div class="tile"><span>草稿</span><b>${cnt('draft')}</b></div><div class="tile"><span>已過期或封存</span><b>${cnt('expired')+cnt('archived')}</b></div></div>
<h2>${e.id?'編輯公告':'撰寫新公告'}</h2><form id="annForm" class="col" style="max-width:680px">
<label for="anTitle">標題（會出現在跑馬燈，建議 30 字內）</label><input type="text" id="anTitle" maxlength="80" required value="${esc(e.title||'')}" placeholder="例如：10/20 凌晨系統維護通知">
<label for="anBody">完整內容（點開後才看得到，可換行）</label><textarea id="anBody" rows="5" maxlength="4000" placeholder="說明時間、影響範圍、業主需要做什麼。">${esc(e.body||'')}</textarea>
<div class="params"><label for="anAud">給誰看 <select id="anAud">${Object.keys(AUD).map(k=>`<option value="${k}" ${(e.audience||'members')===k?'selected':''}>${AUD[k]}</option>`).join('')}</select></label><label for="anPin"><input type="checkbox" id="anPin" ${e.pinned?'checked':''}> 置頂</label><label for="anRem"><input type="checkbox" id="anRem" ${e.remind===false?'':'checked'}> 發布滿 3 天還沒讀的業主，自動寄 Email 提醒</label>
<label for="anStart">開始顯示 <input type="datetime-local" id="anStart" value="${e._s!==undefined?e._s:(e.id?locT(e.starts_at):'')}"></label><label for="anEnd">結束顯示 <input type="datetime-local" id="anEnd" value="${e._e!==undefined?e._e:locT(e.ends_at)}"></label></div>
<p class="note">開始時間留空代表立刻顯示；結束時間留空代表一直顯示到你封存為止。</p>
<div class="brandbar"><button class="pri" type="submit">${e.id?'儲存並發布':'發布'}</button><button type="button" data-annact="draft">存成草稿</button>${annEdit?'<button type="button" data-annact="cancel">清空重寫</button>':''}<span class="status" role="status">${esc(annMsg)}</span></div></form>
<div class="head"><div><h2>公告紀錄</h2></div><label for="annF" class="params" style="padding:4px 10px">顯示 <select id="annF" data-ui="annF" data-p="ui.annF">${[['all','全部'],['live','發布中'],['sched','排程中'],['draft','草稿'],['expired','已過期'],['archived','已封存']].map(o=>`<option value="${o[0]}" ${f===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
<div class="scroll"><table><thead><tr><th>狀態</th><th>標題</th><th>給誰看</th><th>顯示期間</th><th>已讀</th><th>最後更新</th><th></th></tr></thead><tbody>${rows.map(a=>{ const k=annState(a), rd=readers(a), el=elig(a); return `<tr><td><span class="pill ${ST[k][1]}">${ST[k][0]}</span></td><td style="white-space:normal">${a.pinned?'<span class="tag">置頂</span> ':''}${esc(a.title)}</td><td>${AUDS[a.audience]}</td><td>${tm(a.starts_at)}<br><span class="note">到 ${a.ends_at?tm(a.ends_at):'封存為止'}</span></td><td>${k==='draft'?'–':`<button data-annwho="${a.id}">${rd.length} / ${el.length} 人</button>`}</td><td>${tm(a.updated_at)}<br><span class="note">${esc(a.created_by_email||'')}</span></td><td><button data-annedit="${a.id}">編輯</button> <button data-anncopy="${a.id}">複製</button> ${a.status==='published'?`<button data-annset="${a.id}|archived">封存</button>`:`<button data-annset="${a.id}|published">${a.status==='draft'?'發布':'重新發布'}</button>`}</td></tr>${annWho===a.id?(()=>{ const un=el.filter(p=>!rd.includes(p)), rt=p=>(annReads.find(x=>x.announcement_id===a.id&&x.user_id===p.user_id)||{}).read_at, rm=p=>annRems.find(x=>x.announcement_id===a.id&&x.user_id===p.user_id);
      return `<tr><td colspan="7" style="white-space:normal;background:var(--field)"><div class="col"><div class="brandbar"><b>未讀名單（${un.length} 人）</b>${k==='live'&&un.length?`<button data-annremind="${a.id}">立即寄 Email 提醒這 ${un.length} 人</button>`:''}<span class="note">${a.remind?'自動提醒：開啟（發布滿 3 天後的平日上午寄出，每人每則只寄一次）':'自動提醒：關閉'}</span></div>
<div class="scroll"><table><thead><tr><th>業主</th><th>Email</th><th>方案</th><th>狀態</th><th>提醒紀錄</th></tr></thead><tbody>${un.map(p=>{const m=rm(p);return `<tr><td>${esc(p.display_name||'（未填名稱）')}</td><td>${esc(p.email)}</td><td>${PLAN_NAME[p.plan]}</td><td><span class="pill warn">未讀</span></td><td>${m?tm(m.sent_at)+(m.manual?'（手動）':'（自動）'):'尚未提醒'}</td></tr>`}).join('')}${rd.map(p=>{const m=rm(p);return `<tr><td>${esc(p.display_name||'（未填名稱）')}</td><td>${esc(p.email)}</td><td>${PLAN_NAME[p.plan]}</td><td><span class="pill good">已讀</span> ${tm(rt(p))}</td><td>${m?tm(m.sent_at)+(m.manual?'（手動）':'（自動）'):'–'}</td></tr>`}).join('')||''}${el.length?'':'<tr><td colspan="5">目前沒有符合這則公告對象的使用中業主。</td></tr>'}</tbody></table></div></div></td></tr>` })():''}` }).join('')||'<tr><td colspan="7">這個分類目前沒有公告。</td></tr>'}</tbody></table></div>
<h2>未讀總覽（依業主）</h2><p class="sub">每位使用中的業主目前還有哪些發布中的公告沒讀。</p><div class="scroll"><table><thead><tr><th>業主</th><th>Email</th><th class="n">未讀</th><th>未讀的公告</th><th>最近一次提醒</th></tr></thead><tbody>${cl.map(p=>{ const un=anns.filter(a=>annState(a)==='live'&&elig(a).includes(p)&&!annReads.some(x=>x.announcement_id===a.id&&x.user_id===p.user_id)), last=annRems.filter(x=>x.user_id===p.user_id).map(x=>x.sent_at).sort().pop(); return {p,un,last} }).sort((a,z)=>z.un.length-a.un.length).map(({p,un,last})=>`<tr><td>${esc(p.display_name||'（未填名稱）')}</td><td>${esc(p.email)}</td><td class="n">${un.length}</td><td style="white-space:normal">${un.map(a=>esc(a.title)).join('、')||'<span class="pill good">全部已讀</span>'}</td><td>${last?tm(last):'–'}</td></tr>`).join('')||'<tr><td colspan="5">目前沒有使用中的業主。</td></tr>'}</tbody></table></div>
<p class="note">「已讀」是指業主點開過完整內容。人數只計算目前使用中、而且符合對象的業主；公開公告在登入頁被看到不會計入。</p>` };
document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.dataset&&d.dataset.ann&&d.open) markRead(d.dataset.ann) },true);
document.addEventListener('input',e=>{ if(e.target.closest&&e.target.closest('#annForm')) grabAnn() });
document.addEventListener('click',e=>{ const dlg=document.getElementById('annDlg'); if(dlg&&e.target===dlg){ dlg.close(); render(); return } const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.annopen){ openAnn(); return } if(d.annclose){ dlg&&dlg.close(); render(); return }
  if(d.annall){ vis().forEach(a=>markRead(a.id)); render(); return }
  if(t.dataset.tab==='news'||t.dataset.tab==='annc'){ annMsg=''; loadAnns().then(()=>{ if(tab==='news'||tab==='annc') render() }) }
  if(!isAdmin()) return;
  if(d.annact==='draft'){ saveAnn('draft'); return } if(d.annact==='cancel'){ annEdit=null; annMsg=''; render(); return }
  if(d.annedit){ const a=anns.find(x=>x.id===d.annedit); if(a){ annEdit=Object.assign({},a); annMsg='正在編輯：'+a.title; render(); window.scrollTo(0,0) } return }
  if(d.anncopy){ const a=anns.find(x=>x.id===d.anncopy); if(a){ annEdit={title:(a.title+'（複本）').slice(0,80),body:a.body,audience:a.audience,pinned:a.pinned,remind:a.remind,_s:'',_e:''}; annMsg='已複製內容，修改後按發布或存成草稿。'; render(); window.scrollTo(0,0) } return }
  if(d.annset){ const [id,st]=d.annset.split('|'); setAnn(id,st); return }
  if(d.annremind){ annMsg='寄送中…'; render(); sbc.rpc('bom_ann_remind',{target:d.annremind}).then(async({data,error})=>{ await loadAnns(); annMsg=error?'提醒信沒有寄出，請稍後再試。':'已寄出提醒信給 '+(data||0)+' 位未讀的業主。'; render() }); return }
  if(d.annwho){ annWho=annWho===d.annwho?null:d.annwho; render(); return } });

/* ---- 品牌管理（僅管理員） ---- */
function touchId(id){ dirty.add(id); setStatus('儲存中…'); clearTimeout(timer); timer=setTimeout(flush,900) }
function makeBrand(name,from){ const id=uid('b'), src=from&&brands[from]; brands[id]=src?norm(Object.assign(JSON.parse(JSON.stringify(src)),{name,sample:false})):norm(blank(name)); return id }
V.brands=()=>{ const ids=Object.keys(brands), owners=id=>adm.access.filter(a=>a.brand_id===id).map(a=>(adm.profiles.find(p=>p.user_id===a.user_id)||{})).filter(p=>p.email);
  return `<div class="head"><div><h2>品牌管理</h2><p class="sub">每個品牌是一套獨立的食材、配方和損益資料。先在這裡建立品牌，再到「授權管理」指派給業主。品牌名稱可以隨時直接修改。</p></div></div>
<h2>新增品牌</h2><form id="nbForm" class="params"><label for="nbName">品牌名稱 <input type="text" id="nbName" required maxlength="60" placeholder="例如：嗑肉石鍋" style="min-width:200px"></label><label for="nbFrom">起始內容 <select id="nbFrom"><option value="">空白（從頭建立）</option>${ids.map(id=>`<option value="${id}">複製「${esc(brands[id].name)}」的資料</option>`).join('')}</select></label><button class="pri" type="submit">建立品牌</button></form>
<h2>所有品牌</h2><div class="scroll"><table><thead><tr><th>品牌名稱（可直接修改）</th><th class="n">食材</th><th class="n">品項</th><th class="n">損益期數</th><th>可使用的業主</th><th></th></tr></thead><tbody>${ids.map(id=>{ const b=brands[id], os=owners(id), k='bd:'+id; return `<tr><td><input type="text" data-bname="${id}" value="${esc(b.name)}" maxlength="60" aria-label="品牌名稱"></td><td class="n">${b.ingredients.length}</td><td class="n">${b.items.length}</td><td class="n">${(b.periods||[]).length}</td><td style="white-space:normal">${os.map(p=>esc(p.display_name||p.email)+(p.status==='active'?'':'（'+({pending:'待開通',suspended:'停權'}[p.status]||'')+'）')).join('、')||'<span class="pill warn">尚未指派</span>'}</td><td><button data-bopen="${id}">開啟</button> <button data-bexp="${id}">匯出 Excel</button> <button class="del ${armed===k?'armed':''}" data-bdel="${id}">${armed===k?'確定刪除':'刪除'}</button></td></tr>` }).join('')||'<tr><td colspan="6">還沒有品牌。請用上方表單建立第一個。</td></tr>'}</tbody></table></div>
<p class="note">刪除品牌前系統會自動保留一份備份。刪除後，原本被指派的業主就看不到這個品牌。業主解約需要交接資料時，按「匯出 Excel」會下載這個品牌所有頁面的完整資料。</p>` };

/* ---- 授權管理（僅管理員） ---- */
async function loadAdmin(){ const [p,a]=await Promise.all([sbc.from('bom_profiles').select('*').order('created_at',{ascending:false}),sbc.from('bom_brand_access').select('*')]); adm={profiles:p.data||[],access:a.data||[]} }
V.admin=(b,c)=>{ const ORD={pending:0,active:1,suspended:2,rejected:3}, ps=adm.profiles.filter(p=>p.role!=='admin').sort((a,z)=>(ORD[a.status]||0)-(ORD[z.status]||0)), t=today(), soon=new Date(Date.now()+38*86400e3).toISOString().slice(0,10);
  const opt=(uid,f,v,os)=>`<select data-adm="${uid}|${f}" aria-label="${f}">${os.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  return `<div class="head"><div><h2>授權管理</h2><p class="sub">業主在登入頁註冊並完成 Email 驗證後會出現在這裡。請由左到右設定，最後才改狀態。</p><ol class="sub" style="padding-left:20px;margin:0"><li>選<b>方案</b>、<b>權限</b>、<b>到期日</b></li><li>勾選<b>可使用的品牌</b>；還沒有品牌就按「建立品牌並指派」</li><li>確認收款後把<b>狀態</b>改成「使用中」，系統會自動寄開通信</li><li>之後調整方案、權限或到期日會立刻生效；要通知業主請按「寄異動通知」</li><li>解約或欠費時把狀態改成「停權」，業主無法登入但資料保留，系統會寄信告知。需要交接資料，到「品牌管理」按「匯出 Excel」</li><li>不打算開通的申請改成「不開通」：不會寄信，也不會再算進待開通</li></ol></div><button data-act="admreload">重新整理名單</button></div>
<div class="tiles"><div class="tile"><span>業主帳號</span><b>${ps.length}</b></div><div class="tile"><span>待開通</span><b>${ps.filter(p=>p.status==='pending').length}</b></div><div class="tile"><span>30 天內到期</span><b>${ps.filter(p=>p.status==='active'&&p.expires_on&&p.expires_on>=t&&p.expires_on<=soon).length}</b></div><div class="tile"><span>已到期或停權</span><b>${ps.filter(p=>p.status==='suspended'||(p.expires_on&&p.expires_on<t)).length}</b></div></div>

  if(G==='blocked'){ const sus=prof&&prof.status==='suspended'; return box(`<h2>${sus?'授權已停用':'授權已到期'}</h2><p class="sub">${sus?'這個帳號的使用授權目前已停用。':'這個帳號的使用授權已於 '+esc(prof&&prof.expires_on||'')+' 到期。'}</p>${stepl(['你的資料都完整保存著，沒有被刪除','聯絡 '+LICENSOR+' 辦理'+(sus?'恢復':'續約'),'處理完成後回到這裡按「重新檢查」，就能繼續使用'])}<div class="brandbar"><button class="pri" data-auth="reload">重新檢查</button>${lineBtn(sus?'':'用 LINE 聯絡續約')}<button data-auth="out">登出</button></div>`) }

${faq}`) }
const AUTH_ERR=e=>{ const raw=(e&&e.message||''), m=raw.toLowerCase();
  if(m.includes('failed to fetch')||m.includes('network')||m.includes('load failed')) return '連不上伺服器。請確認網路正常後再試一次；如果用的是公司網路，可以改用手機網路試試。';
  if(m.includes('invalid login')) return 'Email 或密碼不正確。請檢查大小寫和有沒有多打空白（可按「顯示」看密碼）。忘記密碼請按下方「忘記密碼」；還沒註冊請按「註冊新帳號」。';
  if(m.includes('not confirmed')){ needConfirm=true; return '這個 Email 還沒完成驗證。請到信箱點確認信裡的連結；找不到信的話，按下面的「重寄驗證信」。' }
  if(m.includes('already registered')||m.includes('already been registered')) return '這個 Email 已經註冊過，請直接登入。忘記密碼可按「忘記密碼」。';
  if(m.includes('email rate limit')) return '短時間內寄信次數太多。請等一小時後再試，或聯絡 '+LICENSOR+' 協助。';
  if(m.includes('rate limit')||m.includes('security purposes')) return '操作太頻繁，請等一分鐘再試。';
  if(m.includes('different from the old')) return '新密碼不能和原本的密碼一樣，請換一組。';
  if(m.includes('session missing')||m.includes('expired')) return '這個連結已經失效。請回登入頁重新按「忘記密碼」，再點最新那封信裡的連結。';
  if(m.includes('invalid')&&m.includes('email')) return 'Email 格式不正確，請檢查有沒有打錯。';
  if(m.includes('password')) return '密碼不符合規定，請至少輸入 8 個字。';
  return '無法完成（'+raw.slice(0,70)+'）。請稍後再試一次；還是不行的話，把這段訊息告訴 '+LICENSOR+'。' };
const REDIR=()=>location.origin+location.pathname;
function grab(){ const n=document.getElementById('auName'), e=document.getElementById('auEmail'); if(n) authF.name=n.value.trim(); if(e) authF.email=e.value.trim() }
async function resendConfirm(){ grab(); if(!authF.email){ authMsg='請先在上面填入註冊用的 Email，再按「重寄驗證信」。'; return render() }
  authMsg='處理中…'; render();
  try{ const {error}=await sbc.auth.resend({type:'signup',email:authF.email,options:{emailRedirectTo:REDIR()}}); if(error) throw error; authMsg='如果 '+authF.email+' 是尚未驗證的帳號，驗證信已重新寄出。請到信箱點最新那封信的連結，也看一下垃圾信匣。' }catch(e){ authMsg=AUTH_ERR(e) } render() }
async function authSubmit(){ grab(); const pe=document.getElementById('auPass'), pass=pe?pe.value:''; authMsg='處理中…'; render();
  try{ if(G==='recover'){ const {error}=await sbc.auth.updateUser({password:pass}); if(error) throw error; authMsg=''; notice='密碼已更新，下次請用新密碼登入。'; G='loading'; render(); return loadAll() }
    if(authMode==='forgot'){ const {error}=await sbc.auth.resetPasswordForEmail(authF.email,{redirectTo:REDIR()}); if(error) throw error; authMsg='如果這個 Email 有註冊過，重設信已經寄出。請在一小時內點信裡的連結；沒收到請看垃圾信匣。'; return render() }
    if(authMode==='up'){ const {data,error}=await sbc.auth.signUp({email:authF.email,password:pass,options:{data:{display_name:authF.name},emailRedirectTo:REDIR()}}); if(error) throw error;
      if(data.user&&data.user.identities&&!data.user.identities.length){ authMode='in'; authMsg='這個 Email 已經註冊過，請直接登入。忘記密碼可按「忘記密碼」。'; return render() }
      if(!data.session){ authMode='in'; needConfirm=true; authMsg='註冊成功。我們寄了一封確認信到 '+authF.email+'，請點信裡的連結完成驗證，再回來登入。沒收到請看垃圾信匣，或按「重寄驗證信」。'; return render() } authMsg=''; return }
    const {error}=await sbc.auth.signInWithPassword({email:authF.email,password:pass}); if(error) throw error; authMsg=''; needConfirm=false }
  catch(e){ authMsg=AUTH_ERR(e); render() } }
async function pwSubmit(){ const e=document.getElementById('npw'), p=e?e.value:''; acctMsg='處理中…'; render();
  const {error}=await sbc.auth.updateUser({password:p}); acctMsg=error?AUTH_ERR(error):'密碼已更新，下次請用新密碼登入。'; render() }

async function loadAll(){ try{
    let {data:p,error:pe}=await sbc.from('bom_profiles').select('*').eq('user_id',me.id).maybeSingle(); if(pe) throw pe;
    if(!p){ /* 損益分析系統註冊的帳號沒有 BOM 資料：補建待開通並通知管理者 */ await sbc.rpc('bom_ensure_profile'); ({data:p}=await sbc.from('bom_profiles').select('*').eq('user_id',me.id).maybeSingle()); if(!p) throw new Error('profile missing') } prof=p;
    if(prof.status==='pending'){ G='pending'; return render() }
    if(prof.status==='suspended'||prof.status==='rejected'||(!isAdmin()&&expired())){ G='blocked'; return render() }
    const bs=await sbc.from('bom_brands').select('id,name,data,rev').order('name');
    if(bs.error) throw bs.error;
    brands={}; Object.keys(revs).forEach(k=>delete revs[k]); (bs.data||[]).forEach(applyRemote);
    await loadVersions(); await loadAnns();
    if(isAdmin()){ if(!adminTab){ TABS[TABS.length-1][2].push(['admin','授權管理']); adminTab=true } await loadAdmin() }
    cur=null; pick(); if(wantAdmin&&!isAdmin()) notice='你開的是管理員專用的連結，但目前登入的是業主帳號 '+me.email+'。要進授權管理，請先登出，再用管理員帳號登入。'; if(isAdmin()) wantAdmin=false; if(!V[tab]||!allowed(tab)||((tab==='admin'||tab==='brands'||tab==='annc')&&!isAdmin())) tab='home'; G='app'; setStatus('已連線'); startWatch(); render(); loadLog().then(()=>{ if(tab==='home') render() }); loadUps().then(()=>{ if(tab==='home'||tab==='io') render() }) }
  catch(e){ G='error'; authMsg='讀取資料時發生問題，請重新整理頁面。'; render() } }

function render(){ const app=G==='app', ub=$('#userbar'), sh=$('#shell'); sh.classList.toggle('bare',!app); if(!app) sh.classList.remove('open');
  ub.innerHTML=me&&app?`<span>${esc(me.email)}</span><span class="status">${isAdmin()?'管理員':PLAN_NAME[prof.plan]+' · '+(RO()?'只能看':'可編輯')+(prof.expires_on?' · 到期 '+prof.expires_on:'')}</span><div class="brandbar"><button data-tab="account">我的帳號</button><button data-auth="out">登出</button></div>`:'';
  if(!app){ $('#nav').innerHTML=''; $('#banner').innerHTML=''; $('#main').innerHTML=gate(); return }
  if(!V[tab]) tab='home';
  renderApp();
  $('#nav').innerHTML=navHtml(); const g=NAV.find(x=>x[2].includes(tab)); $('#crumb').textContent=(g?g[1]+' › ':'')+LAB[tab]; document.title=LAB[tab]+'｜BOM 運算中心';
  if(tab!=='home'){ const p=$('#banner .params'); if(p) p.remove() }
  { const tk=tab==='news'||tab==='annc'?'':ticker(); if(tk) $('#banner').insertAdjacentHTML('afterbegin','<div style="margin-bottom:10px">'+tk+'</div>') }
  if(notice) $('#banner').insertAdjacentHTML('afterbegin','<div class="sample" role="status" style="margin-bottom:10px">'+esc(notice)+' <button data-notice="1">知道了</button></div>');
  $('#btnNew').hidden=!isAdmin(); $('#btnCopy').hidden=true;
  if(tab==='account'||tab==='help'||tab==='news'||((tab==='brands'||tab==='admin'||tab==='annc')&&isAdmin())){ $('#main').innerHTML=V[tab](); return }
  if(!B()&&!isAdmin()){ $('#main').innerHTML=EMPTY('你的帳號還沒有被指派品牌。請聯絡 '+LICENSOR+'。'); return }
  if(!B()) return;
  if(!isAdmin()) document.querySelectorAll('#banner [data-del],#banner [data-unsample]').forEach(el=>el.hidden=true);
  if(!allowed(tab)){ $('#main').innerHTML=`<div class="empty"><h2>「${LAB[tab]}」是進階版功能</h2><p class="sub">你目前的方案是${PLAN_NAME[prof.plan]}。想使用這項分析，請聯絡 ${LICENSOR} 升級為進階版。升級後原本的資料會直接沿用。</p><button data-tab="home">回首頁</button></div>`; return }
  if(TIP[tab]){ const n=TIP[tab][1]; $('#main').insertAdjacentHTML('afterbegin',`<div class="tip"><span><b>提示</b>　${TIP[tab][0]}</span>${n&&allowed(n)?`<button data-tab="${n}">下一步：${LAB[n]} →</button>`:''}</div>`) }
  if(RO()){ document.querySelectorAll('#main [data-p],#banner [data-p]').forEach(el=>{ if(!el.dataset.ui&&!el.dataset.mx&&!el.dataset.sim) el.disabled=true });
    document.querySelectorAll('#main [data-add],#main [data-del],#main [data-act],#main [data-arm],#main #verNote').forEach(el=>el.hidden=true) } }

document.addEventListener('submit',e=>{ if(e.target.id==='annForm'&&isAdmin()){ e.preventDefault(); saveAnn('published'); return }
  if(e.target.id==='pubForm'&&isAdmin()){ e.preventDefault(); const v={}; ['line_url','basic_price','pro_price','intro'].forEach(f=>{ v[f]=(document.getElementById('pub-'+f).value||'').trim()||null });
    if(v.line_url&&!/^https:\/\//.test(v.line_url)){ pubMsg='沒有儲存：LINE 連結要以 https:// 開頭'; return render() } v.updated_at=new Date().toISOString(); pubMsg='儲存中…'; render();
    sbc.from('bom_public_settings').update(v).eq('id',1).select('id').then(({data,error})=>{ if(error||!data||!data.length) pubMsg='沒有儲存成功，請重新整理後再試'; else { Object.assign(pub,v); pubMsg='已儲存 ✓ '+tm(v.updated_at)+'，登入頁已更新' } render() }); return }

/* 用量差異：兩次盤點之間，實際用量（期初＋進貨−期末）對照配方算出的理論用量 */
let varEnd='', varRev='';
const sg$=v=>(v<0?'-':v>0?'+':'')+$$(Math.abs(v),0);
function varCalc(b,c,a,z){ const items=invItems(b,c), la={}, lz={}; (inv.lines[a.id]||[]).forEach(l=>la[l.item_key]=l); (inv.lines[z.id]||[]).forEach(l=>lz[l.item_key]=l);
  const rc={}; inv.rcv.filter(r=>r.received_on>a.count_on&&r.received_on<=z.count_on).forEach(r=>(r.lines||[]).forEach(L=>{ const o=rc[L.key]=rc[L.key]||{q:0,amt:0}; o.q+=(+L.qty||0)*(+L.pack||1); o.amt+=+L.amount||0 }));
  const days=Math.max(1,Math.round((new Date(z.count_on)-new Date(a.count_on))/864e5)), dpm=b.settings.daysPerMonth||30, d=demand(b,c), th=theory(b,c);
  const est=th.sales*days/dpm, rev=parseFloat(varRev), scale=rev>0&&th.sales>0?rev/th.sales:days/dpm;
  const rows=items.map(p=>{ const o=la[p.key]?+la[p.key].qty_base:0, cl=lz[p.key]?+lz[p.key].qty_base:0, r=rc[p.key]?rc[p.key].q:0, act=o+r-cl, g=c.get(p.key), y=p.key[0]==='i'?((g&&g.yield)||100)/100:1;
    const thq=(d[p.key]||0)/y*scale, cost=lz[p.key]&&lz[p.key].unit_cost!=null?+lz[p.key].unit_cost:p.cost, dq=act-thq;
    return {p,o,r,cl,act,thq,dq,dv:dq*cost,av:act*cost,tv:thq*cost,rate:thq>0?dq/thq:NaN,miss:!la[p.key]||!lz[p.key]} });
  return {rows,days,est,rev:rev>0?rev:NaN,scale,rcvAmt:Object.values(rc).reduce((t,x)=>t+x.amt,0)} }
V.var=(b,c)=>{ const head=`<div class="head"><div><h2>用量差異分析</h2><p class="sub">比較兩次盤點之間「實際用掉多少」和「照配方應該用多少」。差很多的食材，就是損耗、份量不準、漏登進貨或配方沒建好的線索。</p></div></div>`;
  if(!invEnsure()) return head+invWait();
  const cl=inv.cnt.filter(x=>x.status==='closed');
  if(cl.length<2) return head+`<div class="empty"><p class="sub">要有兩次「已完成」的盤點才算得出來，目前有 ${cl.length} 次。</p><p class="sub">做法：月底盤點一次 → 這個月每次進貨都登記 → 下個月底再盤點一次。</p><button data-tab="cnt">去盤點</button></div>`;
  if(!varEnd||!cl.some(x=>x.id===varEnd)) varEnd=cl[0].id;
  const zi=cl.findIndex(x=>x.id===varEnd), z=cl[zi], a=cl[zi+1];
  const sel=`<div class="params"><label for="iv-vend">比較期間 <select id="iv-vend" data-varend="1" aria-label="比較期間">${cl.slice(0,-1).map((x,i)=>`<option value="${x.id}" ${x.id===varEnd?'selected':''}>${esc(cl[i+1].count_on)} ～ ${esc(x.count_on)}（${esc(x.label||'盤點')}）</option>`).join('')}</select></label><label for="iv-vrev">這段期間的營業額（可不填） <input type="number" id="iv-vrev" data-varrev="1" step="any" min="0" inputmode="decimal" value="${esc(varRev)}" placeholder="例如 850000" style="width:130px"></label></div>`;
  if(!a) return head+sel+EMPTY('這是最早的一次盤點，前面沒有可以比較的盤點。');
  if(!inv.lines[a.id]||!inv.lines[z.id]){ if(!inv.lines[a.id]) cntLoadLines(a.id); if(!inv.lines[z.id]) cntLoadLines(z.id); return head+sel+EMPTY('讀取中…') }
  const R=varCalc(b,c,a,z), noRecipe=!b.items.some(it=>(it.monthlySales||0)>0), A=R.rows.reduce((t,r)=>t+r.av,0), T=R.rows.reduce((t,r)=>t+r.tv,0), lt=r=>!isFinite(r.rate)?(r.act>0&&Math.abs(r.dv)>=100?['配方沒用到','warn']:['正常','good']):Math.abs(r.dv)<100?['正常','good']:Math.abs(r.rate)>=.1?[r.dq>0?'用太多':'用太少','bad']:Math.abs(r.rate)>=.05?[r.dq>0?'偏多':'偏少','warn']:['正常','good'];
  const rows=R.rows.slice().sort((x,y)=>Math.abs(y.dv)-Math.abs(x.dv)).map(r=>{ const s=lt(r), p=r.p; return `<tr><td>${esc(p.name)}</td><td class="n">${qtyTxt(p,r.o)}</td><td class="n">${qtyTxt(p,r.r)}</td><td class="n">${qtyTxt(p,r.cl)}</td><td class="n"><b>${qtyTxt(p,r.act)}</b></td><td class="n">${qtyTxt(p,r.thq)}</td><td class="n">${r.dq>0?'+':''}${qtyTxt(p,r.dq)}</td><td class="n">${sg$(r.dv)}</td><td class="n">${isFinite(r.rate)?(r.rate>0?'+':'')+pct(r.rate,0):'–'}</td><td><span class="pill ${s[1]}">${s[0]}</span>${r.act<0?' <span class="pill bad">期末比期初＋進貨還多</span>':''}</td></tr>` }).join('');
  const neg=R.rows.filter(r=>r.act<0).length, over=R.rows.filter(r=>lt(r)[1]==='bad').length;
  return head+sel+(noRecipe?'<p class="sample">品項配方還沒填月銷量，理論用量會是 0。請先到「品項配方」填每道菜的月銷量。</p>':'')+`
<div class="tiles"><div class="tile"><span>實際食材成本</span><b>${$$(A,0)}</b><span>${R.days} 天 · 期初＋進貨−期末</span></div><div class="tile"><span>照配方應該花</span><b>${$$(T,0)}</b><span>${isFinite(R.rev)?'依你填的營業額換算':'依月銷量 × '+R.days+' 天估算'}</span></div><div class="tile"><span>差異金額</span><b>${sg$(A-T)}</b><span>${T?(A-T>0?'多花 ':'少花 ')+pct(Math.abs(A-T)/T,1):''}</span></div>${isFinite(R.rev)?`<div class="tile"><span>實際食材成本率</span><b>${pct(A/R.rev)}</b><span>理論 ${pct(T/R.rev)}</span></div>`:''}</div>
${over||neg?`<div class="board"><b>需要注意</b>${over?`<span>有 ${over} 樣食材差異超過 10%，建議先從金額最大的開始查：份量有沒有照標準、有沒有報廢沒記、進貨有沒有漏登。</span>`:''}${neg?`<span>有 ${neg} 樣食材算出來用量是負的，通常是進貨漏登或盤點數字填錯。</span>`:''}</div>`:''}
<div class="scroll"><table><thead><tr><th>品項</th><th class="n">期初</th><th class="n">進貨</th><th class="n">期末</th><th class="n">實際用量</th><th class="n">理論用量</th><th class="n">差異量</th><th class="n">差異金額</th><th class="n">差異率</th><th>判斷</th></tr></thead><tbody>${rows}</tbody></table></div>
<p class="note">理論用量 = 每道菜的配方 × 銷量，已把可用率的損耗算進去。${isFinite(R.rev)?'銷量用你填的營業額，依目前菜單的銷售比例換算。':'沒有填營業額時，用「品項配方」的月銷量 × '+R.days+' 天 ÷ '+(b.settings.daysPerMonth||30)+' 天估算；填上這段期間的實際營業額會更準。'}差異 10% 以上標紅、5% 以上標黃，金額小於 100 元不標。金額用期末盤點當時的進價。</p>` };
document.addEventListener('change',e=>{ const d=e.target.dataset||{}; if(d.varend){ varEnd=e.target.value; render() } else if(d.varrev){ varRev=e.target.value; render() } });
