<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人資與勞基法中心</title>
<meta name="description" content="餐飲與微型企業業主用：人資範本、勞基法查詢、案例引導與計算工具。">
<style>
:root{
  --bg:#f3f5f4; --panel:#ffffff; --line:#d9dfdc; --fg:#18211e; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f7f9f8; --paper:#ffffff; --ink:#111;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1; --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b; --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d; --field:#141c19; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 var(--sans)}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:12px 0 6px}
.sub{color:var(--mute);margin:2px 0 10px}.note{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav.tabs a{padding:7px 13px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);background:var(--panel);font-size:14px}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
label{display:block;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;color:inherit}
textarea{min-height:64px}
button,.btn{white-space:nowrap;font:inherit;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.msg{padding:10px 12px;border-radius:8px;background:var(--accent-soft);margin:10px 0}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--fg)}
.tile:hover{border-color:var(--accent)}.tile b{display:block}.tile span{color:var(--mute);font-size:13px}
.ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-right:8px;flex:none}
.tile .h{display:flex;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.verdict{border-radius:10px;padding:14px 16px;margin:8px 0}
.verdict.ok{background:var(--good-bg);color:var(--fg);border-left:5px solid var(--good)}
.verdict.warn{background:var(--warn-bg);color:var(--fg);border-left:5px solid var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--fg);border-left:5px solid var(--bad)}
.verdict h2{margin:0 0 6px}.verdict ol{margin:6px 0 0;padding-left:22px}
.crumb{color:var(--mute);font-size:13px;margin:4px 0}
.art{border-top:1px solid var(--line);padding:10px 0}
.art h3{margin:0 0 4px;font-size:15px}.art p{margin:0;white-space:pre-wrap}
.lawbox{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;font-size:14px}
.lawbox .src{display:block;margin-top:6px;font-size:12px;color:var(--mute);white-space:normal}
.doc{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:28px 26px;font:14px/1.8 "Noto Serif TC","PMingLiU",serif;overflow-wrap:anywhere}
.doc h1{font-size:20px;text-align:center;margin:0 0 12px}.doc h2{font-size:16px;margin:14px 0 6px}
.doc table{border-collapse:collapse;width:100%;margin:8px 0}.doc th,.doc td{border:1px solid #999;padding:5px 7px;vertical-align:top;text-align:left}
.doc th{background:#f0f0f0}.doc .tip{background:#fff7dd;border:1px dashed #c9a227;padding:8px 10px;font-family:var(--sans);font-size:13px}
.doc .sig{margin-top:22px}.doc .blank{color:#888}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin-top:10px}
.res div{min-width:0}
.res div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:22px;font-weight:700;color:var(--accent)}
.scroll{overflow-x:auto}table.t{border-collapse:collapse;width:100%;font-size:14px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.hit{padding:8px 0;border-bottom:1px solid var(--line)}.hit small{color:var(--mute)}
mark{background:var(--warn-bg);color:inherit}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{padding:14px 18px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:17px}
dialog .db{padding:12px 18px;max-height:60vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wl{margin:0;padding:0;list-style:none}.wl li{border-left:4px solid var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:6px;margin:8px 0}
.wl li.bad{border-color:var(--bad);background:var(--bad-bg)}.wl b{display:block}
.banner{border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px;background:var(--warn-bg);border-left:4px solid var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}.banner.ok{background:var(--good-bg);border-color:var(--good)}
details.qa{border-top:1px solid var(--line);padding:10px 0}details.qa summary{cursor:pointer;font-weight:600;list-style-position:outside}
details.qa .w{background:var(--bad-bg);border-radius:6px;padding:6px 10px;margin:8px 0 6px}details.qa .r{background:var(--good-bg);border-radius:6px;padding:6px 10px;margin:6px 0}
.guide ol{margin:4px 0 8px;padding-left:22px}.guide ul{margin:4px 0;padding-left:20px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.pt{background:var(--warn-bg);color:var(--warn)}
.empl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.empl .m{color:var(--mute);font-size:13px}.empl .act{grid-row:span 2;align-self:center;display:flex;gap:6px}
@media print{
  body{background:#fff}
  .noprint,header,nav,.card:not(.printme){display:none!important}
  .card.printme{border:0;padding:0;margin:0}.split{display:block}
  .doc{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="noprint">
    <div><h1>人資與勞基法中心</h1><p class="sub">範本、法規、案例引導與計算工具｜品牌加辣餐飲顧問工作室</p></div>
    <div class="row" id="top" style="margin-top:4px"></div>
  </header>
  <div id="app"><p class="sub">讀取中…</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL='https://thxqncpkkzmpktwuvzvz.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoeHFuY3Bra3ptcGt0d3V2enZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTMyODcsImV4cCI6MjEwNjk4OTI4N30.cDjeuOxx2UZLrOWYcNhqy4dO2cdznscJ7CWr0DZGZ2g';
const BASE='https://marvintien90-jpg.github.io/bom-center/';
const sbc=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>isFinite(n)?Math.round(n).toLocaleString('zh-TW'):'–';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ss={get(k){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let me=null, C=null, err='', mode='login', flash='';
const CO_FIELDS=[['co','公司名稱','好吃餐飲有限公司'],['brand','品牌名稱','好吃小火鍋'],['boss','負責人',''],['taxid','統一編號',''],['addr','地址',''],['tel','聯絡電話',''],['payday','每月發薪日','5'],['hr','人事聯絡人','']];
const coKey=()=>'hr_co_'+(me?me.id:'x');
const co=()=>SET||{};

// ── 資料讀取 ──
async function boot(){
  const {data:{session}}=await sbc.auth.getSession(); me=session&&session.user||null;
  if(me) await fetchContent();
  route();
}
// 權限：管理員，或 BOM／損益中心任一帳號有效且未過期（與統一入口 rule:'any' 相同）。內容為站內靜態檔。
const todayTW=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const valid=p=>!!p&&p.status==='active'&&(p.role==='admin'||!p.expires_on||p.expires_on>=todayTW());
async function fetchContent(){
  err='';
  try{
    const [b,p]=await Promise.all([sbc.from('bom_profiles').select('role,status,expires_on').eq('user_id',me.id).maybeSingle(),sbc.from('pl_profiles').select('role,status,expires_on').eq('user_id',me.id).maybeSingle()]);
    if(!valid(b.data)&&!valid(p.data)){err='NO_ACCESS';return}
    const v='?v=20261117';
    const [L,T,K,Q,B,I]=await Promise.all(['laws','templates','cases','qa','biz','insurance'].map(f=>import('./content/'+f+'.js'+v)));
    C={checked:L.LAWS_CHECKED,laws:L.LAWS,notes:L.NOTES,cats:T.TEMPLATE_CATS,templates:T.TEMPLATES,cases:K.CASES,qa:Q.QA,qaCats:Q.QA_CATS,biz:B.BIZ,guides:B.GUIDES,topics:B.TOPICS,ins:I};
    await loadOwnerData();
  }catch(e){err='讀取失敗，請重新整理再試一次。'}
}
// 公司設定與員工名單存在雲端（hr_settings、hr_employees，RLS 只看得到自己的）
let SET={}, EMPS=[], cloudOk=true;
async function loadOwnerData(){
  const [s,e]=await Promise.all([sbc.from('hr_settings').select('data').eq('user_id',me.id).maybeSingle(),sbc.from('hr_employees').select('id,name,kind,data,active,created_at').eq('user_id',me.id).order('created_at')]);
  cloudOk=!s.error&&!e.error;
  SET=(s.data&&s.data.data)||{};
  const old=store.get(coKey(),null);
  if(cloudOk&&!s.data&&old&&old.co){SET=old;await saveSet(old)}
  if(!cloudOk) SET=old||{};
  EMPS=(e.data||[]).filter(x=>x.active!==false);
}
async function saveSet(v){
  SET=v; store.set(coKey(),v);
  const {error}=await sbc.from('hr_settings').upsert({user_id:me.id,data:v,updated_at:new Date().toISOString()});
  return !error;
}
sbc.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){me=null;C=null;route()} });

// ── 條文查找 ──
function lawRef(ref){
  const [code,no]=ref.split(':');
  if(code==='NOTE'){const n=(C.notes||[]).find(x=>x.t===no);return n?{label:no,law:'重點說明',text:n.d,src:n.src,amended:'整理日 '+C.checked}:null}
  const L=C.laws.find(l=>l.code===code); if(!L) return null;
  const a=L.articles.find(x=>x[0]===no); if(!a) return null;
  return {label:L.name+' 第 '+no+' 條',law:L.name,text:a[2],src:L.url,amended:'修正日期 '+L.amended};
}
const shortName={LSA:'勞基法',LSAER:'施行細則',LEAVE:'請假規則',GEEA:'性平法',LPA:'勞退條例'};
const refLabel=ref=>{const [c,n]=ref.split(':');return c==='NOTE'?n:(shortName[c]||c)+' '+n};
const chips=refs=>refs&&refs.length?`<div class="chips">${refs.map(r=>`<button class="chip" data-ref="${esc(r)}" aria-expanded="false">${esc(refLabel(r))}</button>`).join('')}</div><div class="lawslot"></div>`:'';
function bindChips(root){
  root.querySelectorAll('.chip[data-ref]').forEach(b=>b.onclick=()=>{
    const slot=b.parentElement.nextElementSibling; const r=lawRef(b.dataset.ref); if(!r||!slot) return;
    if(slot.dataset.open===b.dataset.ref){slot.innerHTML='';slot.dataset.open='';b.setAttribute('aria-expanded','false');return}
    slot.dataset.open=b.dataset.ref; root.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-expanded','false')); b.setAttribute('aria-expanded','true');
    slot.innerHTML=`<div class="lawbox"><b>${esc(r.label)}</b>\n${esc(r.text)}<span class="src">${esc(r.amended)}｜<a href="${esc(r.src)}" target="_blank" rel="noopener">官方原文</a></span></div>`;
  });
}

// ── 畫面 ──
const TABS=[['home','首頁'],['qa','常見錯誤'],['case','案例引導'],['tpl','範本'],['emp','員工名單'],['calc','計算工具'],['law','法規查詢'],['set','公司設定']];
function shell(tab,body){
  const dl=document.getElementById('dlg'); if(dl){try{dl.close()}catch(e){} dl.remove()}
  $('#top').innerHTML=me?`<a class="btn" href="${BASE}portal/">回入口</a><button id="out">登出</button>`:'';
  if(me) $('#out').onclick=async()=>{await sbc.auth.signOut();try{sessionStorage.clear()}catch(e){};me=null;C=null;location.hash='';route()};
  $('#app').innerHTML=`<nav class="tabs noprint" aria-label="功能">${TABS.map(([k,n])=>`<a href="#${k}" class="${tab===k?'on':''}">${n}</a>`).join('')}</nav>${body}`;
  bindChips($('#app'));
}
function route(){
  if(!me) return viewLogin();
  if(err==='NO_ACCESS') return viewNoAccess();
  if(err||!C){ $('#app').innerHTML=`<div class="msg bad">${esc(err||'讀取中…')}</div><div class="row"><button onclick="location.reload()">重新整理</button></div>`; return }
  const [tab,a,b]=decodeURIComponent(location.hash.slice(1)).split('/');
  if(tab==='case') return a?viewCase(a,b):viewCases();
  if(tab==='tpl') return a?viewTpl(a):viewTpls();
  if(tab==='law') return viewLaw(a);
  if(tab==='calc') return viewCalc(a||'ins',b||'');
  if(tab==='set') return viewSet();
  if(tab==='qa') return viewQA(a||'',b||'');
  if(tab==='emp') return viewEmp(a||'');
  if(tab==='q') return viewSearch(a||'');
  viewHome();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

function viewLogin(){
  const fg=mode==='forgot';
  $('#top').innerHTML='';
  $('#app').innerHTML=`<div class="card" style="max-width:460px"><h2>${fg?'重設密碼':'登入'}</h2><p class="sub">使用和 BOM 運算中心、損益分析中心同一組帳號。</p>${flash?`<div class="msg ${/錯|不/.test(flash)?'bad':''}" role="status">${esc(flash)}</div>`:''}
<form id="lf"><label for="em">Email</label><input id="em" type="email" required autocomplete="email">
${fg?'':'<label for="pw">密碼</label><input id="pw" type="password" required autocomplete="current-password">'}
<div class="row"><button class="pri" type="submit">${fg?'寄重設信':'登入'}</button><button type="button" id="sw">${fg?'回登入':'忘記密碼'}</button></div></form>
<p class="note">還沒有帳號？到 <a href="${BASE}member/">會員中心</a> 註冊或聯絡顧問開通。</p></div>`;
  $('#sw').onclick=()=>{mode=fg?'login':'forgot';flash='';viewLogin()};
  $('#lf').onsubmit=async e=>{e.preventDefault(); const em=$('#em').value.trim();
    if(fg){const {error}=await sbc.auth.resetPasswordForEmail(em,{redirectTo:BASE+'member/'}); flash=error?'寄送失敗，請稍後再試。':'已寄出重設密碼信，請到信箱收信。'; return viewLogin()}
    const {data,error}=await sbc.auth.signInWithPassword({email:em,password:$('#pw').value});
    if(error){flash=/Invalid login/i.test(error.message)?'Email 或密碼不正確。':'登入失敗：'+error.message.slice(0,60);return viewLogin()}
    flash=''; me=data.user; await fetchContent(); route();
  };
}
function viewNoAccess(){
  $('#top').innerHTML=`<button id="out">登出</button>`; $('#out').onclick=async()=>{await sbc.auth.signOut();me=null;err='';route()};
  $('#app').innerHTML=`<div class="card"><h2>這個帳號還沒開通</h2><p>人資與勞基法中心開放給 BOM 運算中心或損益分析中心的有效帳號（試用、訂閱、顧問開通都可以）。</p><div class="row"><a class="btn pri" href="${BASE}member/">到會員中心開始試用</a><a class="btn" href="${BASE}portal/">回入口</a></div></div>`;
}

function viewHome(){
  const c=co();
  const quick=['ot','fire','leave','deduct','sched','pt'].map(id=>C.cases.find(x=>x.id===id)).filter(Boolean);
  shell('home',`
<div class="card"><form id="qf" role="search"><label for="q">遇到什麼問題？直接打關鍵字</label><div style="display:flex;gap:8px"><input id="q" placeholder="例如：加班費、特休、曠工、資遣、扣薪、懷孕" autocomplete="off"><button class="pri" type="submit">搜尋</button></div></form></div>
${c.co&&c.biz?'':`<div class="msg">第一次使用：先到 <a href="#set">公司設定</a> 填公司名稱、負責人並選你的業態，範本與操作說明會依業態調整。</div>`}
${cloudOk?'':'<div class="msg bad">雲端資料暫時讀不到，員工名單先無法使用；公司設定暫存在這台裝置。</div>'}
<div class="grid" style="margin-bottom:12px">
<a class="tile" href="#qa"><div class="h"><span class="ic">錯</span><b>餐飲業常犯錯 ${C.qa.length} 題</b></div><span>扣薪、加班費、特休、試用期、兼職勞健保…每題附條文</span></a>
<a class="tile" href="#emp"><div class="h"><span class="ic">員</span><b>員工名單 ${EMPS.length} 人</b></div><span>新增正職、兼職，自動算勞健保、勞退與每月人事成本</span></a>

const bizOf=()=>C.biz.find(b=>b.id===co().biz)||null;
const nums=s=>(String(s||'').match(/\d[\d,]*(\.\d+)?/g)||[]).map(x=>parseFloat(x.replace(/,/g,'')));
const minFor=v=>{const y=parseInt(String(v.start||v.date||v.month||'').slice(0,4))||+todayTW().slice(0,4);return MIN[y>=2027?2027:2026].concat(y>=2027?2027:2026)};
function ageOn(birth,on){const b=dd(birth),d=dd(on||todayTW());if(!b||!d)return null;return tenure(b,d).y}
function timeRanges(s){const out=[];String(s||'').replace(/(\d{1,2})[:：](\d{2})\s*[–\-~～至到]\s*(凌晨\s*)?(\d{1,2})[:：](\d{2})/g,(m,h1,m1,lt,h2,m2)=>{let a=+h1+m1/60,b=+h2+m2/60;if(b<=a)b+=24;out.push([a,b]);return m});return out}
function checkTpl(t,v,emp){
  const W=[]; const add=(lv,b,d,law)=>W.push({lv,b,d,law:law||[]});
  const all=Object.values(v).join('｜'); const [MM,MH,Y]=minFor(v);
  const isPT=t.id==='contract-pt'||(emp&&emp.kind==='pt');
  // 工資低於最低工資
  const wageKeys={'contract-ft':'pay','offer':'pay'};
  if(wageKeys[t.id]){const n=nums(v[wageKeys[t.id]]).filter(x=>x>=1000);if(n.length&&n[0]<MM)add('bad',`月薪 ${money(n[0])} 元低於 ${Y} 年最低工資 ${money(MM)} 元`,'全時員工月薪（含伙食、全勤等經常性給與）不得低於最低工資；試用期也一樣。',['NOTE:最低工資'])}
  if(t.id==='contract-pt'){const n=nums(v.rate)[0];if(n&&n<MH)add('bad',`時薪 ${n} 元低於 ${Y} 年最低時薪 ${MH} 元`,'兼職、工讀、試做期間都不得低於最低時薪。',['NOTE:最低工資'])}
  String(all).replace(/時薪[^\d｜]{0,6}(\d{2,4})/g,(m,x)=>{if(t.id!=='contract-pt'&&+x<MH)add('bad',`時薪 ${x} 元低於 ${Y} 年最低時薪 ${MH} 元`,'時薪不得低於最低工資。',['NOTE:最低工資']);return m});
  String(all).replace(/月薪[^\d｜]{0,6}(\d{2},?\d{3})/g,(m,x)=>{x=+x.replace(',','');if(!wageKeys[t.id]&&x<MM)add('bad',`月薪 ${money(x)} 元低於 ${Y} 年最低工資 ${money(MM)} 元`,'全時月薪不得低於最低工資。',['NOTE:最低工資']);return m});
  // 工時
  const hrsTxt=[v.hours,v.shift,v.time].filter(Boolean).join('｜');
  const daily=(hrsTxt.match(/每日[^\d｜]{0,8}(\d+(\.\d+)?)\s*小時/)||[])[1]; if(daily&&+daily>8) add('bad',`每日正常工時 ${daily} 小時超過 8 小時`,'正常工時每日不得超過 8 小時、每週不得超過 40 小時；超過的部分是加班，要另給加班費。',['LSA:30','LSA:24']);
  const weekly=(hrsTxt.match(/每週[^\d｜]{0,8}(\d+(\.\d+)?)\s*小時/)||[])[1]; if(weekly&&+weekly>40) add('bad',`每週工時 ${weekly} 小時超過 40 小時`,'每週正常工時不得超過 40 小時。',['LSA:30']);
  const rs=timeRanges(hrsTxt);
  if(rs.some(([a,b])=>b>22||a<6)){
    add('warn','班表含晚上 10 點到早上 6 點的時段','女性員工在這段時間工作，要先經勞資會議（或工會）同意，並提供安全衛生設施，沒有大眾運輸時要提供交通或宿舍；妊娠、哺乳期間不得排這段時間。',['LSA:49']);
  }
  if(rs.some(([a,b])=>b-a>12)) add('bad','有一段班超過 12 小時','一天連同加班最多 12 小時。',['LSA:32']);
  if(rs.some(([a,b])=>b-a>4.5)&&!/休息|用餐|空班/.test(hrsTxt)) add('warn','連續工作超過 4 小時沒有寫休息時間','連續工作 4 小時至少要有 30 分鐘休息，建議在班別旁寫明休息時間。',['LSA:35']);
  if(t.id==='job-post'){const off=nums(v.off)[0];if(off!==undefined&&off<8)add('warn',`月休 ${off} 天可能不夠`,'每 7 天要有 1 天例假、1 天休息日，一個月大約 8–10 天。',['LSA:36'])}
  // 未成年
  if(emp&&emp.data&&emp.data.birth){const a=ageOn(emp.data.birth,v.start);
    if(a!==null&&a<16){add('bad',`${emp.name} 未滿 16 歲（童工）`,'童工每日不得超過 8 小時、例假日不得工作、晚上 8 點到早上 6 點不得工作，並要有法定代理人同意書與年齡證明。',['LSA:47','LSA:48','LSA:46']);if(rs.some(([x,y])=>y>20||x<6))add('bad','童工不得排晚上 8 點以後的班','請把班表改到 20:00 前結束。',['LSA:48'])}
    else if(a!==null&&a<18) add('warn',`${emp.name} 未滿 18 歲`,'要有法定代理人同意書與年齡證明，不得從事危險性或有害性工作（大型油炸、高溫高壓設備）。',['LSA:44','LSA:46'])}
  // 文字用語
  const T=(re,lv,b,d,law)=>{if(re.test(all))add(lv,b,d,law)};
  T(/限\s*(女|男)|女性為佳|男性為佳|\d+\s*歲以(下|內)|年齡\s*\d+|未婚|已婚|顏值|外貌|身高|五官端正/,'bad','文案或條件有性別、年齡、婚姻或外貌限制','就業服務法禁止就業歧視，罰鍰 30 萬元起。請改寫成工作條件，例如「需能久站、可上晚班」。',['NOTE:就業歧視']);
  T(/罰\s*(款|金|錢)|扣\s*\d+\s*元|扣.{0,4}(薪|工資).{0,4}(賠|罰)|賠償.{0,6}(扣|從薪)|打破.{0,8}扣|短少.{0,8}(扣|賠|分攤)|遲到.{0,8}扣\s*\d/,'bad','有罰款或從薪水扣賠償的寫法','工資要全額直接給付，不能預扣工資作為違約金或賠償。沒上班的時間可以按比例不給，但不能罰錢。',['LSA:22','LSA:26']);

  T(/競業/,'warn','有離職後競業禁止','要有值得保護的營業秘密、期間地區合理（最長 2 年），並給不低於月平均工資 50% 的補償；一般門市員工通常不符合，建議改用保密條款。',['LSA:9-1']);
  T(/無薪假|減班/,'warn','有無薪假（減班休息）','要員工個別書面同意並通報勞工局，按月計酬的全時員工減班期間工資仍不得低於最低工資。',['LSA:21']);
  T(/不(保|加保)勞保|免\s*(勞|健)保|自願.{0,4}不.{0,2}保|(勞|健)保.{0,4}(員工|自行)全額|現金.{0,4}不報/,'bad','有不加保或保費全由員工負擔','勞保、就保、職保要在到職當天加保；保費雇主負擔部分不能轉給員工。',['NOTE:勞保、就保、職保要在到職當天加保','NOTE:健保加保與二代健保補充保費']);
  T(/勞退.{0,6}(含|內含|從薪|由員工|自付)|含.{0,3}勞退/,'bad','勞退 6% 從薪水扣或包含在薪水裡','雇主提繳的 6% 是雇主負擔，不能從工資扣，也不能內含在薪水裡。',['LPA:6','LPA:14']);

  // 個別範本
  if(t.id==='layoff'){

    const a=dd(v.start),b=dd(v.last); if(a&&b&&b>a){const tn=tenure(a,b),days=(b-a)/864e5,need=days<91?0:tn.years<1?10:tn.years<3?20:30;const nd=nums(v.notice)[0];
      if(nd!==undefined&&nd<need) add('bad',`預告 ${nd} 日少於法定 ${need} 日`,'年資 3 個月以上未滿 1 年預告 10 日、1 年以上未滿 3 年 20 日、3 年以上 30 日；不預告要給預告期間工資。',['LSA:16']);
      const avg=nums(v.avg)[0],sev=nums(v.sev)[0]; if(avg&&sev!==undefined){const should=Math.min(6,tn.years*0.5)*avg; if(sev+1<should) add('bad',`資遣費 ${money(sev)} 元少於法定約 ${money(should)} 元`,'新制每滿 1 年 0.5 個月平均工資，最高 6 個月。',['LPA:12'])}}
    add('warn','記得在員工離職 10 日前做資遣通報','未通報會被罰鍰。',['NOTE:資遣通報']);
  }
  if(t.id==='annual-leave'){const a=dd(v.start);const days=nums(v.days)[0];if(a&&days!==undefined){const should=alDays(tenure(a,new Date(todayTW()+'T00:00:00')).years);if(days<should)add('bad',`特休 ${days} 日少於依年資應有的 ${should} 日`,'依到職日週年制計算，可用「計算工具 → 特休天數」核對。',['LSA:38'])}}
  if(t.id==='ot-form'){const r=timeRanges(v.time);const h=r.reduce((s,[a,b])=>s+b-a,0);if(h>4)add('bad',`單日加班 ${h} 小時超過 4 小時`,'一天正常工時加加班最多 12 小時。',['LSA:32'])}
  if(t.id==='labor-meeting'&&!String(v.labor||'').trim()) add('warn','勞方代表還沒填','勞方代表要由全體員工選出，不能由老闆指定。',['LSA:83']);
  if(t.id==='warning'&&/扣|罰/.test(String(v.level||''))) add('bad','懲處等級含扣薪或罰款','懲處可以是警告、記過，但不能搭配扣薪罰款。',['LSA:22','LSA:26']);
  // 去除重複
  const seen=new Set(); return W.filter(w=>!seen.has(w.b)&&seen.add(w.b)).sort((a,b)=>(a.lv==='bad'?0:1)-(b.lv==='bad'?0:1));
}
function warnDialog(W,proceed){
  let d=document.getElementById('dlg'); if(d) d.remove();
  d=document.createElement('dialog'); d.id='dlg'; d.setAttribute('aria-labelledby','dlgh');
  const nb=W.filter(w=>w.lv==='bad').length;
  d.innerHTML=`<div class="dh" id="dlgh">產出前提醒：${nb?`有 ${nb} 項可能違法`:'有幾項要注意'}</div><div class="db"><ul class="wl">${W.map(w=>`<li class="${w.lv}"><b>${w.lv==='bad'?'可能違法：':'注意：'}${esc(w.b)}</b>${esc(w.d)}${chips(w.law)}</li>`).join('')}</ul><p class="note">建議回去修改。仍要產出時，請自行確認內容並保留紀錄。</p></div><div class="df"><button id="dlgGo">我了解，仍要產出</button><button class="pri" id="dlgBack">回去修改</button></div>`;
  document.body.appendChild(d); bindChips(d);
  d.querySelector('#dlgBack').onclick=()=>d.close();
  d.querySelector('#dlgGo').onclick=()=>{d.close();proceed()};
  d.addEventListener('close',()=>d.remove());
  d.showModal(); d.querySelector('#dlgBack').focus();
}

  shell('qa',`<p class="sub">餐飲業最常踩的 ${C.qa.length} 個勞動法地雷：左邊是常見錯誤做法，下面是正確做法、依據條文和可用的範本與計算工具。</p>
<div class="card noprint"><label for="qq">搜尋問題</label><input id="qq" placeholder="例如：扣薪、試用期、兼職、特休、加班費" autocomplete="off">
<div class="chips" style="margin-top:8px"><a class="chip" href="#qa" style="${cur==='all'?'border-color:var(--accent);font-weight:700':''}">全部 ${C.qa.length}</a>${cs.map(([k,n])=>`<a class="chip" href="#qa/${k}" style="${cur===k?'border-color:var(--accent);font-weight:700':''}">${esc(n)} ${C.qa.filter(x=>x.c===k).length}</a>`).join('')}</div></div>
<div class="card" id="qal"></div>`);
  const calcN=Object.fromEntries(CALCS);

<div class="w"><b>常見錯誤：</b>${esc(x.wrong)}</div><div class="r"><b>正確做法：</b>${esc(x.a)}</div>
${chips(x.law)}<div class="chips">${(x.tpl||[]).map(id=>{const t=C.templates.find(z=>z.id===id);return t?`<a class="btn" href="#tpl/${id}">範本：${esc(t.name)}</a>`:''}).join('')}${x.calc?`<a class="btn" href="#calc/${x.calc}">${esc(calcN[x.calc]||'計算工具')}</a>`:''}</div></details>`).join(''):'<p>找不到符合的問題。</p>';

const empPrem=e=>{const d=e.data||{};return C.ins.premiums(empWage(e),{pt:e.kind==='pt',dep:+d.dep||0,self:+d.self||0,senior:!!d.senior,nhiHere:d.nhiHere!==false,oi:co().oi?+co().oi/100:undefined})};

  if(no){const el=document.getElementById('a_'+no); if(el){el.scrollIntoView();el.style.background='var(--accent-soft)'}}
}

// ── 計算工具 ──
const CALCS=[['ins','勞健保與勞退'],['ot','加班費'],['sev','資遣費與預告期'],['al','特休天數'],['min','最低工資檢查'],['unused','未休特休工資']];
const MIN={2026:[29500,196],2027:[30900,205]};
function dd(s){const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function tenure(a,b){ // 回傳 {y,m,d,years}
  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
  if(d<0){m--; d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()} if(m<0){y--;m+=12}
  return {y,m,d,years:y+m/12+d/365};
}
const alDays=yrs=>yrs<0.5?0:yrs<1?3:yrs<2?7:yrs<3?10:yrs<5?14:yrs<10?15:Math.min(30,15+Math.floor(yrs)-9);
function viewCalc(k,eid){
  const f={
ot:`<div class="grid2"><div><label for="pt">薪資型態</label><select id="pt"><option value="m">月薪</option><option value="h">時薪</option></select></div><div><label for="w">月薪或時薪（正常工時工資，不含加班費）</label><input id="w" type="number" inputmode="numeric" value="31000"></div>
<div><label for="h1">平日超過 8 小時的時數</label><input id="h1" type="number" step="0.5" value="2"></div><div><label for="h2">休息日出勤時數</label><input id="h2" type="number" step="0.5" value="0"></div>
<div><label for="h3">國定假日／特休日出勤時數</label><input id="h3" type="number" step="0.5" value="0"></div></div>`,
sev:`<div class="grid2"><div><label for="s1">到職日（或適用勞退新制起日）</label><input id="s1" type="date" value="2023-03-01"></div><div><label for="s2">契約終止日</label><input id="s2" type="date"></div>
<div><label for="s3">平均工資（月）：終止前 6 個月工資總額 ÷ 6 的概算</label><input id="s3" type="number" inputmode="numeric" value="33000"></div></div><p class="note">平均工資正式算法是「前 6 個月工資總額 ÷ 該期間總日數 × 30」，病假、產假、職災醫療等期間不計入（施行細則第 2 條）。2005-07-01 前的舊制年資另依勞基法第 17 條計算，請洽顧問。</p>`,
al:`<div class="grid2"><div><label for="a1">到職日</label><input id="a1" type="date" value="2024-06-15"></div><div><label for="a2">計算到哪一天</label><input id="a2" type="date"></div></div>`,
min:`<div class="grid2"><div><label for="m0">年度</label><select id="m0"><option>2026</option><option>2027</option></select></div><div><label for="m1">薪資型態</label><select id="m1"><option value="m">月薪（全時）</option><option value="h">時薪</option></select></div>
<div><label for="m2">正常工時的工資（不含加班費、年終、三節獎金等非經常性給與）</label><input id="m2" type="number" inputmode="numeric" value="29000"></div></div>`,
ins:`<div class="grid2"><div><label for="i0">僱用型態</label><select id="i0"><option value="ft">正職（月薪）</option><option value="pt">兼職／工讀</option></select></div>
<div><label for="i1">每月薪資總額（本薪＋伙食、全勤等固定津貼；兼職填時薪 × 當月時數）</label><input id="i1" type="number" inputmode="numeric" value="31000"></div>
<div><label for="i2">健保眷屬人數（0–3）</label><input id="i2" type="number" min="0" max="3" value="0"></div><div><label for="i3">員工自提勞退 %（0–6）</label><input id="i3" type="number" min="0" max="6" value="0"></div>
<div><label for="i4">職災保險費率 %</label><input id="i4" type="number" step="0.01" value="${esc(co().oi||'0.19')}"></div></div>
<label style="display:flex;gap:8px;align-items:center"><input id="i5" type="checkbox" style="width:auto" checked>健保在本公司加保</label>
<label style="display:flex;gap:8px;align-items:center"><input id="i6" type="checkbox" style="width:auto">年滿 65 歲或已領勞保老年給付（只保職保）</label>`,
unused:`<div class="grid2"><div><label for="u1">月薪（年度終結或離職前最近一個月正常工時工資）</label><input id="u1" type="number" inputmode="numeric" value="33000"></div><div><label for="u2">未休特休天數</label><input id="u2" type="number" step="0.5" value="5"></div></div>`};
  shell('calc',`<div class="chips noprint">${CALCS.map(([x,n])=>`<a class="chip" href="#calc/${x}" style="${x===k?'border-color:var(--accent);font-weight:700':''}">${n}</a>`).join('')}</div>
<div class="card"><h2>${(CALCS.find(x=>x[0]===k)||CALCS[0])[1]}</h2>${EMPS.length?`<label for="ce">從員工名單帶入</label><select id="ce"><option value="">— 手動輸入 —</option>${EMPS.map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${esc(e.name)}（${e.kind==='pt'?'兼職':'正職'}）</option>`).join('')}</select>`:''}${f[k]||f.ins}<div id="cout" role="status" aria-live="polite"></div></div>`);
  const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  ['s2','a2'].forEach(i=>{const e=document.getElementById(i);if(e&&!e.value)e.value=today});
  const v=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const out=$("#cout");
  const calc={
    ot(){const hr=$('#pt').value==='m'?v('w')/240:v('w'); const h1=v('h1'),h2=v('h2'),h3=v('h3');
      const w1=Math.min(h1,2)*hr*4/3+Math.min(Math.max(h1-2,0),2)*hr*5/3;
      const w2=Math.min(h2,2)*hr*4/3+Math.min(Math.max(h2-2,0),10)*hr*5/3;
      const day=$('#pt').value==='m'?v('w')/30:hr*Math.min(h3,8); const w3=(h3>0?day:0)+Math.min(Math.max(h3-8,0),2)*hr*4/3+Math.min(Math.max(h3-10,0),2)*hr*5/3;
      out.innerHTML=`<div class="res"><div>平日每小時工資額</div><div>${hr.toFixed(2)} 元</div><div>平日加班 ${h1} 小時</div><div>${money(w1)} 元</div><div>休息日出勤 ${h2} 小時（另再加給）</div><div>${money(w2)} 元</div><div>國定假日／特休出勤 ${h3} 小時（加發）</div><div>${money(w3)} 元</div></div><p class="big">合計應另發 ${money(w1+w2+w3)} 元</p>
<p class="note">平日：前 2 小時 ×4/3、第 3–4 小時 ×5/3（一天連同正常工時最多 12 小時）。休息日：前 2 小時 ×4/3、第 3 小時起 ×5/3。國定假日：8 小時內加發一日工資${$('#pt').value==='h'?'（時薪制：出勤時數 × 時薪）':'（月薪 ÷ 30）'}，超過 8 小時依加班倍率。${h1>4?'<b>平日加班超過 4 小時，已超過一天 12 小時上限。</b>':''}</p>${chips(['LSA:24','LSA:39','LSA:32'])}`},
    sev(){const a=dd($('#s1').value),b=dd($('#s2').value); if(!a||!b||b<=a){out.innerHTML='<p>請填正確的日期。</p>';return}
      const t=tenure(a,b); const base=Math.min(6,t.years*0.5); const amt=base*v('s3'); const days=(b-a)/864e5;
      const notice=days<91?0:t.years<1?10:t.years<3?20:30;
      out.innerHTML=`<div class="res"><div>年資</div><div>${t.y} 年 ${t.m} 個月 ${t.d} 天</div><div>資遣費基數（新制，每年 0.5，最高 6）</div><div>${base.toFixed(3)} 個月</div><div>預告期間</div><div>${notice?notice+' 日':'未滿 3 個月，免預告'}</div><div>不預告要付的預告期工資（概算）</div><div>${money(v('s3')/30*notice)} 元</div></div><p class="big">資遣費約 ${money(amt)} 元</p><p class="note">終止後 30 日內發給；離職 10 日前做資遣通報。勞工依第 12 條被終止或自請離職，沒有資遣費。</p>${chips(['LPA:12','LSA:16','LSA:11','NOTE:資遣通報'])}`},
    al(){const a=dd($('#a1').value),b=dd($('#a2').value); if(!a||!b||b<a){out.innerHTML='<p>請填正確的日期。</p>';return}
      const t=tenure(a,b); const now=alDays(t.years);
      const rows=[[0.5,'滿 6 個月'],[1,'滿 1 年'],[2,'滿 2 年'],[3,'滿 3 年'],[4,'滿 4 年'],[5,'滿 5 年'],[10,'滿 10 年']].map(([y,l])=>{const d=new Date(a);d.setMonth(d.getMonth()+y*12);return `<tr><td>${l}</td><td>${d.toISOString().slice(0,10)}</td><td>${alDays(y)} 日</td></tr>`}).join('');
      out.innerHTML=`<p class="big">目前年資 ${t.y} 年 ${t.m} 個月：本年度特休 ${now} 日</p><p class="note">以「週年制」計算：每到下表日期取得新一年度的特休。雇主應在員工符合條件 30 日內告知排休。</p><div class="scroll"><table class="t"><tr><th>年資</th><th>取得日</th><th>該年度天數</th></tr>${rows}</table></div>${chips(['LSA:38','LSAER:24'])}`},
    min(){const [M,H]=MIN[$('#m0').value]; const isM=$('#m1').value==='m'; const w=v('m2'); const lim=isM?M:H; const ok=w>=lim;
      out.innerHTML=`<div class="verdict ${ok?'ok':'bad'}"><h2>${ok?'符合':'低於'} ${$('#m0').value} 年最低${isM?'月薪':'時薪'} ${money(lim)} 元</h2>${ok?'':`<p>每${isM?'月':'小時'}至少要補到 ${money(lim)} 元（差 ${money(lim-w)} 元）。</p>`}</div><p class="note">比較的是正常工時內的工資：伙食津貼、全勤獎金等經常性給與要算進去；加班費、年終、三節獎金不算。部分工時月薪可按工時比例計算（施行細則第 13 條）。</p>${chips(['NOTE:最低工資','LSAER:11','LSAER:10'])}`},
    ins(){const pt=$('#i0').value==='pt',w=v('i1');const I=C.ins;const p=I.premiums(w,{pt,dep:v('i2'),self:v('i3'),oi:v('i4')/100,nhiHere:$('#i5').checked,senior:$('#i6').checked});
      const [MM]=MIN[+todayTW().slice(0,4)>=2027?2027:2026];
      out.innerHTML=`${!pt&&w&&w<MM?`<div class="verdict bad"><h2>月薪低於最低工資 ${money(MM)} 元</h2><p>全時員工請先調到最低工資以上；兼職請把型態改成「兼職」。</p></div>`:''}
<div class="scroll"><table class="t"><tr><th>項目</th><th>投保級距</th><th>員工自付</th><th>雇主負擔</th></tr>
<tr><td>勞保＋就保（12.5%）</td><td>${p.grades.li?money(p.grades.li):'不加保'}</td><td>${money(p.emp.li)}</td><td>${money(p.er.li)}</td></tr>
<tr><td>職災保險（${v('i4')}%）</td><td>${money(p.grades.oi)}</td><td>0</td><td>${money(p.er.oi)}</td></tr>
<tr><td>工資墊償基金（0.025%）</td><td>—</td><td>0</td><td>${money(p.er.wage)}</td></tr>
<tr><td>健保（5.17%${v('i2')?`，含眷屬 ${Math.min(3,v('i2'))} 人`:''}）</td><td>${p.grades.nhi?money(p.grades.nhi):'不在本公司加保'}</td><td>${money(p.emp.nhi)}</td><td>${money(p.er.nhi)}</td></tr>
<tr><td>勞退提繳（雇主 6%）</td><td>${money(p.grades.lp)}</td><td>${p.emp.lpSelf?`自提 ${money(p.emp.lpSelf)}`:'0'}</td><td>${money(p.er.lp)}</td></tr>
<tr><th>合計</th><th></th><th>${money(p.empTotal+p.emp.lpSelf)}</th><th>${money(p.erTotal)}</th></tr></table></div>
<p class="big">雇主每月負擔 ${money(p.erTotal)} 元；員工薪水扣 ${money(p.empTotal+p.emp.lpSelf)} 元</p>
<p class="note">依 2026 年（115 年 1 月 1 日起）級距表與費率計算，四捨五入到元，實際以勞保局、健保署繳款單為準。${pt&&w<29500?'兼職薪資未達最低工資：勞保、職保可用 11,100、12,540 等較低級距；健保最低仍為 29,500。':''}${!$('#i5').checked?'不在本公司加保健保的兼職，單次薪資達最低工資以上要扣 2.11% 補充保費。':''}<br>來源：${I.INS_SOURCES.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('、')}（核對 ${I.INS_CHECKED}）</p>
${chips(['NOTE:投保薪資不得以多報少（高薪低報）','NOTE:健保加保與二代健保補充保費','LPA:14','LPA:6'])}`},
    unused(){const day=v('u1')/30; out.innerHTML=`<div class="res"><div>一日工資（月薪 ÷ 30）</div><div>${money(day)} 元</div></div><p class="big">應發 ${money(day*v('u2'))} 元</p><p class="note">年度終結：於約定發薪日或年度終結後 30 日內發給；離職：即結清。雙方可協商遞延一年。</p>${chips(['LSA:38','LSAER:24-1'])}`},
  };
  const run=()=>{(calc[k]||calc.ins)();bindChips(out)};
  const setV=(id,val)=>{const e=document.getElementById(id);if(e&&val!==undefined&&val!==null&&val!=='')e.value=val};
  const fillEmp=id=>{const e=EMPS.find(x=>x.id===id);if(!e)return;const d=e.data||{},w=empWage(e),pt=e.kind==='pt';
    setV('i0',e.kind);setV('i1',Math.round(w));setV('i2',d.dep||0);setV('i3',d.self||0);if($('#i5'))$('#i5').checked=d.nhiHere!==false;if($('#i6'))$('#i6').checked=!!d.senior;
    setV('pt',pt?'h':'m');setV('w',pt?d.rate:d.wage);setV('s1',d.start);setV('s3',Math.round(w));setV('a1',d.start);setV('m1',pt?'h':'m');setV('m2',pt?d.rate:d.wage);setV('u1',Math.round(w))};
  if($('#ce')) $('#ce').onchange=e=>{fillEmp(e.target.value);run()};
  if(eid) fillEmp(eid);
  $('#app').querySelectorAll('input,select').forEach(e=>{if(e.id!=='ce')e.oninput=e.onchange=run}); run();
}
