<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總部組織診斷｜品牌加辣餐飲顧問工作室</title>
<style>
:root{
  --bg:#f3f5f4; --panel:#ffffff; --line:#d9dfdc; --fg:#18211e; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f7f9f8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--mute);margin:0 0 12px}.note{color:var(--mute);font-size:13px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;color:inherit}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
button,a.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.sm{padding:3px 9px;font-size:13px}
button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.who{font-size:14px;color:var(--mute);text-align:right}
.msg{padding:9px 12px;border-radius:8px;background:var(--accent-soft);margin:10px 0}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--field);color:var(--mute);border-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.good b{color:var(--good)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:inherit;display:block}
.pl h3{margin:0 0 4px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0}
.tabs a{padding:7px 11px;text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;font-size:14px}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.c,th.c{text-align:center}
.bar{height:8px;border-radius:4px;background:var(--field);border:1px solid var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.gap3{color:var(--bad);font-weight:600}.gap2{color:var(--warn);font-weight:600}
/* 組織圖：桌機橫向樹，手機改縮排清單 */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{display:flex;justify-content:center;width:max-content;min-width:100%;padding:6px 0 10px}
.tree ul{display:flex;justify-content:center;padding-top:18px;position:relative}
.tree li{position:relative;padding:18px 6px 0;text-align:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:18px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before,.tree>li>ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:18px}
.tree>li{padding:0}.tree>li::before,.tree>li::after{display:none}
.node{display:inline-block;min-width:110px;max-width:170px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.4;cursor:pointer;text-align:center;color:inherit;font-family:inherit}
.node b{display:block;font-size:14px}.node .p{color:var(--mute)}.node .f{display:block;margin-top:3px;font-size:11px;color:var(--mute)}
.node.root{border-top-color:var(--warn)}.node.store{border-top-color:var(--mute)}.node.flag{border-color:var(--bad);border-top-color:var(--bad)}
@media (max-width:700px){
  .tree{display:block;width:auto}.tree ul{display:block;padding:0 0 0 18px}
  .tree li{padding:4px 0 0 0;text-align:left}.tree li::before{display:block;content:"";position:absolute;top:0;left:-10px;width:8px;height:22px;border:0;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0}
  .tree li::after,.tree ul ul::before,.tree>li>ul::before{display:none}.tree li:only-child::before{display:block}
  .tree>li::before{display:none}.node{max-width:none;width:100%;text-align:left}
}
.raci td.c{min-width:46px}.raci td:first-child,.rt td:first-child{min-width:150px}.rt td.c,.rt th.c{min-width:44px}.raci select{padding:3px 2px;min-width:44px;text-align:center}
.raci th.pos{white-space:normal;min-width:70px;font-size:12px}
.raci td.bad{background:var(--bad-bg)}
.chk{display:flex;align-items:flex-start;gap:4px;font-size:14px;margin:3px 0;color:var(--fg)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:2px 10px}
.kr{display:grid;grid-template-columns:2fr 1.2fr .8fr .7fr auto;gap:6px;margin:4px 0;align-items:center}
@media (max-width:560px){.who{text-align:left}.kr{grid-template-columns:1fr 1fr}.kr [data-k=n]{grid-column:1/-1}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);width:min(640px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
a{color:var(--accent)}
.saved{font-size:12px;color:var(--mute)}
ol.road li{margin:4px 0}
.report h2{font-size:20px;margin-top:22px}.report .node{cursor:default}
@media print{body{background:#fff;color:#000}.noprint,.tabs,.top,#flash{display:none!important}.card{border:0;padding:0;margin:0 0 10px}.wrap{padding:0;max-width:none}.report h2{break-after:avoid}table{break-inside:auto}tr{break-inside:avoid}.scroll{overflow:visible}}
</style>
</head>

/* ===== 分析 ===== */
function kids(org,id){return org.positions.filter(p=>p.parent===id)}
function root(org){return org.positions.find(p=>!p.parent||!org.positions.some(x=>x.id===p.parent))||org.positions[0]}
function depth(org,p){let d=0,x=p,seen=new Set();while(x&&x.parent&&!seen.has(x.id)){seen.add(x.id);x=org.positions.find(y=>y.id===x.parent);d++}return d}
function coverage(org,fk,ov){
  if(ov&&ov[fk]!=null&&ov[fk]!=='') return {v:+ov[fk],who:[],manual:true};
  const r=root(org), owners=org.positions.filter(p=>(p.funcs||[]).includes(fk));
  if(!owners.length) return {v:0,who:[]};
  const nonRoot=owners.filter(p=>p!==r);
  if(!nonRoot.length) return {v:1,who:owners};
  const ded=nonRoot.some(p=>(p.funcs||[]).length<=2&&!personDup(org,p));
  return {v:ded?3:2,who:owners};
}
function personDup(org,p){const n=(p.person||'').trim(); return !!n&&org.positions.filter(x=>(x.person||'').trim()===n).length>1}
function analyse(org,ov){
  const d=P(), s=stageOf(+cur.stores||0), fr=!!cur.franchise;
  const rows=FUNCS.map(f=>{const need=needOf(f,s,fr), c=coverage(org,f.k,ov); return {f,need,have:c.v,who:c.who,manual:c.manual,gap:Math.max(0,need-c.v)}}).filter(r=>r.need>0||r.have>0);
  const needSum=rows.reduce((a,r)=>a+r.need,0), got=rows.reduce((a,r)=>a+Math.min(r.have,r.need),0);
  const fScore=needSum?Math.round(got*100/needSum):100;
  const gq=GOV.filter(g=>g.s<=s), gScore=gq.length?Math.round(gq.reduce((a,g)=>a+(+d.gov[g.k]||0),0)*50/gq.length):100;
  const flags=[], r=root(org);
  const span=kids(org,r.id).length; if(span>7) flags.push(['bad',`${r.title}直接管 ${span} 個職位，超過 7 個就會變成什麼都要找老闆。建議中間加一層主管。`]);
  org.positions.forEach(p=>{const k=kids(org,p.id).filter(x=>!x.st).length; if(p!==r&&k>8) flags.push(['warn',`${p.title}直接管 ${k} 個職位，管理幅度過大。`])});
  const names={}; org.positions.forEach(p=>{const n=(p.person||'').trim(); if(n&&!p.st)(names[n]=names[n]||[]).push(p.title)});
  Object.entries(names).forEach(([n,t])=>{ if(t.length>1) flags.push(['warn',`${n} 一人身兼 ${t.length} 個職位（${t.join('、')}），容易兩頭落空，要訂優先順序或補人。`])});
  org.positions.forEach(p=>{ if((p.funcs||[]).length>=4) flags.push(['warn',`${p.title}一個人負責 ${p.funcs.length} 項職能（${p.funcs.map(k=>FX[k]?FX[k].n:k).join('、')}），負荷過重。`])});
  const rootF=(r.funcs||[]).filter(k=>FX[k]); if(s>=1&&rootF.length>=3) flags.push(['bad',`${r.title}自己還扛 ${rootF.length} 項日常職能，到 ${STAGES[s].n} 這個階段就是成長瓶頸。`]);
  const maxD=Math.max(0,...org.positions.map(p=>depth(org,p))); if(s<=1&&maxD>4) flags.push(['warn',`組織有 ${maxD+1} 層，對 ${STAGES[s].n} 太多層，溝通會變慢。`]);
  const orphans=org.positions.filter(p=>p.parent&&!org.positions.some(x=>x.id===p.parent)); if(orphans.length) flags.push(['warn',`有 ${orphans.length} 個職位沒有接到上層。`]);
  return {s,fr,rows,fScore,gScore,score:Math.round(fScore*.6+gScore*.4),flags,gaps:rows.filter(r=>r.gap>0).sort((a,b)=>b.gap-a.gap||b.need-a.need)};
}

  ${d.tobe?`<h2>三、建議組織</h2>${treeHtml(d.tobe,false)}${d.notes.tobe?`<p style="white-space:pre-wrap">${esc(d.notes.tobe)}</p>`:''}`:''}
  <h2>${d.tobe?'四':'三'}、部門職責</h2><table><thead><tr><th>職位</th><th>職責</th></tr></thead><tbody>${org.positions.filter(p=>!p.st&&((p.funcs||[]).length||p.extra)).map(p=>`<tr><td>${esc(p.title)}</td><td>${(p.funcs||[]).filter(k=>FX[k]).flatMap(k=>FX[k].du.filter((t,i)=>!d.dutyOff[p.id+'|'+k+'|'+i])).concat((p.extra||'').split('\n').map(s=>s.trim()).filter(Boolean)).map(esc).join('、')}</td></tr>`).join('')}</tbody></table>
  ${ck?`<h2>${d.tobe?'五':'四'}、權責分工（RACI）</h2><p class="note">${Object.entries(RACIN).map(([k,v])=>`${k}＝${v}`).join('；')}</p><div class="scroll"><table class="rt"><thead><tr><th>工作</th>${cols.map(p=>`<th class="c">${esc(p.title)}</th>`).join('')}</tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.n)}</td>${cols.map(p=>`<td class="c">${esc((d.raci[t.k]||{})[p.id]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
  <h2>${d.tobe?'六':'五'}、主管 KPI</h2>${org.positions.filter(p=>(p.kpis||[]).length).map(p=>`<h3>${esc(p.title)}</h3><table><thead><tr><th>指標</th><th>目標</th><th>頻率</th><th>權重</th></tr></thead><tbody>${p.kpis.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.t)}</td><td>${esc(x.f)}</td><td>${+x.w||0}%</td></tr>`).join('')}</tbody></table>`).join('')||'<p class="note">（尚未設定）</p>'}
  <h2>${d.tobe?'七':'六'}、90 天導入步驟</h2>${roadmap(a).map(([h,l])=>`<h3>${esc(h)}</h3><ol class="road">${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`).join('')}
  <p class="note" style="margin-top:20px">有任何問題歡迎 LINE：@084ayepb</p></div>`;
}
function repText(){
  const d=P(), a=analyse(d.asis,d.override), b=d.tobe?analyse(d.tobe,{}):null, org=d.tobe||d.asis;
  const L=[`【${clientName(cur)}｜總部組織與權責診斷】${today()}`,`目前 ${+cur.stores||0} 店・${STAGES[a.s].t}`,`現況總分 ${a.score}（職能 ${a.fScore}／制度 ${a.gScore}）${b?`，照建議組織調整後職能可到 ${b.fScore}`:''}`,''];
  if(a.flags.length){L.push('■ 主要問題'); a.flags.forEach((f,i)=>L.push(`${i+1}. ${f[1]}`)); L.push('')}
  if(a.gaps.length){L.push('■ 要補的職能'); a.gaps.forEach(r=>L.push(`・${r.f.n}：現在「${HAVE[r.have]}」，要做到「${HAVE[r.need]}」`)); L.push('')}
  if(d.tobe){L.push('■ 建議組織'); d.tobe.positions.forEach(p=>L.push(`${'　'.repeat(depth(d.tobe,p))}${p.title}${p.n>1?' ×'+p.n:''}${p.person?'（'+p.person+'）':''}`)); L.push('')}
  const kp=org.positions.filter(p=>(p.kpis||[]).length); if(kp.length){L.push('■ 主管 KPI'); kp.forEach(p=>L.push(`${p.title}：${p.kpis.map(x=>`${x.n} ${x.t}（${+x.w||0}%）`).join('、')}`)); L.push('')}
  L.push('■ 90 天導入'); roadmap(a).forEach(([h,l])=>{L.push(h); l.forEach(x=>L.push('・'+x))});
  return L.join('\n');
}
function tSet(){
  return `<div class="card" style="max-width:640px"><h2>客戶設定</h2>
  <label for="s_client">連結輔導客戶</label><select id="s_client"><option value="">（不連結）</option>${clients.map(c=>`<option value="${c.id}"${c.id===cur.client_id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <label for="s_name">名稱（沒連結時顯示）</label><input id="s_name" value="${esc(cur.client_name||'')}">
  <label for="s_title">這份規劃的標題</label><input id="s_title" value="${esc(cur.title||'')}" placeholder="總部組織診斷">
  <div class="g3"><div><label for="s_stores">目前門市數</label><input id="s_stores" type="number" min="1" value="${+cur.stores||1}"></div><div><label for="s_target">三年目標店數</label><input id="s_target" type="number" min="1" value="${cur.target_stores??''}"></div>
  <div><label for="s_fr">加盟</label><select id="s_fr"><option value="0">沒有</option><option value="1"${cur.franchise?' selected':''}>有／準備開放</option></select></div></div>
  <label for="s_biz">業態</label><input id="s_biz" value="${esc(cur.biz_type||'')}">
  <div class="row"><button class="pri" data-saveset>儲存設定</button><button data-delplan class="${armed==='plan'?'armed':''}">${armed==='plan'?'再按一次：刪除整份診斷':'刪除這份診斷'}</button></div></div>`;
}

/* ===== 依健檢、營運輔導、SOP 帶入管理制度題 ===== */
// 健檢 0 沒有／1 偶爾／2 大致有／3 完整 → 制度題 0 沒有／1 部分有／2 有
const GOVMAP={pl:['f1'],sop:['h1','h2'],bud:['f3'],qsc:['h4'],data:['i2','i3'],mtg:['i4']};
async function govFill(D){
  const c=clients.find(x=>x.id===cur.client_id)||{}; let lead=null, n=0;
  if(c.lead_id){ const r=await sbc.from('checkup_leads').select('answers').eq('id',c.lead_id).maybeSingle(); lead=r.data&&r.data.answers||null }
  const to=v=>v==null?null:v>=3?2:v>=1?1:0;
  if(lead) for(const [k,qs] of Object.entries(GOVMAP)){ if(D.gov[k]!=null&&D.gov[k]!=='') continue; const vs=qs.map(q=>lead[q]).filter(v=>v!=null).map(Number); if(!vs.length) continue; D.gov[k]=to(Math.min(...vs)); n++ }
  // 有 SOP 手冊且已交付 → SOP 至少「部分有」；有 QSC 稽核紀錄 → 稽核至少「部分有」
  try{ const s=await sbc.from('sop_manuals').select('id,status').eq('coach_client_id',cur.client_id); if(s.data&&s.data.length&&(D.gov.sop==null||D.gov.sop==='')){D.gov.sop=1;n++} }catch(_){}
  if(c.brand_id){ try{ const a=await sbc.from('qsc_audits').select('audit_id').eq('brand_id',c.brand_id).limit(1); if(a.data&&a.data.length&&(D.gov.qsc==null||D.gov.qsc==='')){D.gov.qsc=1;n++} }catch(_){} }
  return n;
}

/* ===== 存檔（樂觀鎖：rev 對不上就提醒，不蓋掉別的視窗的修改） ===== */
function touch(rerender){ dirty=true; saveState='尚未存檔…'; const s=$('#saved'); if(s) s.textContent=saveState; clearTimeout(saveT); saveT=setTimeout(saveNow,800); if(rerender){ const y=scrollY; render(); scrollTo(0,y) } }
async function saveNow(){
  if(!cur||!dirty) return; dirty=false; const pl=cur;
  const r=await sbc.from('org_plans').update({data:pl.data,rev:(pl.rev||1)+1,updated_at:new Date().toISOString()}).eq('id',pl.id).eq('rev',pl.rev||1).select();
  if(r.error){ dirty=true; saveState='存檔失敗'; say('存檔失敗：'+r.error.message+'。網路恢復後再改任何一格就會重存。',true) }
  else if(!r.data||!r.data.length){ saveState='有衝突'; try{localStorage.setItem('org_conflict_'+pl.id,JSON.stringify(pl.data))}catch(e){} say('這份診斷剛剛在另一個視窗被改過，為了不蓋掉，這次沒存。請重新整理；你這次的修改已暫存在這台電腦。',true) }
  else { pl.rev=r.data[0].rev; pl.updated_at=r.data[0].updated_at; saveState='已存檔 '+new Date().toTimeString().slice(0,5) }
  const s=$('#saved'); if(s) s.textContent=saveState;
}
window.addEventListener('beforeunload',e=>{ if(dirty){ saveNow(); e.preventDefault() } });
async function act(fn){ if(busy) return; busy=true; try{ await fn() }catch(e){ console.warn(e) } finally{ busy=false } }
const val=id=>{const e=document.getElementById(id); return e?e.value.trim():''};

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-out]'); if(!b) return; const d=b.dataset;
  if(d.out!==undefined) return act(async()=>{await sbc.auth.signOut(); location.href=PORTAL});
  if(d.create!==undefined) return act(async()=>{
    const cid=+val('n_client')||null, c=clients.find(x=>x.id===cid), name=val('n_name');
    if(!cid&&!name) return say('請選輔導客戶或輸入公司名稱。',true);
    const stores=+val('n_stores')||(c&&c.stores)||1;
    const o={client_id:cid,client_name:name||(c&&c.name)||null,stores,target_stores:+val('n_target')||null,franchise:val('n_fr')==='1',biz_type:val('n_biz')||(c&&c.biz_type)||null,title:'總部組織診斷',rev:1,data:{asis:blank(),gov:{},override:{},raci:{},notes:{},dutyOff:{}}};
    const r=await q(sbc.from('org_plans').insert(o).select().single(),'建立'); plans.unshift(r); say('已建立。先在「現況組織」照業主口述畫出實際的管理關係。'); go('p='+r.id+'&t=asis')});
  if(!cur) return;
  const D=P();
  if(d.edit) return posDialog(route().t==='tobe'?'tobe':route().t==='asis'?'asis':(D.tobe?'tobe':'asis'),d.edit);
  if(d.goedit){ location.hash='p='+cur.id+'&t='+(D.tobe?'tobe':'asis'); setTimeout(()=>posDialog(D.tobe?'tobe':'asis',d.goedit),50); return }
  if(d.addpos) return posDialog(d.addpos,null);
  if(d.close!==undefined){ armed=null; return $('#dlg').close() }
  if(d.savepos){ const [w,id]=d.savepos.split('|'), org=D[w]; const title=val('d_title'); if(!title){ $('#d_title').focus(); return }
    let p=org.positions.find(x=>x.id===id); if(!p){ p={id:uid(),kpis:[]}; org.positions.push(p) }
    let parent=val('d_parent')||null; let x=parent, guard=0; while(x&&guard++<99){ if(x===p.id){ parent=p.parent||null; say('不能把職位接到自己底下，已保留原本的上層。',true); break } x=(org.positions.find(y=>y.id===x)||{}).parent }
    if(!parent&&org.positions.some(y=>y!==p&&!y.parent)){ parent=root(org)!==p?root(org).id:null }
    Object.assign(p,{title,person:val('d_person'),parent,n:Math.max(1,+val('d_n')||1),st:$('#d_st').checked,extra:$('#d_extra').value,funcs:[...document.querySelectorAll('[data-df]:checked')].map(c=>c.dataset.df)});
    armed=null; $('#dlg').close(); touch(true); return }
  if(d.delpos){ const [w,id]=d.delpos.split('|'); if(armed!=='del'+id){ armed='del'+id; return posDialog(w,id) }
    const org=D[w], p=org.positions.find(x=>x.id===id); org.positions.forEach(x=>{ if(x.parent===id) x.parent=p.parent }); org.positions=org.positions.filter(x=>x.id!==id); armed=null; $('#dlg').close(); touch(true); return }
  if(d.tpl!=null){ D.tobe={positions:tpl(+d.tpl,!!cur.franchise)}; D.tobe.positions.forEach(p=>p.kpis=suggestKpi(p,D.tobe)); D.raci={}; autoRaci(); say('已套用範本，並自動帶入 RACI 和 KPI 建議。點職位填上人名或調整。'); return touch(true) }
  if(d.govfill!==undefined) return act(async()=>{ const n=await govFill(D); if(n) touch(true); say(n?`已帶入 ${n} 題（依健檢答案與輔導資料），請跟業主確認後再改。`:'沒有可以帶入的題目（健檢沒答到，或這幾題已經答過）。',!n) });
  if(d.copyasis!==undefined){ D.tobe=JSON.parse(JSON.stringify(D.asis)); D.raci={}; return touch(true) }
  if(d.resetTobe!==undefined){ if(armed!=='tobe'){ armed='tobe'; return render() } armed=null; D.tobe=null; D.raci={}; return touch(true) }
  if(d.autoraci!==undefined){ if(armed!=='raci'){ armed='raci'; return render() } armed=null; autoRaci(); return touch(true) }
  if(d.kadd){ const p=(D.tobe||D.asis).positions.find(x=>x.id===d.kadd); (p.kpis=p.kpis||[]).push({n:'',t:'',f:'月',w:0}); return touch(true) }
  if(d.kdel){ const [id,i]=d.kdel.split('|'); const p=(D.tobe||D.asis).positions.find(x=>x.id===id); p.kpis.splice(+i,1); return touch(true) }
  if(d.ksug){ const org=D.tobe||D.asis, p=org.positions.find(x=>x.id===d.ksug); p.kpis=suggestKpi(p,org); if(!p.kpis.length) say('這個職位還沒指定負責職能，先到組織圖勾選職能再帶入。',true); return touch(true) }
  if(d.print!==undefined) return window.print();
  if(d.copyrep!==undefined){ const t=repText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>say('已複製，可以直接貼到 LINE 或 Email。'),()=>{ $('#dlg').innerHTML=`<h2>複製這段文字</h2><textarea style="min-height:50vh">${esc(t)}</textarea><div class="row"><button data-close>關閉</button></div>`; $('#dlg').showModal() }); return }
  if(d.saveset!==undefined) return act(async()=>{ const o={client_id:+val('s_client')||null,client_name:val('s_name')||null,title:val('s_title')||null,stores:Math.max(1,+val('s_stores')||1),target_stores:+val('s_target')||null,franchise:val('s_fr')==='1',biz_type:val('s_biz')||null,updated_at:new Date().toISOString()};
    if(!o.client_id&&!o.client_name) return say('請選輔導客戶或輸入名稱。',true);
    await q(sbc.from('org_plans').update(o).eq('id',cur.id)); Object.assign(cur,o); say('已儲存設定，階段與缺口已重新計算。'); render() });
  if(d.delplan!==undefined){ if(armed!=='plan'){ armed='plan'; return render() } return act(async()=>{ await q(sbc.from('org_plans').delete().eq('id',cur.id),'刪除'); plans=plans.filter(x=>x.id!==cur.id); armed=null; say('已刪除。'); go('') }) }
});
document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset; if(!cur) return; const D=P();
  if(d.ov){ if(t.value==='') delete D.override[d.ov]; else D.override[d.ov]=+t.value; return touch(true) }
  if(d.gov){ if(t.value==='') delete D.gov[d.gov]; else D.gov[d.gov]=+t.value; return touch(true) }
  if(d.raci){ const [k,id]=d.raci.split('|'); const m=D.raci[k]=D.raci[k]||{}; if(t.value) m[id]=t.value; else delete m[id]; return touch(true) }
  if(d.duty){ if(t.checked) delete D.dutyOff[d.duty]; else D.dutyOff[d.duty]=1; return touch(false) }
  if(d.kpi){ const [id,i,f]=d.kpi.split('|'); const p=(D.tobe||D.asis).positions.find(x=>x.id===id); p.kpis[+i][f]=f==='w'?(+t.value||0):t.value; return touch(f==='w') }
});
document.addEventListener('input',e=>{ const d=e.target.dataset; if(cur&&d.note){ P().notes[d.note]=e.target.value; touch(false) } });
$('#dlg').addEventListener('close',()=>{ if(armed&&String(armed).startsWith('del')) armed=null });
sbc.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'||ev==='SIGNED_IN') load() });
load();
</script>
