/* ================= 計算 ================= */
function readiness(p){
  const r=P(p).ready; let tot=0,max=0,answered=0; const dims=[], gaps=[], fatal=[];
  for(const g of READY){let s=0,m=0; for(const [k0,t] of g.q){const k=k0.replace('!',''); const v=r[k]; m+=2; if(v!=null){answered++; s+=v; if(v<2) gaps.push({k,t,v,crit:k0.endsWith('!')}); if(v===0&&k0.endsWith('!')) fatal.push(t)}}
    dims.push({t:g.t,s,m,pct:Math.round(s*100/m)}); tot+=s; max+=m}
  const all=READY.reduce((a,g)=>a+g.q.length,0), pct=Math.round(tot*100/max);
  let lv,verdict,rec;
  if(answered<all){lv='mute';verdict=`還有 ${all-answered} 題沒回答`;rec=null}
  else if(fatal.length){lv='bad';verdict='先不要開放加盟';rec='直營'}
  else if(pct>=75){lv='good';verdict='可以開放加盟';rec='一般加盟'}
  else if(pct>=50){lv='warn';verdict='先補強，可試行 1–2 家';rec='委託加盟'}
  else{lv='bad';verdict='先把直營做穩';rec='直營'}
  gaps.sort((a,b)=>(b.crit-a.crit)||(a.v-b.v));
  return {pct,dims,gaps,fatal,lv,verdict,rec,answered,all};
}
function calc(c,mult=1){
  const rev=c.rev*mult, pct=x=>(+x||0)/100;
  const royalty=c.royMode==='fixed'?(+c.royFix||0):rev*pct(c.royPct), mkt=rev*pct(c.mkt);
  const food=rev*pct(c.food), labor=rev*pct(c.labor), util=rev*pct(c.util);
  const net=rev-food-labor-util-(+c.rent||0)-(+c.otherFix||0)-royalty-mkt;
  const invest=(+c.fee||0)+(+c.train||0)+(+c.build||0)+(+c.other||0);
  const payback=net>0?invest/net:null;
  const supply=food*pct(c.supplyShare)*pct(c.supplyMargin);
  const hqGross=royalty+supply, hqMonth=hqGross-(+c.supCost||0);
  const hqOnce=(+c.fee||0)+(+c.train||0)+(+c.build||0)*pct(c.buildMargin)-(+c.openCost||0);
  const take=(hqGross+Math.max(net,0))>0?hqGross*100/(hqGross+Math.max(net,0)):null;
  const be=(()=>{const v=1-pct(c.food)-pct(c.labor)-pct(c.util)-pct(c.mkt)-(c.royMode==='fixed'?0:pct(c.royPct)); const f=(+c.rent||0)+(+c.otherFix||0)+(c.royMode==='fixed'?(+c.royFix||0):0); return v>0?f/v:null})();
  return {rev,royalty,mkt,food,labor,util,net,netPct:rev?net*100/rev:null,invest,deposit:+c.deposit||0,payback,supply,hqGross,hqMonth,hqOnce,take,be};
}
function rollout(c){
  const r=calc(c), ys=[+c.y1||0,+c.y2||0,+c.y3||0]; let open=0, cum=0; const out=[];
  ys.forEach((n,i)=>{const inc=n*r.hqOnce+(open*12+n*6)*r.hqMonth; cum+=inc; open+=n; out.push({y:i+1,n,open,inc,cum})});
  return out;
}

function storeHealth(s){
  const p=D.plans.find(x=>x.id===s.plan_id), every=p?+P(p).model.visitDays||30:30, t=today(), why=[]; let lv='good';
  if(s.status==='解約／結束') return {lv:'mute',why:['已結束'],last:null,qsc:null,owe:0};
  if(s.status==='籌備中') return {lv:'mute',why:['籌備中'],last:null,qsc:null,owe:0};
  const vs=D.visits.filter(v=>v.store_id===s.id), last=vs.length?vs.map(v=>v.visit_on).sort().pop():null;
  const since=last?daysBetween(last,t):(s.open_on?daysBetween(s.open_on,t):null);
  if(since!=null&&since>every){why.push(`${since} 天沒督導`); lv='warn'; if(since>every*2) lv='bad'}
  const open=vs.filter(v=>!v.closed&&v.due_on&&v.due_on<t); if(open.length){why.push(`${open.length} 項改善逾期`); lv='bad'}
  const ds=D.dues.filter(d=>d.store_id===s.id&&ym(d.month)<thisMonth());
  const owe=ds.reduce((a,d)=>a+Math.max(0,(+d.royalty||0)+(+d.mkt||0)-(+d.paid||0)),0);
  if(owe>0){why.push(`權利金未繳 ${money(owe)}`); lv='bad'}
  const lastM=ds.length?ds.map(d=>ym(d.month)).sort().pop():null, prev=new Date(Date.parse(thisMonth()+'-01T00:00:00Z')-864e5).toISOString().slice(0,7);
  if(s.open_on&&ym(s.open_on)<prev&&lastM!==prev){why.push(`${prev} 營業額未回報`); if(lv==='good') lv='warn'}
  let qsc=null; const vq=vs.filter(v=>v.qsc!=null).sort((a,b)=>a.visit_on<b.visit_on?1:-1)[0];
  const aq=s.brand_id?D.qsc.filter(a=>a.brand_id===s.brand_id&&(!a.store||a.store===s.name)).sort((a,b)=>a.audit_date<b.audit_date?1:-1)[0]:null;
  if(vq&&(!aq||vq.visit_on>=aq.audit_date)) qsc={v:vq.qsc,on:vq.visit_on,src:'督導紀錄'}; else if(aq) qsc={v:aq.score,on:aq.audit_date,src:'門市稽核'};
  if(qsc&&qsc.v<70){why.push(`QSC ${qsc.v} 分`); lv='bad'} else if(qsc&&qsc.v<80){why.push(`QSC ${qsc.v} 分`); if(lv==='good') lv='warn'}
  if(s.contract_end){const left=daysBetween(t,s.contract_end); if(left<0){why.push('合約已到期'); lv='bad'} else if(left<=90){why.push(`合約 ${left} 天後到期`); if(lv==='good') lv='warn'}}
  return {lv,why,last,qsc,owe};
}

   <div><label for="s_rmode">權利金方式</label><select id="s_rmode"><option value="pct"${s.royalty_mode==='pct'?' selected':''}>抽營業額 %</option><option value="fixed"${s.royalty_mode==='fixed'?' selected':''}>每月固定金額</option></select></div>
   <div><label for="s_rval">權利金（% 或 元）</label><input id="s_rval" type="number" step="any" value="${esc(s.royalty_value)}"></div>
   <div><label for="s_mkt">行銷基金 %</label><input id="s_mkt" type="number" step="any" value="${esc(s.mkt_pct)}"></div>
   <div><label for="s_brand">BOM 品牌（讀稽核分數）</label><select id="s_brand"><option value="">（不連結）</option>${D.brands.map(b=>`<option value="${esc(b.id)}"${b.id===s.brand_id?' selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
  </div><label for="s_note">備註</label><textarea id="s_note">${esc(s.note)}</textarea>
  <div class="row"><button class="pri" data-savestore="${s.id}">儲存</button><button class="${armed==='s'+s.id?'armed':''}" data-dels="${s.id}">${armed==='s'+s.id?'再按一次確定刪除':'刪除門市'}</button></div></div>`;
}

/* ================= 事件 ================= */
const val=id=>($('#'+id)||{}).value??'';
async function act(fn){ if(busy) return; busy=true; try{ await fn() }catch(e){ console.warn(e) } finally{ busy=false } }
function curPlan(){return D.plans.find(x=>x.id===route().p)}
function queueSave(p){
  clearTimeout(saveT); const s=$('#saved'); if(s) s.textContent='儲存中…';
  saveT=setTimeout(()=>act(async()=>{const at=new Date().toISOString(); await q(sbc.from('fr_plans').update({data:p.data,updated_at:at}).eq('id',p.id),'自動儲存'); p.updated_at=at; const s=$('#saved'); if(s) s.textContent='已自動儲存'}),600);
}
function setK(p,path,el){const [a,b]=path.split('.'); const d=P(p); d[a][b]=el.type==='number'?num(el.value):el.value}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-k]'); if(!el||el.type==='radio'||el.tagName==='SELECT') return;
  const p=curPlan(); if(!p) return; setK(p,el.dataset.k,el); if(el.dataset.k.startsWith('calc.')) drawCalc(); queueSave(p);
});
document.addEventListener('change',e=>{
  const p=curPlan(), el=e.target;
  if(p&&el.dataset.ready){P(p).ready[el.dataset.ready]=+el.value; queueSave(p); render(); return}
  if(p&&el.closest('[data-k]')&&(el.type==='radio'||el.tagName==='SELECT')){setK(p,el.dataset.k,el); queueSave(p); render(); return}
  if(p&&el.dataset.ck){const c=P(p).contract; c[el.dataset.ck]={...(c[el.dataset.ck]||{}),st:el.value}; queueSave(p); render(); return}
  if(p&&el.hasAttribute('data-cknote')){const c=P(p).contract, k=el.dataset.cknote; c[k]={...(c[k]||{}),note:el.value}; queueSave(p); return}
  if(el.id==='f_coach'){const c=D.coach.find(x=>x.id===+el.value); if(c){if(!val('f_name').trim()) $('#f_name').value=c.name; if(c.brand_id&&$('#f_brand')) $('#f_brand').value=c.brand_id;
    if(c.pl_client&&$('#f_pl')){const v=c.pl_client+'｜'+(c.pl_brand||''); if([...$('#f_pl').options].some(o=>o.value===v)) $('#f_pl').value=v}}}
  if(el.id==='f_brand'){const b=D.brands.find(x=>x.id===el.value); if(b&&!val('f_name').trim()) $('#f_name').value=b.name}
});
function dueFor(s,sales){const r=s.royalty_mode==='fixed'?(+s.royalty_value||0):(sales||0)*(+s.royalty_value||0)/100; return {royalty:Math.round(r),mkt:Math.round((sales||0)*(+s.mkt_pct||0)/100)}}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if('out' in d){await sbc.auth.signOut(); location.href=PORTAL; return}
  if('print' in d){window.print(); return}
  if(d.copydoc){const p=D.plans.find(x=>x.id===+d.copydoc); const t=`${p.name} 加盟重要資訊揭露書（草稿）\n\n`+discLines(p).map(([h,ls])=>h+'\n'+ls.map(l=>'・'+l).join('\n')).join('\n\n');
    try{await navigator.clipboard.writeText(t); say('已複製揭露書文字，可以貼到 Word 或 Google 文件再修。')}catch(_){say('瀏覽器不讓複製，請改用「列印／存成 PDF」。',true)} return}
  if(d.saveplan) return act(async()=>{const o=readLink(); if(!o) return; o.updated_at=new Date().toISOString();
    if(d.saveplan==='new'){o.data={}; const r=await q(sbc.from('fr_plans').insert(o).select().single(),'建立'); r.data=r.data||{}; D.plans.push(r); say('已建立。先和業主一起做準備度健檢。'); go('p='+r.id)}
    else{const id=+d.saveplan; await q(sbc.from('fr_plans').update(o).eq('id',id)); Object.assign(D.plans.find(x=>x.id===id),o); say('已儲存設定。'); render()}});
  if(d.plfill) return act(async()=>{const p=D.plans.find(x=>x.id===+d.plfill);
    const r=await sbc.rpc('coach_pl_months',{p_client:p.pl_client,p_brand:p.pl_brand||''});
    if(r.error){say('讀不到損益中心（營運輔導系統的資料庫功能可能還沒安裝）：'+r.error.message,true);return}
    const rows=(r.data||[]).filter(x=>x.revenue>0).slice(-3); if(!rows.length){say('損益中心還沒有這位客戶的資料。',true);return}
    const avg=k=>rows.map(x=>+x[k]).filter(x=>isFinite(x)&&x!==null).reduce((a,b,i,arr)=>a+b/arr.length,0);
    const c=P(p).calc, rev=Math.round(avg('revenue')); c.rev=rev; c.food=+avg('food_pct').toFixed(1); c.labor=+avg('labor_pct').toFixed(1); c.rent=Math.round(rev*avg('rent_pct')/100);
    queueSave(p); say(`已帶入 ${rows.length} 個月平均：月營收 ${money(rev)}、食材 ${c.food}%、人事 ${c.labor}%、租金 ${money(c.rent)}。`); render()});
  if(d.addstore) return act(async()=>{const p=D.plans.find(x=>x.id===+d.addstore), name=val('n_name').trim(); if(!name){say('請填門市名稱。',true);return}
    const c=P(p).calc, m=P(p).model, open=val('n_open')||null;
    const o={plan_id:p.id,name,kind:val('n_kind'),owner_name:val('n_owner')||null,open_on:open,status:open&&open>today()?'籌備中':'營運中',
      royalty_mode:c.royMode,royalty_value:c.royMode==='fixed'?c.royFix:c.royPct,mkt_pct:c.mkt,brand_id:p.brand_id||null,
      contract_end:open&&m.years?addDays(open,Math.round(+m.years*365.25)-1):null};
    if(o.kind==='直營'){o.royalty_value=0;o.mkt_pct=0}
    const r=await q(sbc.from('fr_stores').insert(o).select().single(),'新增門市'); D.stores.push(r); say('已新增門市。'); render()});
  if(d.savestore) return act(async()=>{const id=+d.savestore, name=val('s_name').trim(); if(!name){say('請填門市名稱。',true);return}
    const o={name,kind:val('s_kind'),status:val('s_status'),owner_name:val('s_owner')||null,phone:val('s_phone')||null,line_id:val('s_line')||null,address:val('s_addr')||null,
      open_on:val('s_open')||null,contract_end:val('s_end')||null,royalty_mode:val('s_rmode'),royalty_value:num(val('s_rval')),mkt_pct:num(val('s_mkt')),brand_id:val('s_brand')||null,note:val('s_note')||null,updated_at:new Date().toISOString()};
    await q(sbc.from('fr_stores').update(o).eq('id',id)); Object.assign(D.stores.find(x=>x.id===id),o); say('已儲存門市資料。'); render()});
  if(d.savedue) return act(async()=>{const s=D.stores.find(x=>x.id===+d.savedue), m=val('d_month'); if(!/^\d{4}-\d{2}$/.test(m)){say('請選月份。',true);return}
    const sales=num(val('d_sales')), old=D.dues.find(x=>x.store_id===s.id&&ym(x.month)===m);
    const o={store_id:s.id,month:m+'-01',updated_at:new Date().toISOString()};
    if(sales!=null){o.sales=sales; Object.assign(o,dueFor(s,sales))} else if(!old){if(s.royalty_mode==='fixed') Object.assign(o,dueFor(s,0)); else{say('請填營業額。',true);return}}
    if(val('d_paid')!=='') o.paid=num(val('d_paid')); if(val('d_on')) o.paid_on=val('d_on');
    const r=await q(sbc.from('fr_dues').upsert(o,{onConflict:'store_id,month'}).select().single());
    D.dues=D.dues.filter(x=>x.id!==r.id).concat([r]); say(`已儲存 ${m}：應繳 ${money((+r.royalty||0)+(+r.mkt||0))}。`); render()});
  if(d.editdue){const r=D.dues.find(x=>x.id===+d.editdue); if(!r) return; $('#d_month').value=ym(r.month); $('#d_sales').value=r.sales??''; $('#d_paid').value=r.paid??''; $('#d_on').value=r.paid_on||''; $('#d_month').scrollIntoView({block:'center'}); return}
  if(d.savevisit) return act(async()=>{const sid=+d.savevisit, qs=num(val('v_qsc'));
    if(qs!=null&&(qs<0||qs>100)){say('QSC 分數請填 0 到 100。',true);return}
    const o={store_id:sid,visit_on:val('v_on')||today(),kind:val('v_kind'),qsc:qs,findings:val('v_find')||null,actions:val('v_act')||null,due_on:val('v_due')||null};
    if(!o.findings&&!o.actions&&o.qsc==null){say('請至少填分數或寫一點紀錄。',true);return}
    const r=await q(sbc.from('fr_visits').insert(o).select().single()); D.visits.unshift(r); say('已儲存督導紀錄。'); render()});
  if(d.closev) return act(async()=>{const id=+d.closev; await q(sbc.from('fr_visits').update({closed:true}).eq('id',id)); D.visits.find(x=>x.id===id).closed=true; say('已標記改善完成。'); render()});
  for(const [key,tb,pre,arr] of [['delv','fr_visits','v','visits'],['dels','fr_stores','s','stores'],['delp','fr_plans','p','plans']]) if(d[key]){
    const id=+d[key]; if(armed!==pre+id){armed=pre+id; render(); setTimeout(()=>{if(armed===pre+id){armed=null;render()}},4000); return}
    armed=null; return act(async()=>{await q(sbc.from(tb).delete().eq('id',id),'刪除'); D[arr]=D[arr].filter(x=>x.id!==id);
      if(pre==='s'){const s=id; D.visits=D.visits.filter(x=>x.store_id!==s); D.dues=D.dues.filter(x=>x.store_id!==s); say('已刪除門市。'); history.back()}
      else if(pre==='p'){const gone=new Set(D.stores.filter(x=>x.plan_id===id).map(x=>x.id)); D.stores=D.stores.filter(x=>x.plan_id!==id); D.visits=D.visits.filter(x=>!gone.has(x.store_id)); D.dues=D.dues.filter(x=>!gone.has(x.store_id)); say('已刪除加盟方案。'); go('')}
      else{say('已刪除。'); render()}});
  }
});
window.addEventListener('hashchange',()=>{armed=null; say(flash&&!flashBad?flash:''); flash=''; render(); scrollTo(0,0)});
sbc.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
load();
</script>
</body>
</html>
