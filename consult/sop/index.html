<!doctype html>
<html lang="zh-Hant">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOP 手冊與督導稽核｜品牌加辣餐飲顧問工作室</title>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--mute);margin:0 0 12px}.note{color:var(--mute);font-size:13px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;color:inherit}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
button,a.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.sm{padding:3px 9px;font-size:13px}
button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.who{font-size:14px;color:var(--mute);text-align:right}
.msg{padding:9px 12px;border-radius:8px;background:var(--accent-soft);margin:10px 0}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--field);color:var(--mute);border-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.stat.alert b{color:var(--bad)}
.clients{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cl{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-decoration:none;color:inherit;display:block}
.cl.red{border-left-color:var(--bad)}.cl.yellow{border-left-color:var(--warn)}.cl.green{border-left-color:var(--good)}
.cl h3{margin:0 0 4px}.cl ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0}
.tabs a{padding:7px 12px;text-decoration:none;color:var(--mute);border-bottom:3px solid transparent}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media (max-width:640px){.g2{grid-template-columns:1fr}}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
.item .meta{font-size:13px;color:var(--mute)}
.goal{display:grid;grid-template-columns:1fr 110px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal svg{width:110px;height:30px}
.gl{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:6px;margin:4px 0}
.al{display:grid;grid-template-columns:2fr .8fr 1fr auto;gap:6px;margin:4px 0}

a{color:var(--accent)}
.pre{white-space:pre-wrap}
.report h2{font-size:20px}.report table{margin:6px 0 10px}
@media print{body{background:#fff;color:#000}.noprint,.tabs,.top,#flash{display:none!important}.card{border:0;padding:0}.wrap{padding:0}}
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0}
.sec>header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.sec>header input{flex:1;min-width:160px;font-weight:600}
.sec>header .when{flex:0 1 180px;min-width:120px;font-weight:400}
.sec>header select{width:auto}
.st{display:grid;grid-template-columns:28px 1.6fr 1.3fr 96px 76px auto;gap:6px;align-items:start;padding:8px 12px;border-top:1px solid var(--line)}
.st:first-of-type{border-top:0}
.st .no{color:var(--mute);padding-top:8px;text-align:right}
.st textarea{min-height:40px}
.st .aud{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute);padding-top:8px;margin:0}
.st .ops{display:flex;gap:4px;flex-wrap:wrap}
.st .flags{display:flex;flex-direction:column}.st .flags .aud{padding-top:4px}
.st .why{grid-column:2/-1;font-size:12px;color:var(--accent);margin-top:-2px}
.st.flashrow{background:var(--warn-bg);transition:background .3s}
.pf{display:grid;gap:10px;margin:6px 0}.pfq b{display:block;font-size:14px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex!important;align-items:center;gap:5px;margin:0!important;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--panel);color:var(--fg)!important;font-size:14px!important;cursor:pointer}
.chip input{width:auto;margin:0}.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.types label.sug{border-style:dashed}
.g2.noprint{align-items:start}
.plist{margin:4px 0 8px;padding-left:18px;font-size:14px}
details summary{cursor:pointer;color:var(--accent);margin:6px 0}
.issues{margin:6px 0 0;padding-left:18px;font-size:14px}.issues li.bad{color:var(--bad)}.issues li.warn{color:var(--warn)}
.linkb{border:0;background:none;padding:0;color:inherit;text-align:left;text-decoration:underline;cursor:pointer}
.doc.form table.ck td,.doc.form table.ck th{font-size:13px}
table.ck td.d,table.ck th.d{width:34px;text-align:center;border-left:1px solid var(--line)}
table.ck th.d2{width:90px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.types label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--fg);font-size:14px;margin:0;cursor:pointer}
.types input{width:auto;margin-top:4px}
.types label.on{border-color:var(--accent);background:var(--accent-soft)}
.doc h1{font-size:26px}.doc h2{font-size:19px;margin-top:22px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.doc table td{white-space:normal}.doc .cover{text-align:center;padding:40px 0 30px;border-bottom:1px solid var(--line);margin-bottom:16px}
.spark{width:110px;height:30px}
@media (max-width:640px){.sticky{position:static}.st{grid-template-columns:24px 1fr 1fr}.st textarea[data-f=text],.st .std{grid-column:2/-1}.st .role{grid-column:2}.st .aud{grid-column:3}.st .ops{grid-column:1/-1;justify-content:flex-end}.st .flags{grid-column:3;flex-direction:row;gap:10px}}
@media print{.doc h2{break-after:avoid}.doc tr{break-inside:avoid}.doc .cover{break-after:page;padding-top:120px}}
</style>
</head>

/* 健檢低分題 → 痛點或改善步驟 */
const CKMAP={p1:'品質不一',p5:'食安疑慮',h2:'新人多、流動高',p3:'耗損高',p4:'耗損高',
 h4:['巡店稽核追到完成','每週至少 1 次門市自檢；缺失寫負責人與期限，逾期 0 件','店長',1],
 m3:['網路評價回覆','Google 與外送平台評論 48 小時內回覆；每週看 1 次評分','店長',0],
 i4:['交辦事項追蹤','交辦寫在交班紀錄並追到完成，不只靠 LINE 群組','店長',0],
 h3:['依營業額排班','依前 4 週同時段營業額排班，人事費率目標 ≤28%','店長',0]};
const mk=([text,std,role,a],why,rid)=>({id:uid(),text,std,role,audit:!!a,crit:!!a&&CRIT.test(text),why:why||'',rid:rid||''});
function painsOf(p){ const out=(p.pain||[]).map(x=>({x,why:'店況問卷：'+x}));
  (p.ck||[]).forEach(g=>{ const m=CKMAP[g.id]; if(typeof m==='string'&&!out.some(o=>o.x===m)) out.push({x:m,why:'健檢：'+g.text}) }); return out }
function ruleSteps(key,p){ const out=[];
  if(key==='focus'){ painsOf(p).forEach(o=>FOCUS[o.x]&&out.push(mk(FOCUS[o.x],o.why,'f:'+o.x)));
    (p.ck||[]).forEach(g=>{ const m=CKMAP[g.id]; if(Array.isArray(m)) out.push(mk(m,'健檢：'+g.text,'c:'+g.id)) }); return out }
  RULES.forEach((r,i)=>{ if(r.sec===key&&r.s&&r.if(p)) r.s.forEach((s,j)=>out.push(mk(s,r.why,'r'+i+'.'+j))) }); return out }
function extrasFor(p){ return EXTRA.filter(e=>e[4](p)) }
function applyMods(sec,p){ RULES.forEach(r=>{ if(r.sec!==sec.key||!r.if(p)) return;
  if(r.rm) sec.steps=sec.steps.filter(t=>!r.rm.includes(t.text));
  if(r.set) sec.steps.forEach(t=>{ if(r.set[t.text]){ t.std=r.set[t.text]; t.why=r.why } }) }) }
function addUnique(sec,steps){ steps.forEach(s=>{ if(!sec.steps.some(t=>t.rid===s.rid&&s.rid||t.text===s.text)) sec.steps.push(s) }) }
function build(type,keys,p){
  p=prof(p); const T=TYPES[type]||TYPES['通用'], add=T.add||{}, out=[];
  BASE.filter(s=>keys.includes(s[0])).forEach(([key,name,when,cat,steps])=>{ const sec={id:uid(),key,name,when,cat,steps:steps.map(s=>mk(s))};
    (add[key]||[]).forEach(s=>sec.steps.push(mk(s,type+'業態重點'))); applyMods(sec,p); addUnique(sec,ruleSteps(key,p)); out.push(sec) });
  extrasFor(p).filter(e=>keys.includes(e[0])).forEach(([key,name,when,cat])=>{ const sec={id:uid(),key,name,when,cat,steps:ruleSteps(key,p)}; if(sec.steps.length) out.push(sec) });
  return sortSecs(out);
}
const sortSecs=a=>a.slice().sort((x,y)=>{ const i=k=>{ const n=ORDER.indexOf(k); return n<0?ORDER.length-2:n }; return i(x.key)-i(y.key) });
/* 既有手冊依店況補上缺的建議步驟（不動已改過的內容） */
function suggest(m){ const p=prof(m.profile), add=[];
  (m.sections||[]).forEach(sec=>{ ruleSteps(sec.key,p).forEach(s=>{ if(!sec.steps.some(t=>(s.rid&&t.rid===s.rid)||t.text===s.text)) add.push({sec,s}) }) });
  extrasFor(p).forEach(([key,name,when,cat])=>{ if(!(m.sections||[]).some(s=>s.key===key)){ const steps=ruleSteps(key,p); if(steps.length) add.push({newSec:{id:uid(),key,name,when,cat,steps:[]},steps}) } });
  return add }
/* BOM 配方 → 出餐標準卡 */
function recipeSec(data){ const ing={}, semi={}; (data.ingredients||[]).forEach(i=>ing[i.id]=i); (data.semis||[]).forEach(s=>semi[s.id]=s);
  const items=(data.items||[]).filter(i=>i&&i.name&&(i.lines||[]).length).sort((a,b)=>(b.monthlySales||0)-(a.monthlySales||0)).slice(0,40);
  if(!items.length) return null;
  const nm=l=>{ const [k,id]=String(l.ref||'').split(':'), o=k==='i'?ing[id]:semi[id]; return o?o.name+' '+(+l.qty||0)+' '+(o.unit||'克'):'' };
  return {id:uid(),key:'recipe',name:'出餐標準卡（份量）',when:'每次出餐',cat:'品質',steps:items.map((it,i)=>({id:uid(),text:it.name+(it.cat?'（'+it.cat+'）':''),std:(it.lines||[]).map(nm).filter(Boolean).join('、')+(it.price?'｜售價 '+it.price+' 元':''),role:'廚房',audit:i<5,crit:false,why:i<5?'BOM 配方；月銷量前 5 名列入份量抽查':'BOM 配方',rid:'m:'+it.id}))} }
/* 專業度檢查 */
const MEAS=/\d|每|沒有|無|不得|不能|全部|標示|分開|簽名|一致|照/;
function proCheck(m){ const out=[]; let n=0; const seen={};
  (m.sections||[]).forEach((s,si)=>{ const st=s.steps||[]; if(!st.some(t=>t.audit)&&s.key!=='recipe') out.push({si,ti:null,lv:'warn',t:`「${s.name}」沒有任何稽核點，督導巡店檢查不到這一章`});
    st.forEach((t,ti)=>{ n++; const tx=String(t.text||'').trim(), sd=String(t.std||'').trim();
      if(!tx) out.push({si,ti,lv:'bad',t:'有一條步驟沒寫內容'});
      else if(seen[tx]) out.push({si,ti,lv:'warn',t:`「${tx}」重複出現`}); seen[tx]=1;
      if(tx&&!sd) out.push({si,ti,lv:t.audit?'bad':'warn',t:`「${tx}」沒有寫標準${t.audit?'，稽核時無法判斷合不合格':''}`});
      else if(t.audit&&!MEAS.test(sd)) out.push({si,ti,lv:'warn',t:`「${tx}」的標準不夠具體，建議寫數字（溫度、時間、份量、頻率）`}) }) });
  if(!(m.sections||[]).some(s=>(s.steps||[]).some(t=>t.crit))) out.push({si:null,ti:null,lv:'warn',t:'沒有標示任何「關鍵項」。食安相關的稽核點建議勾關鍵，不合格時總分最高 59 分'});
  const bad=out.filter(x=>x.lv==='bad').length, warn=out.length-bad;
  return {list:out,score:Math.max(0,Math.round(100-(bad*8+warn*3)*20/Math.max(n,10)))} }

  if(!C) return out; C.DIMS.forEach(d=>d.qs.forEach(([id,text])=>{ const v=Number(a[id]); if(CKMAP[id]&&a[id]!==undefined&&a[id]!==''&&v<=1) out.push({id,text,v}) })); return out }
function applySrc(v){ keepNew(); nf.src=v; if(!v){ nf.p.ck=[]; nf.coach=null; return }

}

   <label for="e_note">內部備註（不會交付）</label><input id="e_note" data-m="note" value="${esc(m.note||'')}"></div>
  <div class="g2 noprint"><div class="card"><h2>店況</h2><ul class="plist">${profText(m.profile).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <details ${pfOpen?'open':''} data-pfd><summary>修改店況</summary>${pform(m.profile)}</details>
    ${nsg?`<div class="row"><button class="pri" data-sug>依店況補上 ${nsg} 個建議步驟</button></div><p class="note">只會新增缺的步驟，不會動你改過的內容。</p>`:'<p class="note">手冊已涵蓋目前店況的建議步驟。</p>'}
    ${m.brand_id?`<div class="row"><button data-rec ${busy?'disabled':''}>${hasRec?'重新帶入':'帶入'} BOM 菜單出餐標準卡</button></div><p class="note">從 BOM 品牌的品項配方產生每道菜的份量標準，月銷量前 5 名列入稽核抽查。</p>`:''}</div>

     ${(sec.steps||[]).map((s,ti)=>stepRow(s,si,ti,sec.steps.length)).join('')}
     <div style="padding:8px 12px"><button class="sm" data-addt="${si}">＋ 加一個步驟</button></div></section>`).join('')}
  <div class="row noprint"><button data-adds>＋ 加一個章節</button><button data-dup>複製一份（給別的客戶用）</button><button class="${armed==='m'?'armed':''}" data-delm>${armed==='m'?'確定刪除這本手冊':'刪除手冊'}</button></div>`;
}

/* ---------- 產出：手冊、每日檢核表、新人訓練表 ---------- */
const tbA=w=>w?' border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%"':'';
const mark=t=>(t.audit?'★ ':'')+(t.crit?'⚠ ':'');
function cover(m,sub){ return `<div class="cover"><p class="note">品牌加辣餐飲顧問工作室</p><h1>${esc(m.title)}</h1><p>${esc(sub)}</p><p>${esc(m.client_name||'')}　${esc(m.biz_type)}</p><p class="note">第 ${m.version||1} 版｜${today()}</p></div>` }
function docHtml(m,w){
  const secs=m.sections||[], foc=secs.find(s=>s.key==='focus');
  return cover(m,'門市標準作業手冊')+`<h2>目錄</h2><ol>${secs.map(s=>`<li>${esc(s.name)}${s.when?`（${esc(s.when)}）`:''}</li>`).join('')}</ol>
  <h2>本店狀況與手冊設計重點</h2><ul>${profText(m.profile).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  ${foc&&foc.steps.length?`<p>這本手冊優先處理：${foc.steps.map(t=>esc(t.text)).join('、')}。改善目標寫在「${esc(foc.name)}」一章。</p>`:''}
  <p class="note">★ 為門市稽核重點，督導巡店與門市自檢都會檢查。⚠ 為關鍵項（食安與安全），不合格時稽核總分最高 59 分。</p>
  ${secs.map((s,i)=>`<h2>${i+1}. ${esc(s.name)}</h2>${s.when?`<p class="note">時機：${esc(s.when)}</p>`:''}<table${tbA(w)}><thead><tr><th>#</th><th>步驟</th><th>標準</th><th>負責</th></tr></thead><tbody>${(s.steps||[]).map((t,j)=>`<tr><td>${j+1}</td><td>${mark(t)}${esc(t.text)}</td><td>${esc(t.std)}</td><td>${esc(t.role)}</td></tr>`).join('')}</tbody></table>`).join('')}`;
}
const CHECK_KEYS=['focus','open','ck','deli','clean','safety','close'];
function checkHtml(m,w){ const days=['一','二','三','四','五','六','日'];
  const secs=(m.sections||[]).filter(s=>CHECK_KEYS.includes(s.key)).sort((a,b)=>CHECK_KEYS.indexOf(a.key)-CHECK_KEYS.indexOf(b.key));
  return `<h1>${esc(m.client_name||m.title)} 每日檢核表</h1><p>週次：＿＿＿＿＿　門市：＿＿＿＿＿　每天完成打 ✓，異常打 ✗ 並寫在交班紀錄。</p>
  ${secs.map(s=>`<h2>${esc(s.name)}${s.when?`（${esc(s.when)}）`:''}</h2><table class="ck"${tbA(w)}><thead><tr><th>項目</th><th>標準</th><th>負責</th>${days.map(d=>`<th class="d">${d}</th>`).join('')}</tr></thead><tbody>${(s.steps||[]).map(t=>`<tr><td>${mark(t)}${esc(t.text)}</td><td>${esc(t.std)}</td><td>${esc(t.role)}</td>${days.map(()=>'<td class="d"></td>').join('')}</tr>`).join('')}</tbody></table>`).join('')}
  <table class="ck"${tbA(w)}><tbody><tr><td><b>店長簽名</b></td>${days.map(d=>`<td class="d">${d}<br><br></td>`).join('')}</tr></tbody></table>`;
}
function trainRoles(m){ return ['全部'].concat(ROLES.filter(r=>r!=='全員'&&allSteps(m).some(t=>t.role===r))) }
function trainHtml(m,role,w){ const secs=(m.sections||[]).map(s=>({s,st:(s.steps||[]).filter(t=>role==='全部'||t.role===role||t.role==='全員')})).filter(x=>x.st.length&&x.s.key!=='multi');
  return `<h1>${esc(m.client_name||m.title)} 新人訓練表${role!=='全部'?'｜'+esc(role):''}</h1><p>新人姓名：＿＿＿＿＿　到職日：＿＿＿＿＿　帶訓人：＿＿＿＿＿</p><p class="note">每一項由帶訓人講解、示範，新人實作合格後簽名。全部合格、店長簽名後才能獨立上線。★ 是稽核重點，⚠ 是關鍵項，一定要會。</p>
  ${secs.map(({s,st})=>`<h2>${esc(s.name)}</h2><table class="ck"${tbA(w)}><thead><tr><th>項目</th><th>標準</th><th class="d2">講解日期</th><th class="d2">實作合格</th><th class="d2">帶訓人簽名</th></tr></thead><tbody>${st.map(t=>`<tr><td>${mark(t)}${esc(t.text)}</td><td>${esc(t.std)}</td><td></td><td></td><td></td></tr>`).join('')}</tbody></table>`).join('')}
  <table class="ck"${tbA(w)}><tbody><tr><td><b>上線核准</b>　店長簽名：＿＿＿＿＿　日期：＿＿＿＿＿</td></tr></tbody></table>`;
}
function outHtml(m,v,w){ return v==='check'?checkHtml(m,w):v==='train'?trainHtml(m,trainRole,w):docHtml(m,w) }
const OUTS=[['doc','SOP 手冊'],['check','每日檢核表'],['train','新人訓練表']];
function vDoc(m,v){ if(!OUTS.some(o=>o[0]===v)) v='doc';
  return `<div class="row noprint" style="margin-bottom:10px"><a class="btn" href="#m=${m.id}">← 回編輯</a>${OUTS.map(o=>`<a class="btn ${o[0]===v?'pri':''}" href="#m=${m.id}&v=${o[0]}">${o[1]}</a>`).join('')}</div>
  <div class="row noprint" style="margin-bottom:10px">${v==='train'?`<label style="margin:0">職務 <select data-trole style="width:auto">${trainRoles(m).map(r=>`<option ${r===trainRole?'selected':''}>${esc(r)}</option>`).join('')}</select></label>`:''}<button class="pri" data-print>列印／存成 PDF</button><button data-word="${v}">下載 Word</button>${dirty?'<span class="pill warn">有修改還沒存</span>':''}</div>
  <div class="card doc ${v!=='doc'?'form':''}">${outHtml(m,v)}</div>` }
function docText(m){ return `${m.title}\n${m.client_name||''} ${m.biz_type}｜第 ${m.version||1} 版\n★ = 稽核重點　⚠ = 關鍵項\n\n`+(m.sections||[]).map((s,i)=>`【${i+1}. ${s.name}】${s.when?'（'+s.when+'）':''}\n`+(s.steps||[]).map((t,j)=>`${j+1}. ${mark(t)}${t.text}${t.std?'｜標準：'+t.std:''}${t.role?'｜'+t.role:''}`).join('\n')).join('\n\n') }

/* ---------- 督導總覽（每家店一列） ---------- */
function spark(v){ if(v.length<2) return ''; const W=110,H=30, X=i=>4+i*(W-8)/(v.length-1), Y=s=>H-3-(Math.max(40,Math.min(100,s))-40)/60*(H-6);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="分數趨勢 ${v.join('、')}"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${v.map((s,i)=>X(i)+','+Y(s)).join(' ')}"/>${v.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s)}" r="2.5" fill="var(--accent)"/>`).join('')}</svg>` }
const lvl=s=>s==null?'mute':s>=85?'good':s>=70?'warn':'bad';
function vAudit(){
  const t=today(), d30=addDays(t,-30), d7=addDays(t,-7), by={};
  D.audits.forEach(a=>{ const k=a.brand_id+'|'+(a.store||''); (by[k]=by[k]||[]).push(a) });
  const rows=Object.keys(by).map(k=>{ const as=by[k].slice().sort((x,y)=>x.audit_date<y.audit_date?1:-1), b=D.brands.find(x=>x.id===as[0].brand_id)||{id:as[0].brand_id,name:as[0].brand_id};
    const last=as[0], prev=as[1], lastSup=as.find(a=>a.kind==='supervisor'), lastSelf=as.find(a=>a.kind!=='supervisor');
    return {b,store:as[0].store||'',as,last,prev,open:last.open_count||0,over:as.reduce((s,a)=>Math.max(s,a.overdue_count||0),0),crit:last.crit_fail||0,
      sup:as.filter(a=>a.kind==='supervisor'&&a.audit_date>=d30).length,self:as.filter(a=>a.kind!=='supervisor'&&a.audit_date>=d30).length,stale:!lastSup||lastSup.audit_date<d30,selfStale:!lastSelf||lastSelf.audit_date<d7} });
  D.brands.filter(b=>!D.audits.some(a=>a.brand_id===b.id)&&D.manuals.some(m=>m.brand_id===b.id&&m.status==='已交付')).forEach(b=>rows.push({b,store:'',as:[],last:null,open:0,over:0,crit:0,sup:0,self:0,stale:true,selfStale:true}));
  rows.sort((x,y)=>(y.crit-x.crit)||(y.over-x.over)||((x.last?x.last.score:101)-(y.last?y.last.score:101)));
  const sc=rows.filter(r=>r.last&&r.last.score!=null).map(r=>r.last.score), avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
  const st=(n,l,a)=>`<div class="stat ${a&&n?'alert':''}"><b>${n??'—'}</b><span>${l}</span></div>`;
  let h=`<div class="stats">${st(rows.length,'追蹤中的門市')}${st(avg,'最近一次平均分')}${st(rows.filter(r=>r.crit).length,'關鍵項不合格',1)}${st(rows.reduce((s,r)=>s+r.over,0),'改善已逾期',1)}${st(rows.filter(r=>r.stale).length,'30 天沒督導巡店',1)}</div>`;
  if(!rows.length) return h+`<div class="card"><h2>還沒有稽核紀錄</h2><p class="sub">在 BOM 中心的「門市稽核」完成一次稽核（督導巡店或門市自檢），這裡就會出現各門市的分數、待改善與趨勢。</p><div class="row"><a class="btn pri" href="${BOM}#qsc">去 BOM 中心稽核</a></div></div>`;
  return h+`<div class="card"><div class="scroll"><table><thead><tr><th>品牌／門市</th><th>最近一次</th><th class="n">分數</th><th class="n">比上次</th><th>趨勢</th><th class="n">待改善</th><th class="n">逾期</th><th>近 30 天</th><th></th></tr></thead><tbody>${rows.map(r=>{const L=r.last, df=L&&r.prev&&L.score!=null&&r.prev.score!=null?L.score-r.prev.score:null;
    return `<tr><td><b>${esc(r.b.name)}</b>${r.store?`<div class="note">${esc(r.store)}</div>`:''}<div>${r.crit?`<span class="pill bad">關鍵項不合格 ${r.crit}</span> `:''}${r.stale?'<span class="pill warn">30 天沒督導</span> ':''}${L&&r.selfStale?'<span class="pill mute">7 天沒自檢</span>':''}</div></td><td>${L?esc(L.audit_date)+'<div class="note">'+(L.kind==='supervisor'?'督導巡店':'門市自檢')+'</div>':'<span class="note">還沒稽核</span>'}</td>
     <td class="n">${L&&L.score!=null?`<span class="pill ${lvl(L.score)}">${L.score}</span>`:'—'}</td><td class="n">${df==null?'—':(df>0?'+':'')+df}</td><td>${spark(r.as.slice(0,8).reverse().map(a=>a.score).filter(s=>s!=null))}</td>
     <td class="n">${r.open}</td><td class="n">${r.over?`<span class="pill bad">${r.over}</span>`:'0'}</td><td>督導 ${r.sup}・自檢 ${r.self}</td><td><a class="btn" href="${BOM}#qsc&b=${encodeURIComponent(r.b.id)}" target="_blank" rel="noopener">巡店／看缺失</a></td></tr>`}).join('')}</tbody></table></div>
   <p class="note">建議頻率：督導每店每月至少巡店 1 次、門市每週自檢 1 次；85 分以下 2 週內複查。分數 85 以上綠、70–84 黃、70 以下紅；有關鍵項不合格時總分最高 59 分。資料來自 BOM 中心「門市稽核」。</p></div>`;
}

/* ---------- 互動 ---------- */
function readStep(el){ const r=el.closest('.st'); if(!r) return; const s=M.sections[+r.dataset.si].steps[+r.dataset.ti], f=el.dataset.f; if(f==='audit'||f==='crit'){ s[f]=el.checked; if(f==='audit'&&!el.checked) s.crit=false } else s[f]=el.value; markDirty(); if(f==='audit'){ const c=r.querySelector('[data-f=crit]'); if(c){ c.disabled=!el.checked; if(!el.checked) c.checked=false } } }
function markDirty(){ if(!dirty){ dirty=true; const t=document.querySelector('.sticky b'); if(t&&!document.querySelector('.sticky .pill.warn')) t.insertAdjacentHTML('afterend',' <span class="pill warn">有修改還沒存</span>') } }
function readPf(el){ const tgt=route().new?nf.p:M&&M.profile; if(!tgt) return; const k=el.dataset.pf;
  if(el.dataset.pft==='one') tgt[k]=el.value; else { const a=new Set(tgt[k]||[]); el.checked?a.add(el.value):a.delete(el.value); tgt[k]=PF.find(x=>x[0]===k)[3].filter(v=>a.has(v)) }
  if(route().new){ keepNew(); render() } else { pfOpen=true; markDirty(); const y=scrollY; render(); scrollTo(0,y) } }
document.addEventListener('input',e=>{ const el=e.target; if(!M||el.dataset.pf) return;
  if(el.dataset.f){ readStep(el); return }
  if(el.dataset.sf){ const s=M.sections[+el.closest('.sec').dataset.si]; s[el.dataset.sf]=el.value; markDirty(); return }
  if(el.dataset.m){ M[el.dataset.m]=el.value||(el.dataset.m==='brand_id'?null:''); markDirty() } });
document.addEventListener('change',e=>{ const el=e.target;
  if(el.dataset.pf){ readPf(el); return }
  if('src' in el.dataset){ applySrc(el.value); render(); return }
  if('nt' in el.dataset){ keepNew(); nf.type=el.value; render(); return }
  if('nk' in el.dataset){ keepNew(); nf.keys=[...document.querySelectorAll('[data-nk]:checked')].map(x=>x.value); render(); return }
  if('nx' in el.dataset){ keepNew(); nf.skip=el.checked?nf.skip.filter(k=>k!==el.value):nf.skip.concat(el.value); render(); return }
  if('trole' in el.dataset){ trainRole=el.value; render(); return }
  if(!M) return;
  if(el.dataset.f){ readStep(el); return }
  if(el.dataset.sf){ M.sections[+el.closest('.sec').dataset.si][el.dataset.sf]=el.value; markDirty(); return }
  if(el.dataset.m){ M[el.dataset.m]=el.value||(el.dataset.m==='brand_id'?null:''); markDirty(); if(el.dataset.m==='brand_id') render() } });
function keepNew(){ if(!$('#n_client')) return; nf.client=$('#n_client').value||''; nf.brand=($('#n_brand')||{}).value||''; nf.title=($('#n_title')||{}).value||'' }
function arm(k){ armed=k; render(); setTimeout(()=>{ if(armed===k){ armed=null; render() } },4000) }
async function act(f){ if(busy) return; busy=true; render(); try{ await f() }catch(x){} busy=false; render() }
/* 資料庫還沒有 profile 欄位時，店況改存在 note 後面，不讓存檔失敗 */
const PTAG='\n#店況:';
function withProfile(row,p){ if(!noProfileCol) return Object.assign({},row,{profile:p}); return Object.assign({},row,{note:String(row.note||'').split(PTAG)[0]+PTAG+JSON.stringify(p)}) }
function readProfile(r){ if(r.profile&&Object.keys(r.profile).length) return r.profile; const i=String(r.note||'').indexOf(PTAG); if(i>=0){ try{ return JSON.parse(r.note.slice(i+PTAG.length)) }catch(x){} } return null }
async function tryWrite(mkq,row,p,what){ let r=await mkq(withProfile(row,p)); if(r.error&&/profile/.test(r.error.message||'')&&!noProfileCol){ noProfileCol=true; r=await mkq(withProfile(row,p)) } if(r.error){ say(what+'失敗：'+r.error.message+'。請重新整理後再試一次，還是不行就把這段訊息傳給 Claude。',true); throw r.error } return r.data }
function fix(r){ if(!r) return r; r.profile=readProfile(r); if(r.note) r.note=String(r.note).split(PTAG)[0]; return r }
async function saveM(){
  const row={title:M.title.trim()||'未命名手冊',biz_type:M.biz_type,client_name:M.client_name||null,brand_id:M.brand_id||null,sections:M.sections,note:M.note||null,updated_at:new Date().toISOString(),updated_by:me.email};
  const r=await tryWrite(x=>sbc.from('sop_manuals').update(x).eq('id',M.id).eq('updated_at',D.manuals.find(x=>x.id===M.id).updated_at).select(),row,M.profile,'儲存');
  if(!r||!r.length){ say('這本手冊剛剛在別的視窗被改過，沒有覆蓋。請複製你的修改後重新整理。',true); throw new Error('conflict') }
  const i=D.manuals.findIndex(x=>x.id===M.id); D.manuals[i]=fix(r[0]); M=JSON.parse(JSON.stringify(D.manuals[i])); M.profile=prof(M.profile); dirty=false }
function dlWord(m,v){
  const name=(v==='check'?'每日檢核表':v==='train'?'新人訓練表'+(trainRole!=='全部'?'_'+trainRole:''):'SOP手冊');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(m.title)}</title><style>body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:11pt}h1{font-size:18pt}h2{font-size:13pt;color:#0f6b5c;margin-top:14pt}th{background:#dcefea;text-align:left}td,th{vertical-align:top}.note{color:#5d6a65}.cover{text-align:center;page-break-after:always}td.d,th.d{width:28pt;text-align:center}</style></head><body>${outHtml(m,v,true)}</body></html>`;
  const u=URL.createObjectURL(new Blob(['﻿',html],{type:'application/msword'})), a=document.createElement('a'); a.href=u; a.download=((m.client_name||m.title||'SOP')+'_'+name).replace(/[\\/:*?"<>|]/g,'_')+'_v'+(m.version||1)+'.doc'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  say('已下載 Word 檔，可以直接用 Word 打開修改後給客戶。') }
async function publish(){
  if(dirty) await saveM();
  const items=[]; M.sections.forEach(s=>(s.steps||[]).forEach(t=>{ if(t.audit&&String(t.text||'').trim()) items.push({id:'sop-'+t.id,cat:s.cat||'其他',text:t.text.trim(),std:t.std||'',sop:s.name,crit:!!t.crit}) }));
  const ver=(M.status==='已交付'?(M.version||1)+1:(M.version||1)), at=new Date().toISOString();
  let mode='';
  for(let tries=0;tries<2;tries++){
    const b=await q(sbc.from('bom_brands').select('id,name,data,rev').eq('id',M.brand_id).maybeSingle(),'讀取品牌');
    if(!b){ say('找不到這個 BOM 品牌，請重新選擇對應品牌。',true); return }
    const data=b.data||{}; data.sop={id:M.id,title:M.title,biz:M.biz_type,ver,at,sections:M.sections.map(s=>({name:s.name,when:s.when||'',steps:(s.steps||[]).map(t=>({text:t.text,std:t.std||'',role:t.role||'',audit:!!t.audit,crit:!!t.crit}))}))};
    const hasDone=(data.audits||[]).some(a=>a.done);
    if(!data.qscItems||!hasDone){ data.qscItems=items; mode='replace' }
    else { const cur=data.qscItems; items.forEach(it=>{ const x=cur.find(c=>c.id===it.id); if(x) Object.assign(x,it); else cur.push(it) }); mode='merge' }
    const r=await q(sbc.from('bom_brands').update({data,rev:b.rev+1,edited_on_site:true}).eq('id',b.id).eq('rev',b.rev).select('id,rev'),'交付');
    if(r&&r.length){
      const u=await q(sbc.from('sop_manuals').update({status:'已交付',version:ver,published_at:at,updated_at:at,updated_by:me.email}).eq('id',M.id).select(),'更新手冊狀態');
      const i=D.manuals.findIndex(x=>x.id===M.id); D.manuals[i]=fix(u[0]); M=JSON.parse(JSON.stringify(D.manuals[i])); M.profile=prof(M.profile); dirty=false;
      say(`已交付第 ${ver} 版到「${b.name}」。門市在 BOM 中心「SOP 手冊」就看得到；`+(mode==='replace'?`門市稽核項目已換成手冊的 ${items.length} 個稽核點。`:`手冊的 ${items.length} 個稽核點已加進門市稽核（原本的項目和紀錄都保留）。`)); return }
  }
  say('品牌資料剛好有人在修改，交付沒有完成。請等幾秒再按一次。',true);
}
async function importRecipes(){
  const b=await q(sbc.from('bom_brands').select('id,name,data').eq('id',M.brand_id).maybeSingle(),'讀取 BOM 菜單');
  const sec=b&&recipeSec(b.data||{});
  if(!sec){ say('這個 BOM 品牌還沒有建立品項配方，先到 BOM 中心「品項配方」建好再帶入。',true); return }
  const i=M.sections.findIndex(s=>s.key==='recipe');
  if(i>=0){ const old=M.sections[i]; sec.id=old.id; sec.name=old.name; sec.steps.forEach(s=>{ const o=old.steps.find(t=>t.rid===s.rid); if(o){ s.id=o.id; s.audit=o.audit; s.crit=o.crit; s.role=o.role } }); M.sections[i]=sec }
  else M.sections=sortSecs(M.sections.concat(sec));
  markDirty(); say(`已帶入 ${sec.steps.length} 道菜的出餐標準卡（份量來自 BOM 配方）。確認後按「儲存」。`) }
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-out]'); if(!b) return; const d=b.dataset;
  if('out' in d){await sbc.auth.signOut(); location.href=PORTAL; return}
  if('create' in d){ keepNew(); if(!nf.keys.length){ say('至少要選一個基本章節。',true); return }
    const title=nf.title.trim()||((nf.client.trim()?nf.client.trim()+' ':'')+'門市 SOP 手冊'), p=prof(nf.p);
    return act(async()=>{ const row={title,biz_type:nf.type,client_name:nf.client.trim()||null,brand_id:nf.brand||null,coach_client_id:nf.coach||+route().client||null,sections:build(nf.type,newKeys(),p),updated_by:me.email};
      const r=fix(await tryWrite(x=>sbc.from('sop_manuals').insert(x).select().single(),row,p,'建立手冊'));
      D.manuals.unshift(r); nf=nfBlank(); srcDone=route().client?'c:'+route().client:''; M=null; say(`已建立「${title}」，共 ${nSteps(r)} 個步驟、${nAudit(r)} 個稽核點，${nWhy(r)} 條依業態與店況加入。逐條看過、改成客戶的做法後按「儲存」。`); location.hash='m='+r.id }) }
  if(!M) return;
  if('save' in d) return act(async()=>{ await saveM(); say('已儲存。') });
  if('print' in d){ window.print(); return }
  if('word' in d){ dlWord(M,d.word||'doc'); return }
  if('jump' in d){ const [si,ti]=d.jump.split('|'), el=document.getElementById(ti!==''?`st-${si}-${ti}`:'')||document.querySelector(`.sec[data-si="${si}"]`); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flashrow'); setTimeout(()=>el.classList.remove('flashrow'),1600); const t=el.querySelector('textarea[data-f=std]')||el.querySelector('input'); t&&t.focus({preventScroll:true}) } return }
  if('sug' in d){ const sg=suggest(M); let n=0; sg.forEach(x=>{ if(x.s){ x.sec.steps.push(x.s); n++ } else { x.newSec.steps=x.steps; M.sections.push(x.newSec); n+=x.steps.length } }); M.sections=sortSecs(M.sections); markDirty(); say(`已補上 ${n} 個建議步驟（標示「為什麼有這條」）。確認後按「儲存」。`); render(); return }
  if('rec' in d) return act(importRecipes);
  if('copytxt' in d){ try{ await navigator.clipboard.writeText(docText(M)); say('已複製全文，可以貼到 LINE 或文件。') }catch(x){ say('瀏覽器不讓複製，請改用「下載 Word」。',true) } return }
  if('pub' in d){ if(armed!=='pub') return arm('pub'); armed=null; return act(publish) }
  if('addt' in d){ M.sections[+d.addt].steps.push({id:uid(),text:'',std:'',role:'全員',audit:false,crit:false}); markDirty(); render(); const r=document.querySelectorAll(`.sec[data-si="${d.addt}"] .st textarea[data-f=text]`); r.length&&r[r.length-1].focus(); return }
  if('mv' in d){ const [si,ti,k]=d.mv.split('|').map(Number), a=M.sections[si].steps; [a[ti],a[ti+k]]=[a[ti+k],a[ti]]; markDirty(); render(); return }
  if('dt' in d){ if(armed!=='t'+d.dt) return arm('t'+d.dt); armed=null; const [si,ti]=d.dt.split('|').map(Number); M.sections[si].steps.splice(ti,1); markDirty(); render(); return }
  if('smv' in d){ const [si,k]=d.smv.split('|').map(Number), a=M.sections; [a[si],a[si+k]]=[a[si+k],a[si]]; markDirty(); render(); return }
  if('ds' in d){ if(armed!=='s'+d.ds) return arm('s'+d.ds); armed=null; M.sections.splice(+d.ds,1); markDirty(); render(); return }
  if('adds' in d){ M.sections.push({id:uid(),key:'custom',name:'新章節',when:'',cat:'其他',steps:[{id:uid(),text:'',std:'',role:'全員',audit:false,crit:false}]}); markDirty(); render(); return }
  if('dup' in d) return act(async()=>{ const row={title:M.title+'（複本）',biz_type:M.biz_type,client_name:null,brand_id:null,sections:JSON.parse(JSON.stringify(M.sections).replace(/"id":"[a-z0-9]+"/g,()=>'"id":"'+uid()+'"')),updated_by:me.email};
    const r=fix(await tryWrite(x=>sbc.from('sop_manuals').insert(x).select().single(),row,M.profile,'複製'));
    D.manuals.unshift(r); M=null; dirty=false; say('已複製一份。改客戶名稱、店況和對應品牌後就能交付。'); location.hash='m='+r.id });
  if('delm' in d){ if(armed!=='m') return arm('m'); armed=null; return act(async()=>{ await q(sbc.from('sop_manuals').delete().eq('id',M.id),'刪除'); D.manuals=D.manuals.filter(x=>x.id!==M.id); M=null; dirty=false; say('已刪除手冊（已交付到門市的內容不受影響）。'); location.hash='' }) }
});
window.addEventListener('hashchange',()=>{ const r=route(); if(M&&dirty&&String(r.m)!==String(M.id)){ say('上一本手冊有修改沒有存，已放棄那些修改。',true); M=null; dirty=false } else { say(flash&&!flashBad?flash:''); flash='' } armed=null; render(); scrollTo(0,0) });
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue='' } });
sbc.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
load();
</script>
<script src="../kit/kit.js"></script>
<script>window.Kit&&Kit.init({tool:'sop',sb:sbc})</script>
