<!doctype html>
<html lang="zh-Hant">

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2320; --line:#2e3a36; --fg:#e7eeeb; --mute:#98a7a1;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--mute);margin:0 0 12px}.note{color:var(--mute);font-size:13px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;color:inherit}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
button,a.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.sm{padding:3px 9px;font-size:13px}
button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.who{font-size:14px;color:var(--mute);text-align:right}
.msg{padding:9px 12px;border-radius:8px;background:var(--accent-soft);margin:10px 0}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--field);color:var(--mute);border-color:var(--line)}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0}
.tabs a{padding:7px 12px;text-decoration:none;color:var(--mute);border-bottom:3px solid transparent}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}

.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
.item .meta{font-size:13px;color:var(--mute)}
.goal{display:grid;grid-template-columns:1fr 110px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal svg{width:110px;height:30px}
.gl{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:6px;margin:4px 0}
.al{display:grid;grid-template-columns:2fr .8fr 1fr auto;gap:6px;margin:4px 0}

a{color:var(--accent)}
.pre{white-space:pre-wrap}
.report h2{font-size:20px}.report table{margin:6px 0 10px}
@media print{body{background:#fff;color:#000}.noprint,.tabs,.top,#flash{display:none!important}.card{border:0;padding:0}.wrap{padding:0}}
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0}

.sec>header input{flex:1;min-width:160px;font-weight:600}
.sec>header .when{flex:0 1 180px;min-width:120px;font-weight:400}
.sec>header select{width:auto}
.st{display:grid;grid-template-columns:28px 1.6fr 1.3fr 96px 70px auto;gap:6px;align-items:start;padding:8px 12px;border-top:1px solid var(--line)}
.st:first-of-type{border-top:0}
.st .no{color:var(--mute);padding-top:8px;text-align:right}
.st textarea{min-height:40px}
.st .aud{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute);padding-top:8px;margin:0}
.st .ops{display:flex;gap:4px;flex-wrap:wrap}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.types label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--fg);font-size:14px;margin:0;cursor:pointer}
.types input{width:auto;margin-top:4px}
.types label.on{border-color:var(--accent);background:var(--accent-soft)}
.doc h1{font-size:26px}.doc h2{font-size:19px;margin-top:22px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.doc table td{white-space:normal}.doc .cover{text-align:center;padding:40px 0 30px;border-bottom:1px solid var(--line);margin-bottom:16px}
.spark{width:110px;height:30px}
@media (max-width:640px){.sticky{position:static}.st{grid-template-columns:24px 1fr 1fr}.st textarea[data-f=text],.st .std{grid-column:2/-1}.st .role{grid-column:2}.st .aud{grid-column:3}.st .ops{grid-column:1/-1;justify-content:flex-end}}
@media print{.doc h2{break-after:avoid}.doc tr{break-inside:avoid}.doc .cover{break-after:page;padding-top:120px}}
</style>
</head>

function build(type,keys){
  const T=TYPES[type]||TYPES['通用'], add=T.add||{};
  return BASE.filter(s=>keys.includes(s[0])).map(([key,name,when,cat,steps])=>({id:uid(),key,name,when,cat,
    steps:steps.concat(add[key]||[]).map(([text,std,role,a])=>({id:uid(),text,std,role,audit:!!a}))}));
}

async function load(){

  if(me){ const p=await sbc.from('bom_profiles').select('role,status').eq('user_id',me.id).maybeSingle(); ok=!!(p.data&&p.data.role==='admin'&&p.data.status==='active') }

}
async function loadData(){
  const r=await Promise.all([
    sbc.from('sop_manuals').select('*').order('updated_at',{ascending:false}),
    sbc.from('bom_brands').select('id,name').order('name'),

/* ---------- 督導總覽 ---------- */
function spark(v){ if(v.length<2) return ''; const W=110,H=30, X=i=>4+i*(W-8)/(v.length-1), Y=s=>H-3-(Math.max(40,Math.min(100,s))-40)/60*(H-6);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="分數趨勢 ${v.join('、')}"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${v.map((s,i)=>X(i)+','+Y(s)).join(' ')}"/>${v.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s)}" r="2.5" fill="var(--accent)"/>`).join('')}</svg>` }
const lvl=s=>s==null?'mute':s>=85?'good':s>=70?'warn':'bad';
function vAudit(){
  const t=today(), d30=addDays(t,-30), by={};
  D.audits.forEach(a=>{ (by[a.brand_id]=by[a.brand_id]||[]).push(a) });
  const rows=D.brands.map(b=>{ const as=(by[b.id]||[]).slice().sort((x,y)=>x.audit_date<y.audit_date?1:-1);
    const open=as.reduce((s,a)=>s+(a.open_count||0),0), over=as.reduce((s,a)=>s+(a.overdue_count||0),0);
    const last=as[0], prev=as[1], sup=as.filter(a=>a.kind==='supervisor'&&a.audit_date>=d30).length, self=as.filter(a=>a.kind!=='supervisor'&&a.audit_date>=d30).length;
    const lastSup=as.find(a=>a.kind==='supervisor');
    return {b,as,last,prev,open,over,sup,self,lastSup,stale:!lastSup||lastSup.audit_date<d30} }).filter(r=>r.as.length||D.manuals.some(m=>m.brand_id===r.b.id));
  rows.sort((x,y)=>(y.over-x.over)||((x.last?x.last.score:101)-(y.last?y.last.score:101)));
  const sc=rows.filter(r=>r.last&&r.last.score!=null).map(r=>r.last.score), avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
  const st=(n,l,a)=>`<div class="stat ${a&&n?'alert':''}"><b>${n??'—'}</b><span>${l}</span></div>`;
  let h=`<div class="stats">${st(rows.length,'追蹤中的品牌')}${st(avg,'最近一次平均分')}${st(rows.reduce((s,r)=>s+r.open,0),'待改善項目')}${st(rows.reduce((s,r)=>s+r.over,0),'已逾期',1)}${st(rows.filter(r=>r.stale).length,'30 天沒督導巡店',1)}</div>`;
  if(!rows.length) return h+`<div class="card"><h2>還沒有稽核紀錄</h2><p class="sub">在 BOM 中心的「門市稽核」完成一次稽核（督導巡店或門市自檢），這裡就會出現各品牌的分數、待改善與趨勢。</p><div class="row"><a class="btn pri" href="${BOM}#qsc">去 BOM 中心稽核</a></div></div>`;
  return h+`<div class="card"><div class="scroll"><table><thead><tr><th>品牌</th><th>最近一次</th><th class="n">分數</th><th class="n">比上次</th><th>趨勢</th><th class="n">待改善</th><th class="n">逾期</th><th>近 30 天</th><th></th></tr></thead><tbody>${rows.map(r=>{const L=r.last, df=L&&r.prev&&L.score!=null&&r.prev.score!=null?L.score-r.prev.score:null;
    return `<tr><td><b>${esc(r.b.name)}</b>${r.stale?'<div><span class="pill warn">30 天沒督導</span></div>':''}</td><td>${L?esc(L.audit_date)+'<div class="note">'+(L.kind==='supervisor'?'督導巡店':'門市自檢')+(L.store?'・'+esc(L.store):'')+'</div>':'<span class="note">還沒稽核</span>'}</td>
     <td class="n">${L&&L.score!=null?`<span class="pill ${lvl(L.score)}">${L.score}</span>`:'—'}</td><td class="n">${df==null?'—':(df>0?'+':'')+df}</td><td>${spark(r.as.slice(0,8).reverse().map(a=>a.score).filter(s=>s!=null))}</td>
     <td class="n">${r.open}</td><td class="n">${r.over?`<span class="pill bad">${r.over}</span>`:'0'}</td><td>督導 ${r.sup}・自檢 ${r.self}</td><td><a class="btn" href="${BOM}#qsc&b=${encodeURIComponent(r.b.id)}" target="_blank" rel="noopener">巡店／看缺失</a></td></tr>`}).join('')}</tbody></table></div>
   <p class="note">分數 85 以上綠、70–84 黃、70 以下紅。資料來自 BOM 中心「門市稽核」，督導和門市自檢完成時自動同步。</p></div>`;
}

/* ---------- 互動 ---------- */
function readStep(el){ const r=el.closest('.st'); if(!r) return; const s=M.sections[+r.dataset.si].steps[+r.dataset.ti], f=el.dataset.f; s[f]=f==='audit'?el.checked:el.value; markDirty() }
function markDirty(){ if(!dirty){ dirty=true; const t=document.querySelector('.sticky b'); if(t&&!document.querySelector('.sticky .pill.warn')) t.insertAdjacentHTML('afterend',' <span class="pill warn">有修改還沒存</span>') } }
document.addEventListener('input',e=>{ const el=e.target; if(!M) return;
  if(el.dataset.f){ readStep(el); return }
  if(el.dataset.sf){ const s=M.sections[+el.closest('.sec').dataset.si]; s[el.dataset.sf]=el.value; markDirty(); return }
  if(el.dataset.m){ M[el.dataset.m]=el.value||(el.dataset.m==='brand_id'?null:''); markDirty() } });
document.addEventListener('change',e=>{ const el=e.target;
  if('nt' in el.dataset){ keepNew(); nf.type=el.value; render(); return }
  if('nk' in el.dataset){ keepNew(); nf.keys=[...document.querySelectorAll('[data-nk]:checked')].map(x=>x.value); render(); return }
  if(!M) return;
  if(el.dataset.f){ readStep(el); return }
  if(el.dataset.sf){ M.sections[+el.closest('.sec').dataset.si][el.dataset.sf]=el.value; markDirty(); return }
  if(el.dataset.m){ M[el.dataset.m]=el.value||(el.dataset.m==='brand_id'?null:''); markDirty(); if(el.dataset.m==='brand_id') render() } });
function keepNew(){ nf.client=($('#n_client')||{}).value||''; nf.brand=($('#n_brand')||{}).value||''; nf.title=($('#n_title')||{}).value||'' }
function arm(k){ armed=k; render(); setTimeout(()=>{ if(armed===k){ armed=null; render() } },4000) }
async function act(f){ if(busy) return; busy=true; render(); try{ await f() }catch(x){} busy=false; render() }
async function saveM(){
  const row={title:M.title.trim()||'未命名手冊',biz_type:M.biz_type,client_name:M.client_name||null,brand_id:M.brand_id||null,sections:M.sections,note:M.note||null,updated_at:new Date().toISOString(),updated_by:me.email};
  const r=await q(sbc.from('sop_manuals').update(row).eq('id',M.id).eq('updated_at',D.manuals.find(x=>x.id===M.id).updated_at).select(),'儲存');
  if(!r||!r.length){ say('這本手冊剛剛在別的視窗被改過，沒有覆蓋。請複製你的修改後重新整理。',true); throw new Error('conflict') }
  const i=D.manuals.findIndex(x=>x.id===M.id); D.manuals[i]=r[0]; M=JSON.parse(JSON.stringify(r[0])); dirty=false }
function dlWord(m){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(m.title)}</title><style>body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:11pt}h1{font-size:20pt}h2{font-size:14pt;color:#0f6b5c;margin-top:18pt}th{background:#dcefea;text-align:left}td,th{vertical-align:top}.note{color:#5d6a65}.cover{text-align:center;page-break-after:always}</style></head><body>${docHtml(m,true)}</body></html>`;
  const u=URL.createObjectURL(new Blob(['﻿',html],{type:'application/msword'})), a=document.createElement('a'); a.href=u; a.download=(m.title||'SOP手冊').replace(/[\\/:*?"<>|]/g,'_')+'_v'+(m.version||1)+'.doc'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  say('已下載 Word 檔，可以直接用 Word 打開修改後給客戶。') }
async function publish(){
  if(dirty) await saveM();
  const items=[]; M.sections.forEach(s=>(s.steps||[]).forEach(t=>{ if(t.audit&&String(t.text||'').trim()) items.push({id:'sop-'+t.id,cat:s.cat||'其他',text:t.text.trim(),std:t.std||'',sop:s.name}) }));
  const ver=(M.status==='已交付'?(M.version||1)+1:(M.version||1)), at=new Date().toISOString();
  let mode='';
  for(let tries=0;tries<2;tries++){
    const b=await q(sbc.from('bom_brands').select('id,name,data,rev').eq('id',M.brand_id).maybeSingle(),'讀取品牌');
    if(!b){ say('找不到這個 BOM 品牌，請重新選擇對應品牌。',true); return }
    const data=b.data||{}; data.sop={id:M.id,title:M.title,biz:M.biz_type,ver,at,sections:M.sections.map(s=>({name:s.name,when:s.when||'',steps:(s.steps||[]).map(t=>({text:t.text,std:t.std||'',role:t.role||'',audit:!!t.audit}))}))};
    const hasDone=(data.audits||[]).some(a=>a.done);
    if(!data.qscItems||!hasDone){ data.qscItems=items; mode='replace' }
    else { const cur=data.qscItems; items.forEach(it=>{ const x=cur.find(c=>c.id===it.id); if(x) Object.assign(x,it); else cur.push(it) }); mode='merge' }
    const r=await q(sbc.from('bom_brands').update({data,rev:b.rev+1,edited_on_site:true}).eq('id',b.id).eq('rev',b.rev).select('id,rev'),'交付');
    if(r&&r.length){
      const u=await q(sbc.from('sop_manuals').update({status:'已交付',version:ver,published_at:at,updated_at:at,updated_by:me.email}).eq('id',M.id).select(),'更新手冊狀態');
      const i=D.manuals.findIndex(x=>x.id===M.id); D.manuals[i]=u[0]; M=JSON.parse(JSON.stringify(u[0])); dirty=false;
      say(`已交付第 ${ver} 版到「${b.name}」。門市在 BOM 中心「SOP 手冊」就看得到；`+(mode==='replace'?`門市稽核項目已換成手冊的 ${items.length} 個稽核點。`:`手冊的 ${items.length} 個稽核點已加進門市稽核（原本的項目和紀錄都保留）。`)); return }
  }
  say('品牌資料剛好有人在修改，交付沒有完成。請等幾秒再按一次。',true);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-out]'); if(!b) return; const d=b.dataset;
  if('out' in d){await sbc.auth.signOut(); location.href=PORTAL; return}
  if('create' in d){ keepNew(); if(!nf.keys.length){ say('至少要選一個章節。',true); return }
    const title=nf.title.trim()||((nf.client.trim()?nf.client.trim()+' ':'')+'門市 SOP 手冊');
    return act(async()=>{ const r=await q(sbc.from('sop_manuals').insert({title,biz_type:nf.type,client_name:nf.client.trim()||null,brand_id:nf.brand||null,sections:build(nf.type,nf.keys),updated_by:me.email}).select().single(),'建立手冊');
      D.manuals.unshift(r); nf={type:'通用',keys:BASE.map(s=>s[0])}; M=null; say(`已建立「${title}」，共 ${nSteps(r)} 個步驟、${nAudit(r)} 個稽核點。逐條看過、改成客戶的做法後按「儲存」。`); location.hash='m='+r.id }) }
  if(!M) return;
  if('save' in d) return act(async()=>{ await saveM(); say('已儲存。') });
  if('print' in d){ window.print(); return }
  if('word' in d){ dlWord(M); return }
  if('copytxt' in d){ try{ await navigator.clipboard.writeText(docText(M)); say('已複製全文，可以貼到 LINE 或文件。') }catch(x){ say('瀏覽器不讓複製，請改用「下載 Word」。',true) } return }
  if('pub' in d){ if(armed!=='pub') return arm('pub'); armed=null; return act(publish) }
  if('addt' in d){ M.sections[+d.addt].steps.push({id:uid(),text:'',std:'',role:'全員',audit:false}); markDirty(); render(); const r=document.querySelectorAll(`.sec[data-si="${d.addt}"] .st textarea[data-f=text]`); r.length&&r[r.length-1].focus(); return }
  if('mv' in d){ const [si,ti,k]=d.mv.split('|').map(Number), a=M.sections[si].steps; [a[ti],a[ti+k]]=[a[ti+k],a[ti]]; markDirty(); render(); return }
  if('dt' in d){ if(armed!=='t'+d.dt) return arm('t'+d.dt); armed=null; const [si,ti]=d.dt.split('|').map(Number); M.sections[si].steps.splice(ti,1); markDirty(); render(); return }
  if('smv' in d){ const [si,k]=d.smv.split('|').map(Number), a=M.sections; [a[si],a[si+k]]=[a[si+k],a[si]]; markDirty(); render(); return }
  if('ds' in d){ if(armed!=='s'+d.ds) return arm('s'+d.ds); armed=null; M.sections.splice(+d.ds,1); markDirty(); render(); return }
  if('adds' in d){ M.sections.push({id:uid(),key:'custom',name:'新章節',when:'',cat:'其他',steps:[{id:uid(),text:'',std:'',role:'全員',audit:false}]}); markDirty(); render(); return }
  if('dup' in d) return act(async()=>{ const r=await q(sbc.from('sop_manuals').insert({title:M.title+'（複本）',biz_type:M.biz_type,client_name:null,brand_id:null,sections:JSON.parse(JSON.stringify(M.sections).replace(/"id":"[a-z0-9]+"/g,()=>'"id":"'+uid()+'"')),updated_by:me.email}).select().single(),'複製');
    D.manuals.unshift(r); M=null; dirty=false; say('已複製一份。改客戶名稱、對應品牌後就能交付。'); location.hash='m='+r.id });
  if('delm' in d){ if(armed!=='m') return arm('m'); armed=null; return act(async()=>{ await q(sbc.from('sop_manuals').delete().eq('id',M.id),'刪除'); D.manuals=D.manuals.filter(x=>x.id!==M.id); M=null; dirty=false; say('已刪除手冊（已交付到門市的內容不受影響）。'); location.hash='' }) }
});
window.addEventListener('hashchange',()=>{ const r=route(); if(M&&dirty&&String(r.m)!==String(M.id)){ say('上一本手冊有修改沒有存，已放棄那些修改。',true); M=null; dirty=false } else { say(flash&&!flashBad?flash:''); flash='' } armed=null; render(); scrollTo(0,0) });
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue='' } });
sbc.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
load();
</script>
