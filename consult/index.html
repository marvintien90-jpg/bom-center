<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顧問工作台｜品牌加辣餐飲顧問工作室</title>
<link rel="stylesheet" href="kit/kit.css" data-kit>
<style>
:root{
  --bg:#f2f4f3; --panel:#ffffff; --line:#e0e5e2; --fg:#16201c; --mute:#5d6a65;
  --accent:#0f6b5c; --accent-soft:#dcefea; --on-accent:#ffffff;
  --good:#1d7a46; --good-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fbeecb; --bad:#b3261e; --bad-bg:#fbe1de;
  --field:#f6f8f7; --side:#0e2a24; --side-fg:#d6e6e1; --side-mute:#8fb0a7;
  --g1:#0f6b5c; --g2:#2557c7; --g3:#a35a06; --g4:#6d3fc4; --g5:#4b5b66;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --panel:#18201d; --line:#2a3632; --fg:#e7eeeb; --mute:#98a7a1;
  --accent:#4fc3ad; --accent-soft:#1d3a34; --on-accent:#08201b;
  --good:#6fd396; --good-bg:#173524; --warn:#f0c15a; --warn-bg:#3a2e10; --bad:#ff8f86; --bad-bg:#40201d;
  --field:#141c19; --side:#0b1311; --side-fg:#d6e6e1; --side-mute:#7f9a92;
  --g1:#4fc3ad; --g2:#7ea6ff; --g3:#f0a94a; --g4:#b49bff; --g5:#a3b3bd; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.3}
a{color:var(--accent)}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}.sub{color:var(--mute);margin:0 0 12px}
button,a.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:9px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
a.btn.ghost,button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap;line-height:1.7}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--field);color:var(--mute);border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}

/* ---- 版面：左側選單＋主畫面 ---- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo .lm{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e2552b,#f2a93b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(226,85,43,.35)}
.logo b{display:block;font-size:15px;color:#fff}.logo span{font-size:12px;color:var(--side-mute)}
.nav-h{font-size:11px;letter-spacing:.08em;color:var(--side-mute);padding:14px 10px 4px}
.side button.nv{width:100%;justify-content:flex-start;background:transparent;border:0;color:var(--side-fg);padding:8px 10px;border-radius:9px;font-size:14px;gap:10px}
.side button.nv:hover{background:rgba(255,255,255,.07);box-shadow:none;transform:none}
.side button.nv.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side .nd{width:8px;height:8px;border-radius:3px;background:var(--gc,var(--side-mute))}
.side svg{width:17px;height:17px;flex:none}
.side .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:0 8px}
.side .cnt.bad{background:#e0533f;color:#fff}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--side-mute);word-break:break-all}
.side .foot .row{display:flex;gap:6px;margin-top:8px}
.side .foot a,.side .foot button{flex:1;font-size:12px;padding:5px 8px;background:rgba(255,255,255,.08);border:0;color:var(--side-fg)}
.main{padding:28px 36px 64px;max-width:1280px;width:100%}

/* ---- 標題列 ---- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:26px;margin:0}.hero p{margin:4px 0 0;color:var(--mute)}
.qa{display:flex;gap:8px;flex-wrap:wrap}

/* ---- 數字卡 ---- */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%;font:inherit;color:inherit}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,var(--accent));opacity:.85}
.stat b{display:block;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--mute);font-size:13px}
.stat.alert b{color:var(--bad)}.stat.alert{--sc:var(--bad)}
.stat:hover{transform:translateY(-2px)}

/* ---- 今日要做＋客戶旅程 ---- */
.two{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.6fr);gap:18px;margin-bottom:26px;align-items:start}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sh h2{font-size:17px;margin:0}
.todo{list-style:none;margin:0;padding:0}
.todo li a{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;text-decoration:none;color:inherit;transition:background .15s}
.todo li a:hover{background:var(--field)}
.todo .tk{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--field);color:var(--mute)}
.todo .tk.bad{background:var(--bad-bg);color:var(--bad)}.todo .tk.warn{background:var(--warn-bg);color:var(--warn)}
.todo b{font-weight:600;display:block;font-size:14px}.todo small{color:var(--mute);font-size:12px}
.empty{color:var(--mute);text-align:center;padding:22px 0;font-size:14px}
.empty .big{font-size:30px;display:block;margin-bottom:4px}

.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.col h3 .n{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--fg)}
.cc{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit;white-space:normal}
.cc:hover{border-color:var(--accent)}
.cc b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.dots i{font-style:normal;font-size:11px;border-radius:5px;padding:0 5px;background:var(--field);color:var(--mute);border:1px solid var(--line)}
.dots i.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dots i.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.more{font-size:12px;color:var(--mute);text-align:center}

/* ---- 工具箱 ---- */
.flow{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.flow button{border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mute)}
.flow button .nd{width:8px;height:8px;border-radius:3px;background:var(--gc)}
.flow button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gsec{margin:0 0 22px}
.gt{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.gt .num{width:26px;height:26px;border-radius:8px;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.gt h3{margin:0;font-size:16px}.gt span{color:var(--mute);font-size:13px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.app{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.app:hover{transform:translateY(-3px);box-shadow:var(--kit-shadow-up);border-color:color-mix(in srgb,var(--gc) 45%,var(--line))}
.app .hd{display:flex;gap:12px;align-items:center}
.app .ic{flex:none;width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--gc) 14%,transparent);color:var(--gc);display:grid;place-items:center;font-weight:800;font-size:14px}
.app h4{margin:0;font-size:15px}.app .where{font-size:12px;color:var(--mute)}
.app p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.6}
.app .go{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips a{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;text-decoration:none;color:var(--mute)}
.chips a:hover{color:var(--gc);border-color:var(--gc)}

/* ---- 客戶檔案（右側抽屜） ---- */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.38);z-index:80;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:81;box-shadow:-20px 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.dh{padding:20px 22px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.dh .x{float:right}
.dh .av{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.dh h2{margin:0;font-size:20px}
.db{padding:16px 22px 40px;overflow:auto;flex:1}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.step .sn{width:36px;height:36px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);z-index:1}
.step.done .sn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.warn .sn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.step b{display:block;font-size:14.5px}.step small{color:var(--mute);font-size:12.5px;display:block}
.step .act{display:flex;gap:6px}
.step .act a{padding:5px 11px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:6px 0 0}.kv span{color:var(--mute)}

/* ---- 手機與小螢幕 ---- */
@media (max-width:1180px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:6px}
  .logo{padding:0 8px 0 0}.nav-h,.side .foot,.side .gnav{display:none}
  .side button.nv{width:auto;padding:6px 10px}
  .main{padding:20px 16px 56px}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:22px}.pipe{grid-template-columns:1fr}.step{grid-template-columns:36px minmax(0,1fr)}.step .act{grid-column:2}}

/* ==== 2026-11-19 手機順暢度＋彈跳視窗＋動畫 ==== */
button,a.btn{min-height:38px}
.hero .qa .btn,.hero .qa button{min-height:40px}
.stat{transition:transform .2s var(--kit-ease,ease),box-shadow .2s}
.stat:hover{box-shadow:var(--kit-shadow)}
.todo li a{transition:background .15s,transform .15s}
.todo li a:hover{transform:translateX(3px)}
.todo li a .go{margin-left:auto;align-self:center;color:var(--mute);opacity:0;transition:opacity .15s,transform .15s}
.todo li a:hover .go{opacity:1;transform:translateX(2px)}
.cc{transition:border-color .15s,transform .15s,box-shadow .15s}
.cc:hover{transform:translateY(-1px);box-shadow:var(--kit-shadow)}
/* 進場：只在第一次載入時依序浮現 */
.enter .stat,.enter .card,.enter .app,.enter .gt{animation:up .45s var(--kit-ease,ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#tools .apps .app{animation:pop .3s var(--kit-ease,ease) both;animation-delay:calc(var(--i,0)*30ms)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.flow{scroll-behavior:smooth}
/* 彈跳視窗（桌機置中、手機由下往上） */
.sheet-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.sheet-wrap .scrim{position:absolute;z-index:0}
.sheet{position:relative;z-index:1;width:min(460px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.25);padding:20px 20px 18px;animation:zoom .26s var(--kit-ease,ease)}
@keyframes zoom{from{opacity:0;transform:translateY(8px) scale(.96)}}
.sheet.out{animation:zoomout .18s ease-in forwards}.sheet-wrap.out .scrim{animation:fadeout .18s forwards}
@keyframes zoomout{to{opacity:0;transform:translateY(8px) scale(.97)}}@keyframes fadeout{to{opacity:0}}
.sheet h2{margin:0 0 4px;font-size:18px}.sheet .x{position:absolute;top:12px;right:12px;min-height:34px;width:34px;padding:0;border-radius:50%}
.sheet .grab{display:none}
.menu{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.menu a,.menu button{width:100%;justify-content:flex-start;text-align:left;padding:11px 12px;border-radius:12px;white-space:normal;gap:12px;min-height:52px}
.menu .mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--gc,var(--accent)) 14%,transparent);color:var(--gc,var(--accent))}
.menu b{display:block;font-size:14.5px}.menu small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.linkbox{display:flex;gap:8px;margin:12px 0 4px}.linkbox input{flex:1;min-width:0;font:inherit;font-size:13px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:inherit}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.srcs button{font-size:13px;padding:5px 12px;min-height:34px;border-radius:999px}
.sheet .foot2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* 手機底部分頁列（桌機隱藏） */
.tabbar,.topbar,.fab,.hero .avatar{display:none}
@media (max-width:900px){
  .side{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}.main{min-width:0}
  html,body{overflow-x:clip}
  .topbar{display:flex;position:sticky;top:0;z-index:50;align-items:center;gap:10px;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--side) 96%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);color:#fff}
  .topbar .lm{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#e2552b,#f2a93b);display:grid;place-items:center;font-weight:800}
  .topbar b{font-size:16px;flex:1}
  .topbar button{min-height:36px;width:36px;padding:0;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:700}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex-direction:column;gap:2px;min-height:52px;background:transparent;border:0;color:var(--mute);font-size:11px;padding:4px 0;border-radius:12px;position:relative}
  .tabbar button svg{width:22px;height:22px;transition:transform .2s var(--kit-ease,ease)}
  .tabbar button.on{color:var(--accent);font-weight:600}.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
  .tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);animation:pop .25s}
  .tabbar .cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#e0533f;color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-weight:700}
  .tabbar .plus{width:48px;height:48px;min-height:48px;margin:-18px auto 0;border-radius:16px;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;font-size:26px;font-weight:400}
  .main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .hero{margin-bottom:14px;position:relative;padding-right:48px}.hero .avatar{display:grid;place-items:center;position:absolute;right:0;top:2px;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:0;font-weight:800}.hero h1{font-size:21px}.hero p{font-size:13px}.hero .qa{display:none}
  .stats{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px 16px;scroll-padding-inline:16px;padding:2px 16px 6px;scrollbar-width:none}
  .stats::-webkit-scrollbar,.flow::-webkit-scrollbar,.pipe::-webkit-scrollbar{display:none}
  .stat{flex:0 0 38%;scroll-snap-align:start;padding:12px 12px}.stat b{font-size:24px}.stat span{font-size:12px;white-space:nowrap}
  .card{padding:16px;border-radius:16px}
  .todo li a{padding:12px 8px;min-height:56px}.todo li a .go{opacity:1}
  .pipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;scroll-padding-inline:16px;padding:0 16px 4px;scrollbar-width:none}
  .col{flex:0 0 78%;scroll-snap-align:start}
  .cc{padding:11px 12px;min-height:56px}
  .swipe{display:block;font-size:12px;color:var(--mute);margin:8px 0 0;text-align:center}
  .flow{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
  .flow button{flex:none;min-height:36px}
  .apps{grid-template-columns:1fr;gap:10px}
  .app{padding:14px;border-radius:16px}.app:hover{transform:none}
  .app p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .app.open p{-webkit-line-clamp:unset;display:block}
  .app .go{display:grid;grid-template-columns:1fr 1fr;gap:8px}.app .go>:only-child,.app .go>:first-child:nth-last-child(odd){grid-column:1/-1}
  .app .go .btn,.app .go button{min-height:44px;width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}.chips a{flex:none;padding:4px 11px}
  /* 客戶檔案：手機改成由下往上的抽屜 */
  .drawer{top:auto;left:0;width:100%;height:92vh;border-radius:20px 20px 0 0;animation:sheetup .34s var(--kit-ease,ease)}
  .drawer .dh{border-radius:20px 20px 0 0;padding-top:24px;position:relative}
  .drawer .dh::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
  .drawer.out{animation:sheetdown .22s ease-in forwards}
  .db{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .step .act a{min-height:40px}
  .sheet-wrap{place-items:end center;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:20px 20px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));animation:sheetup .3s var(--kit-ease,ease)}
  .sheet.out{animation:sheetdown .2s ease-in forwards}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-12px auto 10px}
  .kit-toasts{bottom:calc(84px + env(safe-area-inset-bottom));right:16px;left:16px;align-items:stretch}
}
@media (min-width:901px){.swipe{display:none}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetdown{to{transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}

<script>

   go:[['打開 Claude 專案','https://claude.ai/projects']]},

 {k:'g4',t:'總部建置',s:'多店、加盟與標準化',items:[

 {k:'g5',t:'客戶與帳號',s:'授權、訂閱與人資',items:[
  {ic:'入',name:'業主入口（總覽）',desc:'每位業主可以進哪些系統、授權到期日。',where:'網頁',go:[['打開業主總覽',PORTAL]]},
  {ic:'訂',name:'訂閱與會員管理',desc:'訂閱、試點名單、付款、發票與設定。',where:'管理員',go:[['進入訂閱管理',BOM+'member/']]},

const STAGE_COLS=[['名單','健檢名單'],['洽談中','洽談中'],['輔導中','輔導中'],['暫停','暫停／結案']];

let me=null, ok=false, D=null, filt='all', view='home', first=true;
const day=864e5, todayStr=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const ago=d=>Math.floor((Date.now()-new Date(d))/day);
async function rows(qb){ try{ const r=await qb; return r.error?null:(r.data||[]) }catch(_){ return null } }

async function load(){
  const {data:{session}}=await sbc.auth.getSession(); me=session&&session.user||null; ok=false; D=null;
  if(me){
    const p=await sbc.from('bom_profiles').select('role,status').eq('user_id',me.id).maybeSingle();
    ok=!!(p.data&&p.data.role==='admin'&&p.data.status==='active');
    if(ok) await loadData();
  }
  render();
}
async function loadData(){
  const r=await Promise.all([
    rows(sbc.from('checkup_leads').select('id,brand,contact_name,status,created_at,status_at,total,biz_type,stores,phone,line_id,email,source').order('created_at',{ascending:false}).limit(1000)),
    rows(sbc.from('coach_clients').select('*').order('name')),
    rows(sbc.from('coach_actions').select('id,client_id,title,status,due_on,priority').order('due_on',{ascending:true})),
    rows(sbc.from('coach_visits').select('client_id,visit_on').order('visit_on',{ascending:false}).limit(1000)),
    rows(sbc.from('org_plans').select('id,client_id,client_name,stores,target_stores,updated_at')),
    rows(sbc.from('fr_plans').select('id,name,status,coach_client_id,brand_id,updated_at')),
    rows(sbc.from('sop_manuals').select('id,title,status,version,brand_id,coach_client_id,updated_at')),
    rows(sbc.from('qsc_audits').select('brand_id,score,audit_date,kind,open_count,overdue_count').order('audit_date',{ascending:false}).limit(500)),
    rows(sbc.from('bom_brands').select('id,name').order('name'))
  ]);
  const k=['leads','clients','actions','visits','org','fr','sop','qsc','brands'];
  D={}; k.forEach((n,i)=>D[n]=r[i]||[]); D.leadsOk=!!r[0];
}

/* ---------- 計算 ---------- */
function leadStats(){
  if(!D.leadsOk) return null;
  const L=D.leads, now=Date.now(), m0=new Date(new Date(now+8*3600e3).toISOString().slice(0,7)+'-01T00:00:00+08:00');
  return {todo:L.filter(l=>l.status==='新名單').length,
    late:L.filter(l=>(l.status==='新名單'&&now-new Date(l.created_at)>=day)||(l.status==='已聯絡'&&now-new Date(l.status_at||l.created_at)>=3*day)).length,
    month:L.filter(l=>new Date(l.created_at)>=m0).length, won:L.filter(l=>l.status==='已成交').length};
}
const convertedLead=id=>D.clients.find(c=>c.lead_id===id);
function links(c){
  const org=D.org.find(x=>x.client_id===c.id), fr=D.fr.find(x=>x.coach_client_id===c.id)||(c.brand_id&&D.fr.find(x=>x.brand_id===c.brand_id));
  const sop=D.sop.find(x=>x.coach_client_id===c.id)||(c.brand_id&&D.sop.find(x=>x.brand_id===c.brand_id));
  const qsc=c.brand_id&&D.qsc.find(x=>x.brand_id===c.brand_id);
  const lead=c.lead_id&&D.leads.find(l=>l.id===c.lead_id);
  const acts=D.actions.filter(a=>a.client_id===c.id&&a.status!=='已完成'), t=todayStr();
  const late=acts.filter(a=>a.due_on&&a.due_on<t);
  const lastV=(D.visits.find(v=>v.client_id===c.id)||{}).visit_on||null;
  const visitDue=c.stage==='輔導中'&&(!lastV||ago(lastV)>=(c.visit_every_days||14));
  return {org,fr,sop,qsc,lead,acts,late,lastV,visitDue};
}
function todos(){
  const out=[], t=todayStr();
  for(const l of D.leads){
    if(convertedLead(l.id)) continue;
    if(l.status==='新名單'&&ago(l.created_at)>=1) out.push({w:3,k:'bad',ic:'單',t:`聯絡健檢名單：${l.brand||l.contact_name||'未命名'}`,s:`${ago(l.created_at)} 天沒聯絡｜健檢 ${l.total??'-'} 分`,u:BOM+'checkup/leads/?id='+l.id});
    else if(l.status==='已聯絡'&&ago(l.status_at||l.created_at)>=3) out.push({w:2,k:'warn',ic:'單',t:`追蹤：${l.brand||l.contact_name||'未命名'}`,s:`${ago(l.status_at||l.created_at)} 天沒進展`,u:BOM+'checkup/leads/?id='+l.id});
  }
  for(const c of D.clients){ if(c.stage!=='輔導中') continue; const x=links(c);
    x.late.forEach(a=>out.push({w:3,k:'bad',ic:'辦',t:a.title,s:`${c.name}｜逾期 ${ago(a.due_on)} 天`,u:C+'coach/#c='+c.id+'&t=actions'}));
    if(x.visitDue) out.push({w:1,k:'warn',ic:'訪',t:`該訪視了：${c.name}`,s:x.lastV?`上次 ${x.lastV}（${ago(x.lastV)} 天前）`:'還沒有訪視紀錄',u:C+'coach/#c='+c.id+'&t=visits'});
    if(x.qsc&&x.qsc.overdue_count>0) out.push({w:2,k:'warn',ic:'稽',t:`稽核改善逾期：${c.name}`,s:`${x.qsc.overdue_count} 項逾期｜最近 ${x.qsc.score??'-'} 分`,u:C+'sop/#audit'});
  }
  return out.sort((a,b)=>b.w-a.w);
}

/* ---------- 畫面 ---------- */
const ICO={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>'};
function side(st,td){
  const gn=GROUPS.map((g,i)=>`<button type="button" class="nv" data-jump="${g.k}" style="--gc:var(--${g.k})"><span class="nd"></span>${i+1}. ${esc(g.t)}</button>`).join('');
  return `<aside class="side"><div class="logo"><div class="lm">辣</div><div><b>顧問工作台</b><span>品牌加辣餐飲顧問</span></div></div>
   <div class="nav-h">工作</div>
   <button type="button" class="nv on" data-jump="top">${ICO.home}今日總覽</button>
   <button type="button" class="nv" data-jump="todo">${ICO.check}今日要做${td?`<span class="cnt ${td>0?'bad':''}">${td}</span>`:''}</button>
   <button type="button" class="nv" data-jump="clients">${ICO.users}客戶旅程<span class="cnt">${D.clients.filter(c=>c.stage!=='結案').length}</span></button>
   <button type="button" class="nv" data-jump="tools">${ICO.grid}工具箱</button>
   <div class="gnav"><div class="nav-h">顧問流程</div>${gn}</div>
   <div class="foot">${esc(me.email)}<div class="row"><a class="btn" href="${PORTAL}">業主入口</a><button type="button" data-sheet="out">登出</button></div></div></aside>`;
}
function hero(){
  const h=new Date(Date.now()+8*3600e3).getUTCHours(), g=h<11?'早安':h<14?'午安':h<18?'午安':'晚安';
  const d=new Date(Date.now()+8*3600e3), wd='日一二三四五六'[d.getUTCDay()];
  return `<header class="hero" id="top"><button type="button" class="avatar kit-calm" data-sheet="me" aria-label="帳號">${esc((me.email||'?').slice(0,1).toUpperCase())}</button><div><h1>${g}，今天也辛苦了</h1><p>${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日（週${wd}）｜顧問專用，業主看不到這一頁</p></div>
   <div class="qa"><a class="btn" href="${C}coach/#todo">全部待辦</a><button type="button" data-sheet="share">分享健檢連結</button><button type="button" class="pri" data-sheet="add">＋ 新增</button></div></header>`;
}
function stats(){
  const st=leadStats(), t=todayStr();
  const act=D.clients.filter(c=>c.stage==='輔導中');
  const late=D.actions.filter(a=>a.status!=='已完成'&&a.due_on&&a.due_on<t&&act.some(c=>c.id===a.client_id)).length;
  const s=(n,l,col,jump,alert)=>`<button type="button" class="stat ${alert&&n?'alert':''}" style="--sc:${col}" data-jump="${jump}"><b data-count="${n??0}">${n??'-'}</b><span>${l}</span></button>`;
  return `<div class="stats">${st?s(st.todo,'新名單待聯絡','var(--g1)','todo')+s(st.late,'該追蹤（逾期）','var(--warn)','todo',true):''}
   ${s(act.length,'輔導中客戶','var(--g3)','clients')}${s(late,'輔導待辦逾期','var(--bad)','todo',true)}
   ${st?s(st.month,'本月新健檢','var(--g2)','clients')+s(st.won,'累計成交','var(--good)','clients'):''}</div>`;
}
function todoCard(list){
  const top=list.slice(0,8);
  return `<section class="card" id="todo"><div class="sh"><h2>今日要做</h2><span class="pill ${list.length?'bad':'good'}">${list.length?list.length+' 項':'全部完成'}</span></div>
   ${top.length?`<ul class="todo">${top.map(x=>`<li><a href="${esc(x.u)}"><span class="tk ${x.k}">${esc(x.ic)}</span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="go" aria-hidden="true">›</span></a></li>`).join('')}</ul>${list.length>8?`<p class="more">還有 ${list.length-8} 項，到營運輔導「全部待辦」或名單管理看。</p>`:''}`
   :`<div class="empty"><span class="big">✓</span>今天沒有逾期的事，可以專心做提案。</div>`}</section>`;
}
function dots(c){
  const x=links(c), d=(on,l,bad)=>`<i class="${bad?'bad':on?'on':''}">${l}</i>`;
  return `<div class="dots">${d(x.lead,'健檢')}${d(1,'輔導',x.late.length)}${d(x.org,'組織')}${d(x.fr,'加盟')}${d(x.sop,'SOP')}${d(c.brand_id,'BOM')}</div>`;
}
function pipe(){
  const L=D.leads.filter(l=>['新名單','已聯絡','已預約'].includes(l.status)&&!convertedLead(l.id));
  const cols={名單:L,洽談中:D.clients.filter(c=>c.stage==='洽談中'),輔導中:D.clients.filter(c=>c.stage==='輔導中'),暫停:D.clients.filter(c=>c.stage==='暫停'||c.stage==='結案')};
  const card=(k,x)=>k==='名單'?`<button type="button" class="cc" data-open="l=${x.id}"><b>${esc(x.brand||x.contact_name||'未命名')}</b><small>健檢 ${x.total??'-'} 分｜${esc(x.status)}｜${ago(x.created_at)} 天前</small></button>`
    :`<button type="button" class="cc" data-open="c=${x.id}"><b>${esc(x.name)}</b><small>${esc([x.biz_type,x.stores?x.stores+' 店':'',x.stage==='結案'?'已結案':''].filter(Boolean).join('｜')||'—')}</small>${dots(x)}</button>`;
  return `<section class="card" id="clients"><div class="sh"><h2>客戶旅程</h2><span class="note" style="margin:0">點客戶看他在每個工具的進度</span></div>
   <div class="pipe">${STAGE_COLS.map(([k,l])=>{const xs=cols[k]; return `<div class="col"><h3>${l}<span class="n">${xs.length}</span></h3>${xs.slice(0,6).map(x=>card(k,x)).join('')||'<p class="more">（沒有）</p>'}${xs.length>6?`<p class="more">還有 ${xs.length-6} 位</p>`:''}</div>`}).join('')}</div><span class="swipe">← 左右滑動看各階段 →</span></section>`;
}
function appCard(x,g){
  const go=x.go.map((b,i)=>`<a class="btn ${i?'':'pri'}" href="${esc(b[1])}"${/^https:\/\/(claude\.ai|docs\.google)/.test(b[1])?' target="_blank" rel="noopener"':''}>${esc(b[0])}</a>`).join('')
    +(x.copy?`<button type="button" data-sheet="share">分享給業主</button>`:'');
  const chips=x.chips?`<div class="chips">${x.chips.map(c=>`<a href="${esc(BOM+'#'+c[1])}">${esc(c[0])}</a>`).join('')}</div>`:'';
  const st=leadStats(), badge=x.stat&&st&&st.todo?`<span class="pill ${st.late?'bad':'warn'}" style="margin-left:auto">${st.todo} 筆新名單</span>`:'';
  return `<article class="app" style="--gc:var(--${g.k})"><div class="hd"><div class="ic" aria-hidden="true">${esc(x.ic)}</div><div><h4>${esc(x.name)}</h4><div class="where">${esc(x.where)}</div></div>${badge}</div><p>${esc(x.desc)}</p>${chips}<div class="go">${go}</div></article>`;
}
function tools(){
  const gs=GROUPS.filter(g=>filt==='all'||filt===g.k);
  return `<section id="tools" style="margin-top:6px"><div class="sh"><h2>工具箱</h2><span class="note" style="margin:0">依顧問流程排列</span></div>
   <div class="flow" role="tablist"><button type="button" role="tab" data-filt="all" class="${filt==='all'?'on':''}">全部</button>${GROUPS.map((g,i)=>`<button type="button" role="tab" data-filt="${g.k}" class="${filt===g.k?'on':''}" style="--gc:var(--${g.k})"><span class="nd"></span>${i+1}. ${esc(g.t)}</button>`).join('')}</div>
   ${gs.map(g=>`<div class="gsec" id="${g.k}" style="--gc:var(--${g.k})"><div class="gt"><span class="num">${GROUPS.indexOf(g)+1}</span><h3>${esc(g.t)}</h3><span>${esc(g.s)}</span></div><div class="apps">${g.items.map(x=>appCard(x,g)).join('')}</div></div>`).join('')}
   <p class="note">網頁系統都在雲端，不用開你的電腦；「Claude」標示的要登入 claude.ai。要加新系統，改這一頁的 GROUPS 清單即可。</p></section>`;
}

/* ---------- 客戶檔案 ---------- */
function stepRow(n,state,title,info,acts){
  return `<li class="step ${state}"><span class="sn">${state==='done'?'✓':n}</span><div><b>${esc(title)}</b><small>${info}</small></div><div class="act">${acts.map(([l,u,p,ext])=>`<a class="btn ${p?'pri':''}" href="${esc(u)}"${ext?' target="_blank" rel="noopener"':''}>${esc(l)}</a>`).join('')}</div></li>`;
}
function drawerClient(c){
  const x=links(c), bn=c.brand_id&&(D.brands.find(b=>b.id===c.brand_id)||{}).name;
  const steps=[
    stepRow(1,x.lead?'done':'', '經營健檢', x.lead?`${x.lead.total??'-'} 分｜${esc(x.lead.created_at.slice(0,10))}填寫`:'沒有健檢紀錄，可以請業主填一份當基準',
      x.lead?[['看健檢與作業包',BOM+'checkup/leads/?id='+x.lead.id]]:[['打開健檢頁',BOM+'checkup/',0,1]]),
    stepRow(2,x.late.length?'warn':'done','營運輔導',`未完成待辦 ${x.acts.length} 項${x.late.length?`（逾期 ${x.late.length}）`:''}｜${x.lastV?'上次訪視 '+esc(x.lastV):'還沒訪視'}${x.visitDue?'｜該訪視了':''}`,
      [['打開',C+'coach/#c='+c.id,1],['業主報告',C+'coach/#c='+c.id+'&t=report']]),
    stepRow(3,x.org?'done':'','總部組織診斷',x.org?`${x.org.stores||'-'} 店 → 目標 ${x.org.target_stores||'-'} 店｜更新 ${esc(String(x.org.updated_at||'').slice(0,10))}`:'多店或準備展店時做',
      x.org?[['打開',C+'org/#p='+x.org.id]]:[['＋ 建立',C+'org/#t=new&client='+c.id]]),
    stepRow(4,x.fr?'done':'','加盟體系',x.fr?`${esc(x.fr.status)}｜${esc(x.fr.name)}`:'要開放加盟時做準備度健檢',
      x.fr?[['打開',C+'franchise/#p='+x.fr.id]]:[['＋ 建立',C+'franchise/#new&client='+c.id]]),
    stepRow(5,x.sop?(x.qsc&&x.qsc.overdue_count?'warn':'done'):'','SOP 與督導稽核',(x.sop?`${esc(x.sop.title)}（${esc(x.sop.status)}，第 ${x.sop.version||1} 版）`:'還沒有 SOP 手冊')+(x.qsc?`｜最近稽核 ${x.qsc.score??'-'} 分${x.qsc.overdue_count?`，${x.qsc.overdue_count} 項逾期`:''}`:''),
      x.sop?[['打開',C+'sop/#m='+x.sop.id]]:[['＋ 建立',C+'sop/#new&client='+c.id]]),
    stepRow(6,c.brand_id?'done':'','BOM 與損益',c.brand_id?`BOM 品牌：${esc(bn||c.brand_id)}${c.pl_client?`｜損益中心：${esc(c.pl_client)}`:''}`:'還沒連結 BOM 品牌（到營運輔導「設定」選）',
      c.brand_id?[['每月月報',BOM+'#mrep&b='+encodeURIComponent(c.brand_id)],['菜單四象限',BOM+'#matrix&b='+encodeURIComponent(c.brand_id)]].concat(c.pl_client?[['損益中心',PL]]:[]):[['去連結',C+'coach/#c='+c.id+'&t=edit']]),
    stepRow(7,'','立地評估與品牌提案','展店選址、品牌升級提案時用',[['立地評估',BOM+'site/'],['案件工作台','https://claude.ai/artifact/DEjP3mWn57z1SkgkkVhQMe',0,1]])
  ].join('');
  return `<div class="dh"><a class="btn ghost x" href="#" aria-label="關閉">✕</a><div style="display:flex;gap:14px;align-items:center"><div class="av">${esc(c.name.slice(0,1))}</div><div><h2>${esc(c.name)}</h2><div class="note" style="margin:2px 0 0"><span class="pill ${c.stage==='輔導中'?'good':'mute'}">${esc(c.stage)}</span> ${esc([c.biz_type,c.stores?c.stores+' 店':'',c.contact_name,c.phone].filter(Boolean).join('｜'))}</div></div></div></div>
   <div class="db"><a class="btn pri" style="width:100%;margin:0 0 10px" href="${C}case/#c=${c.id}">打開客戶全景：數字、診斷與下一步 →</a><p class="note" style="margin:0 0 6px">同一位客戶在每個工具的進度。按「＋ 建立」會自動帶入客戶名稱與連結，不用重打。</p><ul class="steps">${steps}</ul></div>`;
}
function drawerLead(l){
  const c=convertedLead(l.id);
  return `<div class="dh"><a class="btn ghost x" href="#" aria-label="關閉">✕</a><div style="display:flex;gap:14px;align-items:center"><div class="av">${esc((l.brand||l.contact_name||'?').slice(0,1))}</div><div><h2>${esc(l.brand||'（未填品牌）')}</h2><div class="note" style="margin:2px 0 0"><span class="pill warn">${esc(l.status)}</span> 健檢名單</div></div></div></div>
   <div class="db"><div class="card"><div class="kv"><span>健檢分數</span><b>${l.total??'-'} 分</b><span>聯絡人</span><div>${esc(l.contact_name||'')}</div>${l.phone?`<span>電話</span><div><a href="tel:${esc(l.phone)}">${esc(l.phone)}</a></div>`:''}${l.line_id?`<span>LINE</span><div>${esc(l.line_id)}</div>`:''}${l.email?`<span>Email</span><div>${esc(l.email)}</div>`:''}<span>業態／店數</span><div>${esc([l.biz_type,l.stores?l.stores+' 店':''].filter(Boolean).join('｜')||'—')}</div><span>填寫</span><div>${esc(String(l.created_at).slice(0,10))}（${ago(l.created_at)} 天前）</div></div>
   <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${c?`<a class="btn pri" href="#c=${c.id}">看客戶檔案</a>`:`<a class="btn pri" href="${C}coach/#new&lead=${l.id}">轉成輔導客戶 →</a>`}<a class="btn" href="${BOM}checkup/leads/?id=${l.id}">看作業包與話術</a></div>
   <p class="note">轉成輔導客戶後，名稱、聯絡方式、業態與店數會自動帶入；之後組織診斷、加盟、SOP 都從這位客戶帶入。</p></div></div>`;
}
function drawer(){
  const p=new URLSearchParams(location.hash.slice(1)), cid=+p.get('c'), lid=+p.get('l');
  let body='';
  if(cid){const c=D.clients.find(x=>x.id===cid); body=c?drawerClient(c):`<div class="db"><p>找不到這位客戶。</p><a class="btn" href="#">關閉</a></div>`; if(c&&window.Kit) Kit.store.set(c.id)}
  else if(lid){const l=D.leads.find(x=>x.id===lid); body=l?drawerLead(l):`<div class="db"><p>找不到這筆名單。</p><a class="btn" href="#">關閉</a></div>`}
  let el=$('#drawer');
  if(!body){ if(el) el.remove(); document.body.style.overflow=''; return }
  if(!el){el=document.createElement('div');el.id='drawer';document.body.appendChild(el)}
  el.innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="客戶檔案">${body}</aside>`;
  document.body.style.overflow='hidden'; swipeClose(el.querySelector('.drawer'),closeDrawer);
}

function render(){
  const root=$('#root');
  if(!me){ root.innerHTML=`<div class="main" style="max-width:520px;margin:40px auto"><div class="card"><h2>請先登入</h2><p class="sub">顧問工作台和業主入口用同一組帳號，登入一次兩邊都能用。</p><a class="btn pri" href="${PORTAL}">到入口登入</a></div></div>`; return }
  if(!ok){ root.innerHTML=`<div class="main" style="max-width:560px;margin:40px auto"><div class="card"><h2>這一頁只開放顧問使用</h2><p class="sub">你的帳號可以使用的系統都在業主入口。</p><a class="btn pri" href="${PORTAL}">回業主入口</a></div></div>`; return }
  const td=todos();
  root.innerHTML=`<div class="shell${first?' enter':''}">${side(leadStats(),td.length)}${topbar()}<main class="main" id="app">${hero()}${stats()}<div class="two">${todoCard(td)}${pipe()}</div>${tools()}</main></div>${tabbar(td.length)}`;
  stagger(root); first=false; spy();
  if(window.Kit) Kit.countUp(root);
  drawer();
}
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]');
  if(c){ try{await navigator.clipboard.writeText(c.dataset.copy); toast('已複製健檢連結，可以直接貼給業主。','ok')}catch(_){toast('瀏覽器不讓複製，請手動複製：'+c.dataset.copy,'bad')} return }
  if(e.target.closest('[data-out]')){ await sbc.auth.signOut(); location.href=PORTAL; return }
  const o=e.target.closest('[data-open]'); if(o){ location.hash=o.dataset.open; return }
  if(e.target.closest('[data-close]')){ location.hash=''; return }
  const f=e.target.closest('[data-filt]'); if(f){ filt=f.dataset.filt; const t=$('#tools'); t.outerHTML=tools(); stagger($('#tools'),'.app'); f.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); return }
  const j=e.target.closest('[data-jump]');
  if(j){ const k=j.dataset.jump; if(/^g\d$/.test(k)&&filt!=='all'&&filt!==k){filt='all'; $('#tools').outerHTML=tools()}
    const t=document.getElementById(k); if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.side .nv').forEach(b=>b.classList.toggle('on',b===j));
    if(k==='todo'||k==='clients'){const el=document.getElementById(k); el.animate&&el.animate([{boxShadow:'0 0 0 3px var(--accent)'},{boxShadow:'0 0 0 0 transparent'}],{duration:900})} }
});

/* ---------- 手機頂列、底部分頁、彈跳視窗、動畫 ---------- */
function topbar(){ return '' }
function tabbar(td){
  const t=(k,ic,l,extra='')=>`<button type="button" data-jump="${k}" data-tab="${k}"${k==='top'?' class="on"':''}>${ic}<span>${l}</span>${extra}</button>`;
  return `<nav class="tabbar kit-calm" aria-label="快速切換">${t('top',ICO.home,'總覽')}${t('todo',ICO.check,'要做',td?`<span class="cnt">${td>99?'99+':td}</span>`:'')}<button type="button" data-sheet="add" aria-label="新增"><span class="plus">＋</span></button>${t('clients',ICO.users,'客戶')}${t('tools',ICO.grid,'工具')}</nav>`;
}
function stagger(root,sel){ (root||document).querySelectorAll(sel||'.stat,.card,.gt,.app').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,14))) }
let spyObs=null;
function spy(){
  if(spyObs) spyObs.disconnect(); if(!('IntersectionObserver' in window)) return;
  const ids=['top','todo','clients','tools'], seen={};
  spyObs=new IntersectionObserver(es=>{ es.forEach(e=>seen[e.target.id]=e.isIntersecting);
    const cur=ids.slice().reverse().find(k=>seen[k])||'top';
    document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===cur)) },{rootMargin:'-35% 0px -55% 0px'});
  ids.forEach(k=>{const el=document.getElementById(k); if(el) spyObs.observe(el)});
}
const SRC=[['一般','',''],['FB','s01_fb'],['IG','s01_ig'],['Threads','s01_threads'],['官網','s01_web']];
let shareSrc='';
const shareUrl=()=>BOM+'checkup/'+(shareSrc?'?src='+shareSrc:'');
function sheetBody(k){
  const mi=(ic,gc,t,s)=>`<span class="mi" style="--gc:var(--${gc})">${ic}</span><span><b>${t}</b><small>${s}</small></span>`;
  if(k==='add') return `<h2>要新增什麼？</h2><p class="note" style="margin:0">選好後會直接打開新增畫面。</p><ul class="menu">
    <li><a class="btn" href="${C}coach/#new">${mi('導','g3','輔導客戶','新客戶主檔，之後各工具都從這裡帶入')}</a></li>
    <li><a class="btn" href="${C}org/#t=new">${mi('組','g4','組織與權責診斷','多店或準備展店的客戶')}</a></li>
    <li><a class="btn" href="${C}franchise/#new">${mi('盟','g4','加盟體系方案','準備度健檢、條件與回本試算')}</a></li>
    <li><a class="btn" href="${C}sop/#new">${mi('SOP','g4','SOP 手冊','選業態產出門市 SOP')}</a></li>
    <li><a class="btn" href="${BOM}site/">${mi('址','g2','立地評估','輸入店面地址開始評估')}</a></li>
    <li><button type="button" data-sheet="share">${mi('檢','g1','分享健檢給業主','複製連結或用 LINE 傳')}</button></li></ul>`;
  if(k==='share') return `<h2>分享經營健檢</h2><p class="note" style="margin:0">選來源，名單管理就看得出業主從哪裡來。</p>
    <div class="srcs" role="group" aria-label="來源">${SRC.map(([l,v])=>`<button type="button" data-src="${v}" class="${shareSrc===v?'pri':''}">${l}</button>`).join('')}</div>
    <div class="linkbox"><input id="shareUrl" readonly value="${esc(shareUrl())}" aria-label="健檢連結"><button type="button" class="pri" data-copy-share>複製</button></div>
    <div class="foot2"><a class="btn" href="${esc(shareUrl())}" target="_blank" rel="noopener">預覽健檢頁</a><a class="btn pri" id="lineShare" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl())}" target="_blank" rel="noopener">用 LINE 傳送</a></div>`;
  if(k==='me') return `<h2>帳號</h2><p class="note" style="margin:0 0 12px;word-break:break-all">${esc(me.email)}</p><ul class="menu">
    <li><a class="btn" href="${PORTAL}">${mi('入','g5','業主入口','切換到業主看到的畫面與總覽')}</a></li>
    <li><button type="button" data-sheet="out">${mi('出','g5','登出','這台裝置會登出工作台與業主入口')}</button></li></ul>`;
  if(k==='out') return `<h2>確定要登出嗎？</h2><p class="note">這台裝置上的顧問工作台和業主入口會一起登出。</p><div class="foot2"><button type="button" data-close-sheet>取消</button><button type="button" class="pri" data-out>登出</button></div>`;
  return '';
}
function openSheet(k){
  let w=$('#sheet'); const body=sheetBody(k); if(!body) return;
  if(!w){ w=document.createElement('div'); w.id='sheet'; w.className='sheet-wrap'; document.body.appendChild(w);
    w.innerHTML=`<div class="scrim" data-close-sheet></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button type="button" class="ghost x kit-calm" data-close-sheet aria-label="關閉">✕</button><div class="sb"></div></div>`;
    document.body.style.overflow='hidden'; swipeClose(w.querySelector('.sheet'),closeSheet) }
  else { const sh=w.querySelector('.sheet'); sh.style.animation='none'; sh.offsetHeight; sh.style.animation='' }
  w.dataset.k=k; w.querySelector('.sb').innerHTML=body;
  const f=w.querySelector('.sb a,.sb button'); if(f) f.focus({preventScroll:true});
}
function closeSheet(){
  const w=$('#sheet'); if(!w||w.classList.contains('out')) return;
  w.classList.add('out'); w.querySelector('.sheet').classList.add('out');
  setTimeout(()=>{ w.remove(); if(!$('#drawer')) document.body.style.overflow='' },190);
}
function swipeClose(el,done){
  let y0=null,dy=0;
  el.addEventListener('touchstart',e=>{ if(el.scrollTop>0&&!e.target.closest('.dh,.grab')) return; y0=e.touches[0].clientY; dy=0; el.style.transition='none' },{passive:true});
  el.addEventListener('touchmove',e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); el.style.transform=dy?`translateY(${dy}px)`:'' },{passive:true});
  el.addEventListener('touchend',()=>{ if(y0==null) return; el.style.transition='transform .2s'; if(dy>110) done(); else el.style.transform=''; y0=null });
}
function closeDrawer(){
  const d=$('#drawer aside'); if(!d||d.classList.contains('out')){ location.hash=''; return }
  d.classList.add('out'); const s=$('#drawer .scrim'); if(s) s.style.animation='fadeout .2s forwards';
  setTimeout(()=>{ history.replaceState(null,'',location.pathname+location.search); drawer() },200);
}
document.addEventListener('click',async e=>{
  const s=e.target.closest('[data-sheet]'); if(s){ e.preventDefault(); e.stopImmediatePropagation(); openSheet(s.dataset.sheet); return }
  if(e.target.closest('[data-close-sheet]')){ e.stopImmediatePropagation(); closeSheet(); return }
  const src=e.target.closest('[data-src]'); if(src){ e.stopImmediatePropagation(); shareSrc=src.dataset.src; openSheet('share'); return }
  if(e.target.closest('[data-copy-share]')){ e.stopImmediatePropagation(); const u=shareUrl();
    try{ await navigator.clipboard.writeText(u); toast('已複製健檢連結，可以直接貼給業主。','ok'); closeSheet() }catch(_){ const i=$('#shareUrl'); i.select(); toast('瀏覽器不讓自動複製，連結已選取，請長按複製。','bad') } return }
  if(e.target.closest('[data-close]')||e.target.closest('.drawer .x')){ e.preventDefault(); e.stopImmediatePropagation(); closeDrawer(); return }
  const app=e.target.closest('.app'); if(app&&!e.target.closest('a,button')&&matchMedia('(max-width:900px)').matches){ app.classList.toggle('open') }
},true);
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if($('#sheet')) closeSheet(); else if($('#drawer')) closeDrawer() });
window.addEventListener('hashchange',()=>{ if(D) drawer() });
sbc.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'||ev==='SIGNED_OUT') load() });
load();
</script>
